        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEstandar'
          example:
            error:
              codigo: ERR-001
              mensaje: Tu sesión expiró, inicia sesión de nuevo.
              detalles: null
    AccesoDenegado:
      description: 'ERR-002: el rol del usuario no tiene permiso para la operación.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEstandar'
          example:
            error:
              codigo: ERR-002
              mensaje: No se encuentra autorizado para realizar esta acción.
              detalles: null
    RecursoNoAccesible:
      description: 'ERR-003: el recurso es de otro comercio o de otro cliente (aislamiento, RN-12); se responde como si no existiera.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEstandar'
          example:
            error:
              codigo: ERR-003
              mensaje: El recurso solicitado no existe o no es accesible.
              detalles: null
    ErrorValidacion:
      description: 'ERR-005: validación de datos fallida. El detalle por campo viene en detalles.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEstandar'
          example:
            error:
              codigo: ERR-005
              mensaje: Revisa los datos marcados (detalle por campo en detalles).
              detalles:
                cantidad: Debe ser mayor o igual a 1.
    DependenciaNoDisponible:
      description: 'ERR-006: M2, M3 o M5 no respondieron. La operación es parte de la compra en curso: no se reintenta en segundo plano ni se confirma a medias.'
