x-versionado:
  version_candidata: 1.2.0
  politica: MAJOR para cambios incompatibles, MINOR para adiciones compatibles, PATCH para correcciones compatibles (ADR-004 y sección 4.1 del PC3).
  estado_publicacion: La versión 1.1.0 ya está publicada en contracts/m4-inventario/v1/openapi.yaml; la 1.2.0 la reemplaza en esa misma ruta.
  cambio_1_1_0: 'CS-01 a CS-04 (M1): dos operaciones existentes pasan a públicas, dos operaciones nuevas de disponibilidad por producto y dos eventos aclarados (disparador por total del comercio + id_producto).'
  cambio_1_2_0: 'Alineación con el PC3 colectivo: esquema ErrorEstandar (5.5); códigos de negocio ERR-M4-001 a ERR-M4-019; ERR-001, ERR-002, ERR-005 y ERR-006 para los errores transversales; aislamiento por comercio en 404 con ERR-003 (antes 403); respuesta 200 agotado en la consulta individual de disponibilidad; ruta base /api/m4/v1; operación de costo de productos vendidos para M7; consulta de auditoría; interfaz PHP; eventos del catálogo 4.3 con v1.0.0.'
  compatibilidad: 'El cambio de códigos de error y del HTTP del aislamiento afecta a los consumidores que leen esos códigos. La sección 5.5 y la 5.7 del PC3 lo exigen a todos los módulos (M3 y M5 ajustan el suyo). Se publica como 1.2.0 por decisión del módulo; si el Comité lo trata como cambio incompatible, debe publicarse /v2/ con convivencia mínima de 14 días (sección 4.1).'
x-interfaz-php:
  nota: 'Con Inertia, M1 llama a M4 por esta interfaz y no por HTTP (validación de M1). Cada método equivale a la
    operación REST indicada y devuelve el mismo cuerpo. Los arreglos de entrada y salida usan los nombres de campo
    de los schemas OpenAPI. Consultas públicas: no requieren usuario autenticado.'
  ubicacion: app/Contracts/M4_Inventario/InventarioModuleInterface.php
  namespace: App\Contracts\M4_Inventario
  interfaz: InventarioModuleInterface
  alcance_documentado: Las cuatro consultas de disponibilidad (M1, M3, M5). Los demás métodos se documentan al cerrar el
    contrato PHP completo.
  metodos:
  - firma: 'public function consultarStockDisponible(int $idComercio, int $idVariacion, ?int $idUbicacion = null): array'
    equivale_a: GET /existencias/disponibilidad
    parametros: idComercio y idVariacion obligatorios; idUbicacion opcional (si falta, suma todas las ubicaciones).
    retorna: 'Disponibilidad: id_comercio, id_variacion, id_ubicacion|null, cantidad_disponible, estado_disponibilidad, bajo_stock.
      Sin existencia registrada devuelve cantidad_disponible 0 y estado agotado; no lanza excepción.'
    errores: ERR-005 (parámetros inválidos).
  - firma: 'public function consultarDisponibilidadLote(array $items): array'
    equivale_a: POST /existencias/disponibilidad/lote
    parametros: '$items: lista de 1 a 100 elementos { id_comercio, id_variacion, id_ubicacion? }.'
    retorna: 'Lista de Disponibilidad en el mismo orden que $items.'
    errores: ERR-005 (lista vacía, más de 100 elementos o elemento inválido).
  - firma: 'public function consultarDisponibilidadProducto(int $idComercio, int $idProducto): array'
    equivale_a: GET /existencias/disponibilidad/producto
    parametros: idComercio e idProducto obligatorios.
    retorna: 'DisponibilidadProducto: id_comercio, id_producto, estado_disponibilidad (disponible si al menos una variación
      tiene unidades; agotado en caso contrario o si el producto no tiene existencias).'
    errores: ERR-005 (parámetros inválidos).
  - firma: 'public function consultarDisponibilidadProductoLote(array $items): array'
    equivale_a: POST /existencias/disponibilidad/producto/lote
    parametros: '$items: lista de 1 a 100 elementos { id_comercio, id_producto }.'
    retorna: 'Lista de DisponibilidadProducto en el mismo orden que $items.'
    errores: ERR-005 (lista vacía, más de 100 elementos o elemento inválido).
  doble_de_prueba: M1 puede sustituir la interfaz por un doble que devuelva estas mismas estructuras.
  eventos_dto: app/Events/M4_Inventario/{NombreEvento}.php, con id_evento (UUID), según la sección 4.1 del PC3.
  dobles_y_pruebas: tests/Doubles/M4_Inventario/ y pruebas contractuales en tests/Feature/Contracts/ (sección 4.1 del PC3).
