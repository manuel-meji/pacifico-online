- 'M5/Comité: selección de ubicación y eventual reparto multiubicación. Esta versión usa una ubicación con cantidad completa; falta ratificar el criterio de desempate.'
- 'M5/Comité: cancelación parcial y payloads de SubpedidoDespachado, PedidoCancelado y SubpedidoCancelado; impedir doble efecto de REST y evento.'
- 'M4/M7: SC-M4-07, método de valoración del costo.'
- 'M4/M5: SC-M4-08, Idempotency-Key.'
- 'Comité: orden estricto de llegada solicitado por el cliente; el bloqueo garantiza atomicidad pero no FIFO. Seleccionar el mecanismo de cola u orden antes de afirmar cumplimiento.'
- 'Núcleo/bodega: contrato de autorización previa y verificación de recepción física; no asumir que un ID suministrado acredita autorización o devolución.'
- 'Actualizar PC2: ubicación opcional en RF-M4-006, CU-M4-06, interfaz PHP y OpenAPI; estados y nombres API; el retorno de la reserva incluye ubicación y vencimiento.'
