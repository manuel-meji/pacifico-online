openapi: 3.0.3
info:
  title: Contrato de Integración - m4-inventario
  description: 'Contrato de integración v1 del módulo M4 (Inventario multiempresa) de Pacíficos Online. Incluye
    en un único archivo: API REST ofrecida por M4, dependencias síncronas consumidas y contrato de eventos publicados/consumidos.
    Proveedor de servicios para M1, M3, M5, M7 y el rol Soporte/Auditoría de la plataforma (núcleo). Consume dependencias
    de M2, M3 y M5. Todo acceso a datos de inventario desde otros módulos se realiza por los contratos aquí documentados.
    Los identificadores siguen el formato id_entidad del modelo canónico. La versión 1.2.0 alinea el contrato con las
    reglas de publicación 4.1 y el formato de error 5.5 del PC3 colectivo: esquema ErrorEstandar, códigos propios
    ERR-M4-nnn y ERR-003 en 404 para el aislamiento por comercio.'
  version: 1.2.0
  x-estado: 'Versión 1.2.0 lista para subir a contracts/m4-inventario/v1/ (reemplaza a la 1.1.0 publicada)'
servers:
- url: /api/m4/v1
  description: Servidor local / integración
security:
- bearerAuth: []
tags:
- name: Estado
- name: Disponibilidad
  description: Consulta de stock (M1, M3, M5).
- name: Reservas
  description: Ciclo de vida de la reserva (M5).
- name: Kardex
  description: Historial y kardex valorizado (M7).
- name: Auditoría
  description: Consulta de solo lectura de varios comercios (rol Soporte/Auditoría, RN-M4-015).
- name: Existencias
- name: Movimientos
- name: Ajustes
paths:
  /health:
    get:
      tags:
      - Estado
      summary: Verificación de estado del módulo
      operationId: verificarEstado
      security: []
      responses:
        '200':
          description: Módulo operando correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  module:
                    type: string
                    example: m4-inventario
  /existencias/disponibilidad:
    get:
      tags:
      - Disponibilidad
      summary: Consultar stock disponible de una variación
      description: 'Disponible = cantidad_fisica − cantidad_reservada. cantidad_reservada suma reservas ACTIVA y
        CONFIRMADA aún no consumidas ni liberadas. Valor calculado. Consumidores M1, M3 y M5. No se maneja stock
        defectuoso. Una variación sin existencia registrada no genera error: responde 200 con cantidad_disponible 0 y
        estado_disponibilidad agotado, igual que las otras tres consultas de disponibilidad (M1). Consulta pública de catálogo (CS-01, M1): no exige token ni aplica el filtro por comercio de
        RN-12, igual que el precio o la foto de un producto.'
      operationId: consultarStockDisponible
      security: []
      parameters:
      - name: id_comercio
        in: query
        required: true
        description: Comercio dueño de la existencia.
        schema:
          type: integer
          format: int64
      - name: id_variacion
        in: query
        required: true
        description: Variación consultada (acta 3.5).
        schema:
          type: integer
          format: int64
      - name: id_ubicacion
        in: query
        required: false
        description: Ubicación. Si se omite, se suman todas las del comercio.
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Disponibilidad calculada. Sin existencia registrada se devuelve agotado, no 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disponibilidad'
              examples:
                disponible:
                  value:
                    id_comercio: 104
                    id_variacion: 501
                    id_ubicacion: 12
                    cantidad_disponible: 4
                    estado_disponibilidad: disponible
                    bajo_stock: false
                sin_existencia_registrada:
                  value:
                    id_comercio: 104
                    id_variacion: 777
                    id_ubicacion: null
                    cantidad_disponible: 0
                    estado_disponibilidad: agotado
                    bajo_stock: false
        '422':
          $ref: '#/components/responses/ErrorValidacion'
  /existencias/disponibilidad/lote:
    post:
      tags:
      - Disponibilidad
      summary: Consultar disponibilidad en lote
      description: 'Operación de lectura (POST solo para admitir un cuerpo extenso). Una variación sin existencia
        no genera error: se devuelve agotada. Consulta pública de catálogo (CS-01, M1): no exige token ni aplica
        el filtro por comercio de RN-12.'
      operationId: consultarDisponibilidadLote
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisponibilidadLoteSolicitud'
            example:
              items:
              - id_comercio: 104
                id_variacion: 501
              - id_comercio: 104
                id_variacion: 502
                id_ubicacion: 12
      responses:
        '200':
          description: Disponibilidad de cada ítem, en el mismo orden.
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Disponibilidad'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
  /existencias/disponibilidad/producto:
    get:
      tags:
      - Disponibilidad
      summary: Consultar disponibilidad agregada de un producto (CS-02, M1)
      description: 'Responde disponible si al menos una variación del producto tiene unidades disponibles en el
        comercio, y agotado si ninguna tiene. Un producto sin existencias registradas se devuelve como agotado,
        sin error. Pensada para resultados de búsqueda, donde M1 aún no sabe qué variación elegirá la persona
        compradora. Consulta pública: no exige token ni aplica el filtro por comercio de RN-12.'
      operationId: consultarDisponibilidadProducto
      security: []
      parameters:
      - name: id_comercio
        in: query
        required: true
        description: Comercio dueño del producto.
        schema:
          type: integer
          format: int64
      - name: id_producto
        in: query
        required: true
        description: Producto consultado (agrega todas sus variaciones).
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Disponibilidad agregada del producto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisponibilidadProducto'
              example:
                id_comercio: 104
                id_producto: 230
                estado_disponibilidad: disponible
        '422':
          $ref: '#/components/responses/ErrorValidacion'
  /existencias/disponibilidad/producto/lote:
    post:
      tags:
      - Disponibilidad
      summary: Consultar disponibilidad agregada de varios productos (CS-02, M1)
      description: 'Versión en lote de consultarDisponibilidadProducto, para una página de resultados de búsqueda
        sin superar el límite de variaciones del lote por variación. Un producto sin existencias registradas se
        devuelve como agotado, sin error. Consulta pública: no exige token ni aplica el filtro por comercio de
        RN-12.'
      operationId: consultarDisponibilidadProductoLote
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisponibilidadProductoLoteSolicitud'
            example:
              items:
              - id_comercio: 104
                id_producto: 230
              - id_comercio: 104
                id_producto: 231
      responses:
        '200':
          description: Disponibilidad agregada de cada producto, en el mismo orden.
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/DisponibilidadProducto'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
  /reservas:
    post:
      tags:
      - Reservas
      summary: Reservar existencias
      description: 'M4 valida comercio activo, variación y ubicación habilitada del mismo comercio. id_ubicacion
        es opcional: si falta, M4 selecciona una ubicación habilitada con toda la cantidad suficiente. Selección,
        comprobación de stock y reserva son atómicas bajo bloqueo pesimista. Si una candidata pierde disponibilidad
        por concurrencia, reevalúa las candidatas dentro de la operación sin dejar reservas parciales. Solo se compromete
        cantidad_reservada, no se descuenta cantidad_fisica hasta el despacho. Se liberan exactamente una vez las
        reservas ACTIVA cuyo plazo venció, disminuyendo cantidad_reservada y aumentando disponibilidad; CONFIRMADA
        no expira. Publica ExistenciaReservada después de confirmar la transacción. Si ninguna ubicación tiene toda
        la cantidad, devuelve 409; no distribuye unidades entre ubicaciones en esta versión candidata. La política
        de selección y reparto permanece pendiente de acuerdo. Idempotencia con Idempotency-Key: devuelve asignación
        original; no selecciona otra bodega en reintentos.'
      operationId: reservarExistencias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaSolicitud'
            examples:
              ubicacion_automatica:
                summary: M5 reserva sin elegir bodega
                value:
                  id_comercio: 104
                  id_variacion: 501
                  cantidad: 2
                  expiracion_minutos: 15
              ubicacion_explicita:
                summary: Reserva en ubicación indicada
                value:
                  id_comercio: 104
                  id_variacion: 501
                  id_ubicacion: 12
                  cantidad: 2
      responses:
        '201':
          description: Reserva creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
              example:
                id_reserva: 3f2b8a52-6c1e-4d0b-9a3e-1f6f0d9b7a10
                id_comercio: 104
                id_existencia: 77
                id_variacion: 501
                id_ubicacion: 12
                cantidad: 2
                estado_reserva: activa
                id_pedido: null
                id_subpedido: null
                fecha_creacion: '2026-11-10T15:04:05Z'
                fecha_expiracion: '2026-11-10T15:19:05Z'
                fecha_resolucion: null
                motivo_cierre: null
        '200':
          description: 'Reintento idempotente: se devuelve la reserva original.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '404':
          description: 'ERR-003 si la variación o la ubicación son de otro comercio; ERR-M4-002 si no existe existencia para la variación en esa ubicación.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEstandar'
        '409':
          description: 'ERR-M4-001: ninguna ubicación válida tiene toda la cantidad solicitada (sin
            compromiso parcial); ERR-M4-003: misma clave con datos distintos.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEstandar'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '503':
          $ref: '#/components/responses/DependenciaNoDisponible'
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Clave única por comercio para reintentos. Si no se envía, no se garantiza deduplicación de
          la solicitud de reserva. Convención propuesta SC-M4-08, por ratificar con M5. Misma clave y datos efectivos
          devuelve reserva y ubicación originales; datos distintos devuelve 409.
        schema:
          type: string
          minLength: 1
  /reservas/{id_reserva}:
    get:
      tags:
      - Reservas
      summary: Consultar una reserva
      operationId: obtenerReserva
      parameters:
      - name: id_reserva
        in: path
        required: true
        description: Identificador devuelto al reservar.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Reserva.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '404':
          description: 'ERR-003 si la reserva pertenece a otro comercio; ERR-M4-004 si la reserva no existe.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEstandar'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
  /reservas/{id_reserva}/confirmar:
    post:
      tags:
      - Reservas
      summary: Confirmar reserva (pasar a definitiva)
      description: 'Confirma una reserva ACTIVA cuyo plazo no venció y vincula pedido/subpedido del mismo comercio.
        La transición ACTIVA a CONFIRMADA conserva las unidades reservadas y desactiva solo el vencimiento automático,
        sin borrar la fecha original. PedidoConfirmado del catálogo utiliza la misma operación de dominio. La ruta
        síncrona no sustituye el acuerdo asíncrono ADR-005; ambos caminos son idempotentes. Repetición con mismos
        identificadores devuelve 200; identificadores distintos devuelve 409. Si venció, liberar las unidades exactamente
        una vez, conservar la reserva y rechazar. Para eventos no hay respuesta HTTP al publicador: registrar rechazo
        y aplicar el protocolo acordado con M5.'
      operationId: confirmarReserva
      parameters:
      - name: id_reserva
        in: path
        required: true
        description: Reserva a confirmar.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaVinculoSolicitud'
            example:
              id_pedido: 9120
              id_subpedido: 18455
      responses:
        '200':
          description: Reserva CONFIRMADA (o confirmación repetida del mismo vínculo).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '404':
          description: 'ERR-003 si la reserva pertenece a otro comercio; ERR-M4-004 si la reserva no existe.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEstandar'
        '409':
          description: ERR-M4-005, ERR-M4-006 o ERR-M4-007.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEstandar'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
  /reservas/{id_reserva}/liberar:
    post:
      tags:
      - Reservas
      summary: Liberar reserva
      description: 'Libera una reserva que todavía no produjo una salida física. Puede atender de forma síncrona
        situaciones como PagoRechazado o PedidoCancelado (eventos del catálogo 4.3 del PC3).
        Si el pedido ya fue despachado, esta operación NO aumenta existencias: debe verificarse el retorno físico
        y utilizar registrarReingresoPorReserva. Solo ACTIVA o CONFIRMADA pueden pasar a LIBERADA. Libera unidades
        una vez y conserva historial y registro de Kardex de disponibilidad. Repetir LIBERADA o VENCIDA devuelve
        su estado sin efectos adicionales; CONSUMIDA devuelve 409. La cancelación parcial afecta solo las reservas
        del subpedido indicado por M5.'
      operationId: liberarReserva
      parameters:
      - name: id_reserva
        in: path
        required: true
        description: Reserva a liberar.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiberarReservaSolicitud'
            example:
              motivo: pago_rechazado
      responses:
        '200':
          description: Reserva liberada (o ya cerrada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '404':
          description: 'ERR-003 si la reserva pertenece a otro comercio; ERR-M4-004 si la reserva no existe.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEstandar'
        '409':
          description: 'La reserva ya se convirtió en salida. Códigos: ERR-M4-008.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEstandar'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
  /reservas/{id_reserva}/salida:
    post:
      tags:
      - Reservas
      summary: Registrar la salida de una reserva (despacho)
      description: Solo una reserva CONFIRMADA puede consumirse. Antes de modificar datos, validar mediante el contrato
        de M5 que el pedido está pagado, que el subpedido pertenece a ese pedido y comercio y que ambos identificadores
        coinciden con el vínculo de la reserva. Una transacción descuenta cantidad_fisica y cantidad_reservada en
        igual medida, registra salida y Kardex valorizado y pasa a CONSUMIDA. Repetir una salida CONSUMIDA con el
        mismo pedido/subpedido devuelve 200 sin duplicar movimiento ni publicación; vínculos distintos devuelven
        409. Publicar SalidaInventarioConfirmada después del commit según SC-M4-09. La ruta y el evento de despacho
        comparten la misma operación idempotente; el nombre del evento requiere conciliación con M5.
      operationId: confirmarSalidaPorReserva
      parameters:
      - name: id_reserva
        in: path
        required: true
        description: Reserva a consumir.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaVinculoSolicitud'
            example:
              id_pedido: 9120
              id_subpedido: 18455
      responses:
        '201':
          description: Salida registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalidaReserva'
        '200':
          description: 'Reintento idempotente: la salida ya existía.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalidaReserva'
        '404':
          description: 'ERR-003 si la reserva pertenece a otro comercio; ERR-M4-004 si la reserva no existe.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEstandar'
        '409':
          description: ERR-M4-006, ERR-M4-005, ERR-M4-009 o ERR-M4-007.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEstandar'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '503':
          description: 'ERR-006: no se pudo validar el estado y vínculo con M5; no se registra salida.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEstandar'
  /reservas/{id_reserva}/reingreso:
    post:
      tags:
      - Reservas
      summary: Registrar reingreso por cancelación
      description: 'Alcance deseable. Solo una reserva CONSUMIDA con salida original registrada admite reingreso.
        Pedido/subpedido deben corresponder a la salida. Cancelación por sí sola no aumenta inventario: exigir recepción
        física verificada, registrada por personal autorizado y vinculada a las unidades de la salida; se valida
        id_recepcion, no una afirmación del solicitante. Esta operación candidata contempla retorno completo, sin
        duplicarlo; el retorno parcial requiere contrato adicional acordado. Transacción de entrada y Kardex; una
        reserva CONFIRMADA se libera sin reingreso.'
      operationId: registrarReingresoPorReserva
      parameters:
      - name: id_reserva
        in: path
        required: true
        description: Reserva consumida.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReingresoSolicitud'
            example:
              id_pedido: 9120
              id_subpedido: 18455
              id_recepcion: recepcion-0001
              justificacion: Recepción física completa verificada
      responses:
        '201':
          description: Reingreso registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movimiento'
        '404':
          description: 'ERR-003 si la reserva pertenece a otro comercio; ERR-M4-004 si la reserva no existe.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEstandar'
        '409':
          description: ERR-M4-006, ERR-M4-010, ERR-M4-011 o ERR-M4-007.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEstandar'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
  /kardex/valorizado:
    get:
      tags:
      - Kardex
      summary: Obtener kardex valorizado
      description: 'Solo lectura. Las líneas son inmutables (RN-M4-003): el mismo periodo siempre devuelve los mismos
        valores salvo líneas nuevas. Cada registro incluye usuario, motivo y saldos. Las reservas y liberaciones
        se distinguen de movimientos físicos; no imputar sus cantidades a ventas o costos. Saldo físico del último
        registro coincide con existencia física.'
      operationId: obtenerKardexValorizado
      parameters:
      - name: id_comercio
        in: query
        required: true
        description: Comercio.
        schema:
          type: integer
          format: int64
      - name: fecha_inicio
        in: query
        required: true
        description: Inicio del periodo (inclusive).
        schema:
          type: string
          format: date
      - name: fecha_fin
        in: query
        required: true
        description: Fin del periodo (inclusive).
        schema:
          type: string
          format: date
      - name: tipo_movimiento
        in: query
        required: false
        description: Filtra por tipo de movimiento.
        schema:
          type: string
          enum:
          - entrada
          - salida
          - ajuste
          - transferencia_salida
          - transferencia_entrada
          - reingreso
          - reserva
          - confirmacion_reserva
          - liberacion_reserva
          - vencimiento_reserva
      - name: pagina
        in: query
        required: false
        description: Número de página (desde 1).
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: por_pagina
        in: query
        required: false
        description: Registros por página.
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 200
      responses:
        '200':
          description: Líneas del kardex.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KardexRespuesta'
        '422':
          description: ERR-M4-012 si el rango de fechas es inválido; ERR-005 si los demás datos de consulta son inválidos. Sin máximo de días impuesto sin acuerdo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEstandar'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/RecursoNoAccesible'
  /auditoria/inventario:
    get:
      tags:
      - Auditoría
      summary: Consultar inventario y kardex de varios comercios (solo lectura)
      description: 'Excepción controlada y de solo lectura a RN-12 (RF-M4-012, RN-M4-015, CU-M4-12). Solo el rol
        Soporte/Auditoría de la plataforma puede invocarla; un usuario de comercio recibe 403. Cada consulta se
        registra en la bitácora de auditoría del núcleo (usuario, fecha, hora, comercios consultados). No modifica
        datos. Si se indican fecha_inicio y fecha_fin se incluye además el kardex del periodo. Consumidor: núcleo
        compartido (rol Soporte/Auditoría).'
      operationId: consultarInventarioAuditoria
      parameters:
      - name: ids_comercio
        in: query
        required: true
        description: Comercios a consultar, separados por coma; permiso exclusivo de Soporte/Auditoría.
        style: form
        explode: false
        schema:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
      - name: fecha_inicio
        in: query
        required: false
        description: Inicio del periodo del kardex (inclusive). Obligatorio si se envía fecha_fin.
        schema:
          type: string
          format: date
      - name: fecha_fin
        in: query
        required: false
        description: Fin inclusive. Obligatorio si se envía fecha_inicio; ambas fechas forman un rango válido.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Existencias de cada comercio y, si se pidió un periodo, su kardex.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditoriaInventarioRespuesta'
        '422':
          description: 'Comercios o fechas inválidos. Códigos: ERR-M4-012, ERR-005.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEstandar'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
  /existencias:
    get:
      tags:
      - Existencias
      summary: Listar existencias
      operationId: listarExistencias
      parameters:
      - name: id_comercio
        in: query
        required: true
        description: Comercio.
        schema:
          type: integer
          format: int64
      - name: id_ubicacion
        in: query
        required: false
        description: Filtra por ubicación.
        schema:
          type: integer
          format: int64
      - name: id_variacion
        in: query
        required: false
        description: Filtra por variación.
        schema:
          type: integer
          format: int64
      - name: bajo_minimo
        in: query
        required: false
        description: Solo existencias con disponible <= stock_minimo.
        schema:
          type: boolean
      - name: pagina
        in: query
        required: false
        description: Número de página (desde 1).
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: por_pagina
        in: query
        required: false
        description: Registros por página.
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 200
      responses:
        '200':
          description: Existencias.
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Existencia'
                  paginacion:
                    $ref: '#/components/schemas/Paginacion'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/RecursoNoAccesible'
  /existencias/{id_existencia}/stock-minimo:
    put:
      tags:
      - Existencias
      summary: Fijar stock mínimo
      description: Si tras el cambio el disponible queda en o bajo el mínimo, se publica AlertaStockMinimo. La operación
        queda en la bitácora del núcleo.
      operationId: fijarStockMinimo
      parameters:
      - name: id_existencia
        in: path
        required: true
        description: Existencia.
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - stock_minimo
              properties:
                stock_minimo:
                  type: integer
                  minimum: 0
            example:
              stock_minimo: 5
      responses:
        '200':
          description: Existencia actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Existencia'
        '404':
          description: 'ERR-003 si la existencia pertenece a otro comercio; ERR-M4-002 si la existencia no existe.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEstandar'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
  /movimientos:
    post:
      tags:
      - Movimientos
      summary: Registrar entrada o salida manual
      description: 'Valida el comercio activo, la variación y la ubicación habilitada del mismo comercio mediante
        M2/M3. Transacción atómica: actualiza existencia física y registra movimiento y Kardex. Una salida manual
        no puede consumir las unidades comprometidas por reservas ACTIVA o CONFIRMADA. El costo de entrada es obligatorio;
        la valoración posterior depende de SC-M4-07.'
      operationId: registrarMovimientoManual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovimientoSolicitud'
            example:
              id_comercio: 104
              id_variacion: 501
              id_ubicacion: 12
              tipo_movimiento: entrada
              cantidad: 20
              costo_unitario: 8500.0
              justificacion: Compra a proveedor, factura 1032
      responses:
        '201':
          description: Movimiento registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movimiento'
        '404':
          description: 'ERR-003 si el recurso es de otro comercio; ERR-M4-013 si la variación no existe; ERR-M4-014 si la ubicación no existe.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEstandar'
        '409':
          description: 'Regla de negocio. Códigos: ERR-M4-015, ERR-M4-001.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEstandar'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
        '503':
          $ref: '#/components/responses/DependenciaNoDisponible'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
  /kardex:
    get:
      tags:
      - Kardex
      summary: Consultar kardex de una variación
      operationId: consultarKardex
      parameters:
      - name: id_comercio
        in: query
        required: true
        description: Comercio.
        schema:
          type: integer
          format: int64
      - name: id_variacion
        in: query
        required: true
        description: Variación.
        schema:
          type: integer
          format: int64
      - name: id_ubicacion
        in: query
        required: false
        description: Ubicación.
        schema:
          type: integer
          format: int64
      - name: fecha_inicio
        in: query
        required: false
        description: Desde (inclusive).
        schema:
          type: string
          format: date
      - name: fecha_fin
        in: query
        required: false
        description: Hasta (inclusive).
        schema:
          type: string
          format: date
      - name: pagina
        in: query
        required: false
        description: Número de página (desde 1).
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: por_pagina
        in: query
        required: false
        description: Registros por página.
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 200
      responses:
        '200':
          description: Líneas del kardex.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KardexRespuesta'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/RecursoNoAccesible'
      description: ' Cada registro incluye usuario, motivo y saldos. Las reservas y liberaciones se distinguen de
        movimientos físicos; no imputar sus cantidades a ventas o costos. Saldo físico del último registro coincide
        con existencia física.'
  /transferencias:
    post:
      tags:
      - Movimientos
      summary: Transferir entre ubicaciones
      description: Ambos movimientos comparten el mismo identificador de transferencia (referencia_id). Origen y
        destino deben ser distintos. Las dos ubicaciones deben estar habilitadas y pertenecer al mismo comercio
        de la variación y del autorizador. Requiere autorización previa verificada del Administrador (RN-M4-012).
        Una única transacción bloquea existencias, descuenta en origen y suma en destino; falla completa con rollback
        ante cualquier error. No se trasladan unidades reservadas. Registrar ejecutor, autorizador, fecha/hora y
        motivo.
      operationId: registrarTransferencia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferenciaSolicitud'
            example:
              id_comercio: 104
              id_variacion: 501
              id_ubicacion_origen: 12
              id_ubicacion_destino: 13
              cantidad: 5
              justificacion: Reposición de la tienda
              id_autorizacion: autorizacion-0001
      responses:
        '201':
          description: Transferencia registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferenciaRespuesta'
        '404':
          description: 'ERR-003 si el recurso es de otro comercio; ERR-M4-013 si la variación no existe; ERR-M4-014 si la ubicación no existe.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEstandar'
        '409':
          description: 'Regla de negocio. Códigos: ERR-M4-015, ERR-M4-001.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEstandar'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
        '503':
          $ref: '#/components/responses/DependenciaNoDisponible'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
  /ajustes:
    post:
      tags:
      - Ajustes
      summary: Registrar conteo físico y ajuste
      description: 'Conteo físico bajo bloqueo: cantidad_sistema_vista debe coincidir con la física actual o devolver
        409 ERR-M4-016. Con diferencia exige motivo no vacío y autorización previa del Administrador
        del comercio, validada en servidor por id_autorizacion, antes de aplicar; registra ejecutor, autorizador
        y fecha/hora (RN-M4-011). Sin autorización válida no modifica stock. El flujo previo de solicitud/aprobación
        debe registrar esa autorización; los endpoints de dicho flujo se acordarán con la interfaz de bodega y núcleo.
        Si cantidad_contada es menor que unidades reservadas ACTIVA y CONFIRMADA, rechazar ERR-M4-017.
        Sin diferencia registra conteo sin movimiento. Con diferencia actualiza física y crea Kardex en una transacción
        atómica.'
      operationId: registrarAjusteInventario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AjusteSolicitud'
            example:
              id_comercio: 104
              id_variacion: 501
              id_ubicacion: 12
              cantidad_sistema_vista: 18
              cantidad_contada: 16
              motivo_ajuste: merma
              justificacion: Dos unidades dañadas en bodega
              id_autorizacion: autorizacion-0002
      responses:
        '201':
          description: Ajuste registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ajuste'
        '404':
          description: 'ERR-003 si la existencia pertenece a otro comercio; ERR-M4-002 si la existencia no existe.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEstandar'
        '409':
          description: 'Regla de negocio. Códigos: ERR-M4-016, ERR-M4-015, ERR-M4-017.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEstandar'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
        '503':
          $ref: '#/components/responses/DependenciaNoDisponible'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
  /subpedidos/{id_subpedido}/costos-productos-vendidos:
    get:
      tags:
      - Kardex
      summary: Obtener costos de los productos vendidos de un subpedido
      operationId: ObtenerCostoProductosVendidos
      x-consumidores:
      - M7
      description: >
        Consulta de solo lectura para la dependencia ObtenerCostoProductosVendidos(id_subpedido) de M7.
        Devuelve los costos de las variaciones del subpedido a partir de las salidas físicas confirmadas
        y valorizadas registradas por M4, sin exigir que M7 reconstruya el kardex. No incluye reservas,
        liberaciones, transferencias ni salidas manuales ajenas al subpedido. Cada movimiento de salida
        se cuenta una sola vez. Los costos son los registrados al confirmar la salida, no los precios
        de venta ni una revalorización con el costo actual. Se mantiene el método de valoración
        pendiente de acuerdo SC-M4-07. Si el evento de despacho llega antes de que M4 confirme y
        valorice todas las salidas del subpedido, no se entrega un resultado parcial como definitivo:
        se responde 409 y M7 debe reintentar. La consulta no genera movimientos ni asientos contables.
        El núcleo debe autorizar a M7 y validar el acceso al comercio propietario del subpedido.
      parameters:
      - name: id_subpedido
        in: path
        required: true
        description: Identificador del subpedido cuyo costo de ventas se consulta.
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: Costos completos de las salidas confirmadas del subpedido, agrupados por variación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostosProductosVendidosSubpedido'
              example:
                id_subpedido: 501
                id_comercio: 12
                variaciones:
                - id_variacion: 101
                  cantidad: 2
                  costo_unitario: 8500.0
                  costo_total: 17000.0
                costo_total: 17000.0
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          description: ERR-003 si el subpedido es de otro comercio; ERR-M4-018 si no hay registros asociados al subpedido en M4.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEstandar'
        '409':
          description: Las salidas del subpedido aún no están completamente confirmadas y valorizadas. Código ERR-M4-019. Reintentar sin registrar un costo de ventas parcial ni cero.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEstandar'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token emitido por el núcleo compartido (identidad y roles). El filtro por comercio (RN-12) lo
        aplica el núcleo.
  schemas:
    CostosProductosVendidosSubpedido:
      type: object
      required:
      - id_subpedido
      - id_comercio
      - variaciones
      - costo_total
      properties:
        id_subpedido:
          type: integer
          format: int64
        id_comercio:
          type: integer
          format: int64
          description: Comercio propietario del subpedido.
        variaciones:
          type: array
          minItems: 1
          description: Una línea por id_variacion, agregando únicamente sus salidas confirmadas del subpedido.
          items:
            $ref: '#/components/schemas/CostoVariacionVendida'
        costo_total:
          type: number
          minimum: 0
          description: Suma de costo_total de todas las variaciones; importe del costo de ventas que M7 consulta.
    CostoVariacionVendida:
      type: object
      required:
      - id_variacion
      - cantidad
      - costo_unitario
      - costo_total
      properties:
        id_variacion:
          type: integer
          format: int64
        cantidad:
          type: integer
          format: int64
          minimum: 1
          description: Suma de unidades de las salidas confirmadas de esta variación en el subpedido.
        costo_unitario:
          type: number
          minimum: 0
          description: >
            Costo unitario de la salida registrada; si existen varias salidas con costos distintos,
            costo_total dividido entre cantidad. Es un valor agregado de consulta, no una elección
            de costo promedio como método de valoración del inventario. M7 usa costo_total como
            importe registrado para evitar diferencias de redondeo.
        costo_total:
          type: number
          minimum: 0
          description: Suma de los importes valorizados registrados para las salidas confirmadas de esta variación.
    ErrorEstandar:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [codigo, mensaje]
          properties:
            codigo: { type: string, example: "ERR-004" }
            mensaje: { type: string }
            detalles: { type: object, nullable: true }
    Paginacion:
      type: object
      properties:
        pagina:
          type: integer
        por_pagina:
          type: integer
        total:
          type: integer
        total_paginas:
          type: integer
    Disponibilidad:
      type: object
      required:
      - id_comercio
      - id_variacion
      - cantidad_disponible
      - estado_disponibilidad
      - bajo_stock
      properties:
        id_comercio:
          type: integer
          format: int64
          description: Comercio.
        id_variacion:
          type: integer
          format: int64
          description: Variación.
        id_ubicacion:
          type: integer
          format: int64
          nullable: true
          description: Nulo cuando la cantidad suma todas las ubicaciones.
        cantidad_disponible:
          type: integer
          minimum: 0
        estado_disponibilidad:
          type: string
          enum:
          - disponible
          - agotado
        bajo_stock:
          type: boolean
          description: true si cantidad_disponible <= stock_minimo, RN-M4-016.
    DisponibilidadItem:
      type: object
      required:
      - id_comercio
      - id_variacion
      properties:
        id_comercio:
          type: integer
          format: int64
          description: Comercio.
        id_variacion:
          type: integer
          format: int64
          description: Variación.
        id_ubicacion:
          type: integer
          format: int64
          description: Ubicación (opcional).
    DisponibilidadLoteSolicitud:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/DisponibilidadItem'
    DisponibilidadProducto:
      type: object
      description: Disponibilidad agregada de un producto (CS-02); disponible si al menos una variación tiene
        unidades, agotado si ninguna tiene o el producto no tiene existencias registradas.
      required:
      - id_comercio
      - id_producto
      - estado_disponibilidad
      properties:
        id_comercio:
          type: integer
          format: int64
          description: Comercio.
        id_producto:
          type: integer
          format: int64
          description: Producto (agrega todas sus variaciones).
        estado_disponibilidad:
          type: string
          enum:
          - disponible
          - agotado
    DisponibilidadProductoItem:
      type: object
      required:
      - id_comercio
      - id_producto
      properties:
        id_comercio:
          type: integer
          format: int64
          description: Comercio.
        id_producto:
          type: integer
          format: int64
          description: Producto.
    DisponibilidadProductoLoteSolicitud:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/DisponibilidadProductoItem'
    ReservaSolicitud:
      type: object
      required:
      - id_comercio
      - id_variacion
      - cantidad
      properties:
        id_comercio:
          type: integer
          format: int64
          description: Comercio dueño del stock.
        id_variacion:
          type: integer
          format: int64
          description: Variación a reservar.
        id_ubicacion:
          type: integer
          format: int64
          description: Opcional. Si se envía, debe ser una ubicación habilitada del comercio. Si se omite, M4 selecciona
            una habilitada con toda la cantidad disponible requerida; devuelve la ubicación asignada. No requiere
            que el cliente elija bodega.
        cantidad:
          type: integer
          minimum: 1
        expiracion_minutos:
          type: integer
          minimum: 1
          default: 15
    Reserva:
      type: object
      required:
      - id_reserva
      - id_comercio
      - id_existencia
      - cantidad
      - estado_reserva
      - id_variacion
      - id_ubicacion
      - fecha_creacion
      - fecha_expiracion
      properties:
        id_reserva:
          type: string
          format: uuid
        id_comercio:
          type: integer
          format: int64
          description: Comercio.
        id_existencia:
          type: integer
          format: int64
          description: Existencia apartada.
        id_variacion:
          type: integer
          format: int64
          description: Variación (derivada de la existencia).
        id_ubicacion:
          type: integer
          format: int64
          description: Ubicación (derivada de la existencia).
        cantidad:
          type: integer
          minimum: 1
        estado_reserva:
          type: string
          enum:
          - activa
          - confirmada
          - consumida
          - liberada
          - vencida
          description: Representación JSON de los estados ACTIVA, CONFIRMADA, CONSUMIDA, LIBERADA y VENCIDA del
            PC2.
        id_pedido:
          type: integer
          format: int64
          nullable: true
        id_subpedido:
          type: integer
          format: int64
          nullable: true
        fecha_creacion:
          type: string
          format: date-time
          description: Momento de la reserva.
        fecha_expiracion:
          type: string
          format: date-time
          description: Plazo original de la reserva temporal, conservado para trazabilidad. El temporizador solo
            expira ACTIVA; CONFIRMADA conserva las unidades sin expiración automática.
        fecha_resolucion:
          type: string
          format: date-time
          description: Fecha de la última transición; el historial conserva todas las transiciones.
          nullable: true
        motivo_cierre:
          type: string
          nullable: true
          description: pago_rechazado, pedido_cancelado, solicitud_m5 o vencimiento.
    ReservaVinculoSolicitud:
      type: object
      required:
      - id_pedido
      - id_subpedido
      properties:
        id_pedido:
          type: integer
          format: int64
          description: Pedido de M5.
        id_subpedido:
          type: integer
          format: int64
          description: Subpedido de M5 del comercio de la reserva. Debe pertenecer a id_pedido; validar por contrato
            de M5.
