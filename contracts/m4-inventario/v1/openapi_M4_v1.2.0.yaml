x-procesos-segundo-plano:
- proceso: Liberación de reservas vencidas
  modulo: M4
  disparo: Cada 60 segundos, RNF-M4-007
  control: Solo ACTIVA con fecha_expiracion cumplida; transición y decremento reservado atómicos e idempotentes.
    Conservar detalle e historial. Confirmación comprueba plazo aun si temporizador no ejecutó.
