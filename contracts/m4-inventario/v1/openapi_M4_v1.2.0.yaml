x-dependencias-consumidas:
- modulo_proveedor: M2
  operacion: ObtenerSedesComercio
  ruta: GET /api/m2/v1/comercios/{id_comercio}/sedes
  respuesta:
    $ref: '#/components/schemas/M2SedesComercio'
  estado: Registrada en la validación cruzada 4.4 del PC3 colectivo; verificado contra openapi_M2_v1.2.0.yaml; M2 declara a M4 como consumidor.
  uso: Sedes habilitadas. id_sede de M2 es el mismo identificador que id_ubicacion de M4 (confirmado por M2 en su
    contrato v1.2.0); sede cubre tienda y bodega.
- modulo_proveedor: M2
  operacion: ObtenerComercioActivo
  ruta: GET /api/m2/v1/comercios/{id_comercio}/estado
  respuesta:
    $ref: '#/components/schemas/M2EstadoComercio'
  estado: Verificado contra openapi_M2_v1.2.0.yaml; M2 declara a M4 como consumidor (bearerAuth) para bloquear movimientos
    manuales de un comercio suspendido o inactivo.
  uso: Verificar activo (activo = true); ObtenerSedesComercio no devuelve estado operativo del comercio.
- modulo_proveedor: M3
  operacion: obtenerVariacion
  ruta: GET /api/m3/v1/variaciones/{id_variacion}
  estado: Registrada en la validación cruzada 4.4 del PC3 colectivo (M4 → M3); reemplaza al nombre obtenerDetalleVariacion
    del PC2 de M4.
  uso: Validar la variación y su pertenencia al comercio. La respuesta (VariacionDetalle) trae el producto embebido,
    de donde M4 toma id_comercio para compararlo con el de la solicitud.
- modulo_proveedor: M5
  operacion: obtenerPedido
  ruta: GET /api/m5/v1/pedidos/{id_pedido}
  estado: Registrada en la validación cruzada 4.4 del PC3 colectivo; M5 declara a M4 como consumidor.
  uso: Verificar estado pagado y pertenencia pedido/subpedidos.
- modulo_proveedor: M5
  operacion: obtenerSubpedido
  ruta: GET /api/m5/v1/subpedidos/{id_subpedido}
  estado: Registrada en la validación cruzada 4.4 del PC3 colectivo; M5 declara a M4 como consumidor.
  uso: Verificar vínculo del subpedido con pedido, comercio y líneas, sin consultas directas a tablas de M5.
