openapi: 3.0.3
info:
  title: Pacíficos Online - M7 ERP Contable y Reportes Gerenciales
  version: 1.1.0
  description: >
    Especificación de las rutas HTTP y eventos observados en la implementación
    de M7 en desarrollo, incluida la integración local con M6. La versión v1.1.0 es únicamente una propuesta
    en revisión, no un contrato aprobado ni publicado, y no reemplaza v1.0.0.
    Sus diferencias de rutas, respuestas y seguridad pueden ser incompatibles
    con ese contrato. Si el Comité confirma cambios incompatibles, la estrategia
    SemVer exige incrementar la versión mayor y acordar un período de convivencia.
    La autenticación, los errores y la conformidad de las respuestas requieren
    validación adicional.
servers:
  - url: /
    description: Raíz de la aplicación Laravel

security:
  - sesionSanctum: []

x-module: M7
x-owner: SG7 - ERP contable y reportes gerenciales
x-versioning:
  strategy: SemVer
  breakingChange: Incrementar versión mayor y mantener periodo de convivencia según acuerdo del Comité
  estado: Propuesta v1.1.0 no aprobada; versión definitiva pendiente de revisión de compatibilidad y decisión del Comité

x-dependencies:
  M2:
    estado: Pendiente de integración
    operaciones:
      - ObtenerDatosFiscalesComercio(id_comercio)
      - ObtenerComisionSubpedido(id_subpedido)
  M4:
    - operacion: ObtenerCostoProductosVendidos
      entrada: id_subpedido
      salida: costos por id_variacion y costo_total
      comunicacion: Interfaz PHP InventarioModuleInterface en el mismo proceso
      validaciones: El subpedido y comercio deben coincidir con el evento y el costo total debe ser positivo.
      manejo_409:
        codigo: COSTOS_SUBPEDIDO_NO_DISPONIBLES
        accion: >
          El contrato v1.0.0 indica mantener pendiente el asiento y reintentar;
          el listener actual registra el error y no garantiza reintento durable.
  M5:
    - Evento interno PedidoConfirmado
    - Evento interno SubpedidoDespachado
    - ObtenerSubpedido(id_subpedido), pendiente de integración
  M6:
    estado: Integración implementada en desarrollo; pendiente de despliegue y validación en PostgreSQL.
    operaciones:
      - Evento PagoConfirmado para registrar un cobro global por pago.
      - Evento FacturaGenerada para distribuir el importe por comercio y subpedido.
      - Evento ReembolsoProcesado para registrar la reversión contable definitiva.
      - ConsultaEventosPagosInterface para recuperar pagos, facturas y reembolsos por período y comercio.
    nota: >
      PagoConfirmado no consulta facturas ni registra por subpedido.
      FacturaGenerada no genera otro ingreso a bancos ni duplica ventas.
      La venta se conserva desde PedidoConfirmado de M5.
  Nucleo:
    - Autenticación mediante auth:sanctum en las rutas API protegidas
    - Contexto de comercio y verificación de roles
    - Manejo estándar de errores JSON

x-pending-decisions:
  separacion_efectos_m6:
    estado: Implementación local según acuerdo comunicado; publicación contractual conjunta pendiente
    bloquea_publicacion_definitiva: true
    descripcion: >
      M6 definió un cobro global por PagoConfirmado, un desglose por comercio y
      subpedido por FacturaGenerada sin duplicar el cobro, y una reversión por
      ReembolsoProcesado. M7 separa el libro de plataforma del libro de cada
      comercio. Las cuentas P-BANCOS, P-PENDIENTE y P-COMERCIOS pertenecen
      exclusivamente a plataforma; 1.1.04 es Fondos por cobrar a plataforma en
      el plan del comercio (1.1.03 conserva Inventarios).
      Cada factura y reembolso genera los movimientos de ambos libros en una
      sola transacción. No se asigna un comercio ficticio al cobro global.
      Estos cambios no publican ni reemplazan unilateralmente el contrato de M6.
  liquidacion_comercio:
    estado: Fuera del alcance de esta entrega por decisión de M7
    descripcion: >
      Esta entrega excluye la ejecución, el registro y la consulta de liquidaciones
      a comercios. El flujo soportado mantiene los fondos de los comercios en
      plataforma y reduce la obligación pendiente al registrar un reembolso
      confirmado por M6. No existe estado_liquidacion ni se requiere una
      confirmación adicional para procesar ese evento. No se soportan pagos
      externos a comercios ni reembolsos posteriores a dichas transferencias.
      Su incorporación requiere un acuerdo contractual posterior. La exclusión
      debe comunicarse al Comité y no modifica las responsabilidades de M6.
  documentos_ajuste:
    estado: Excepción manual según confirmación de M6
    descripcion: >
      FacturaGenerada es inmutable. Notas de crédito ajenas a un reembolso y
      notas de débito no tienen evento definido en el contrato vigente de M6:
      requieren coordinación manual, no un asiento automático inferido.
  compatibilidad:
    estado: Pendiente de revisión del Comité
    bloquea_publicacion_definitiva: true
    descripcion: >
      El inventario HTTP difiere de v1.0.0 y no incluye todas las operaciones
      publicadas. Si se confirman cambios incompatibles, corresponde incrementar
      la versión mayor. El Comité debe acordar versión, convivencia y obligaciones.
  reconocimiento_venta:
    estado: Pendiente de ratificación del Comité
    bloquea_publicacion_definitiva: true
    descripcion: >
      La implementación actual procesa PedidoConfirmado para registrar la venta
      por subtotal. La decisión contractual definitiva requiere ratificación.
  recuperacion_eventos:
    estado: Implementada con bandeja persistente; operación del Scheduler pendiente de despliegue
    descripcion: >
      Los eventos recibidos se guardan en bandeja_eventos_m6 antes de intentar
      su contabilización. Un fallo conserva payload, intentos y último error;
      no se marca PROCESADO hasta confirmar la transacción contable. Los UUID
      contradictorios se rechazan y registran sin sobrescribir el original.
      Al llegar otro evento del pago se reintentan sus pendientes; cada hora se
      reintenta la bandeja completa con --solo-pendientes, sin filtro de antigüedad.
      Cada día se consultan los tres tipos de eventos del día anterior en M6.
      Requiere Scheduler operativo. Eventos que nunca se recibieron y cuyo
      período de consulta diaria se perdió necesitan recuperación manual del
      período; la bandeja no inventa eventos que nunca conoció.
      Antes de aplicar migraciones en Supabase debe coordinarse con el responsable.
      Ejecutar php artisan m7:recuperar-eventos-m6 AAAA-MM-DD AAAA-MM-DD
      para todos los comercios, opcionalmente con --comercio=ID. Sin fechas
      procesa el día anterior. El comando informa los errores y devuelve fallo
      si alguna operación no pudo procesarse.
      Crear cuentas activas del plan del comercio, incluida 1.1.04.
      Aplicar las migraciones M7 desde su carpeta con --path, incluyendo
      crear_libro_plataforma_m7 y preparar_separacion_eventos_m6; no están
      ejecutadas automáticamente por esta implementación.
  cuadre_pago:
    estado: Implementado conforme a la respuesta de M6
    descripcion: >
      cuadres_pagos_m6 compara el cobro original contra las facturas originales
      recibidas, sin descontar reembolsos. PENDIENTE_FACTURAS indica saldo;
      COMPLETO_POR_IMPORTES indica igualdad, no certifica cantidad de subpedidos;
      DIFERENCIA indica exceso y no se distribuye automáticamente el excedente.
      Datos inválidos o contradictorios producen REQUIERE_REVISION y totales
      desconocidos, no ceros ficticios. El cuadre por importes no certifica que
      todos los asientos de distribución ya estén procesados.
      A las 24 horas desde la fecha UTC del pago sin cuadre se persiste fecha_alerta
      y se registra una advertencia; la alerta no impide reintentos posteriores.
  consulta_pago_multicomercio:
    estado: Pendiente de coordinación
    descripcion: >
      La consulta interna sin comercio usa registrado para el cobro global,
      aunque no haya facturas. Mantiene los campos actuales y añade libro,
      estado_cuadre e importes en céntimos. subpedidos_registrados contiene
      distribuciones registradas, no cobros por subpedido. M6 confirma que hoy
      solo requiere registrado; la adopción de campos adicionales corresponde a
      un PR de M6. La versión anterior del PR incluía conciliación multicomercio
      de M6; esa contribución debe separarse por sus responsables antes del merge.

x-eventos-consumidos:
  PedidoConfirmado:
    productor: M5
    proposito: Registrar la venta por subtotal para cada subpedido.
    payload_esperado:
      id_evento: uuid
      fecha_evento: date-time
      id_pedido: int64
      subpedidos: Lista con id_subpedido, id_comercio y subtotal.
  SubpedidoDespachado:
    productor: M5
    proposito: Registrar el costo de ventas del subpedido despachado.
    payload_esperado:
      id_evento: uuid
      fecha_evento: date-time
      id_pedido: int64
      id_subpedido: int64
      id_comercio: int64
  PagoConfirmado:
    productor: M6
    proposito: Registrar un único cobro del pedido completo en el libro de plataforma.
    payload_esperado:
      id_evento: uuid
      id_pago: int64
      id_pedido: int64
      monto: decimal
      fecha: date-time
    nota: >
      Idempotencia independiente por UUID e id_pago. No consulta facturas y no
      espera datos fiscales. Debe P-BANCOS y haber P-PENDIENTE.
  FacturaGenerada:
    productor: M6
    proposito: Distribuir el importe por subpedido después de verificar pago y venta previa.
    payload_esperado:
      id_evento: uuid
      id_factura: int64
      id_pago: int64
      id_pedido: int64
      id_subpedido: int64
      id_comercio: int64
      subtotal: decimal
      impuesto: decimal
      envio: decimal
      monto: decimal
      fecha: date-time
    nota: >
      M7 evita duplicados por evento e id_factura, y rechaza otra factura para
      el mismo pago y subpedido. Debe P-PENDIENTE y haber P-COMERCIOS en plataforma;
      debe 1.1.04 y haber cuentas por cobrar, IVA y envío en el comercio.
      Rechaza datos contradictorios y desgloses incompletos.
  ReembolsoProcesado:
    productor: M6
    proposito: Registrar la reversión contable definitiva vinculada al cobro.
    payload_esperado:
      id_evento: uuid
      id_pago: int64
      id_pedido: int64
      id_subpedido: int64
      id_comercio: int64
      id_reembolso: int64
      monto: decimal
      nota_credito_id: int64
      fecha: date-time
    nota: >
      M7 evita duplicados por evento e id_reembolso y distribuye el monto entre
      subtotal, impuesto y envío sin exceder sus saldos pendientes. En el alcance
      de esta entrega, debe P-COMERCIOS y haber P-BANCOS en plataforma,
      y revierte ventas, IVA y envío contra 1.1.04 en el comercio.
      El payload vigente usa nota_credito_id, no id_nota_credito.

x-eventos-pendientes:
  SubpedidoEntregado:
    productor: M5
    proposito: Registrar el pasivo o cuenta por pagar al comercio.
    payload_esperado:
      id_evento: uuid
      id_pedido: int64
      id_subpedido: int64
      id_comercio: int64
      fecha: date-time
x-operaciones-pendientes-v1:
  descripcion: >
    Operaciones publicadas en v1.0.0 sin ruta correspondiente registrada. Su
    inclusión aquí no indica su retirada ni sustituye el contrato publicado.
  operaciones:
    - consultarEstadoContablePedido
    - consultarEstadoContableSubpedido
    - obtenerResumenFinancieroComercio
    - consultarRentabilidadComercio
    - consultarEstadoResultados
    - consultarBalanceGeneral
    - consultarTableroEjecutivo
    - crearCuentaContable
    - actualizarCuentaContable

x-componentes-v1:
  descripcion: >
    Se conservan las definiciones de v1.0.0 que no corresponden a rutas
    implementadas para facilitar su revisión. Su presencia en components no
    indica que las operaciones o respuestas asociadas estén disponibles.

tags:
  - name: Plan de cuentas
  - name: Libros contables
  - name: Reportes
  - name: Integración
  - name: Estado

paths:
  /api/m7/v1/cuentas:
    get:
      tags: [Plan de cuentas]
      summary: Listar cuentas del comercio
      operationId: listarCuentasContables
      description: El comercio se obtiene del contexto o se indica en modo sistema; solo_activas filtra las cuentas activas.
      parameters:
        - $ref: '#/components/parameters/IdComercio'
        - name: solo_activas
          in: query
          schema: { type: integer, enum: [0, 1], default: 0 }
          description: Por HTTP se aceptan los valores 0 y 1.
      responses:
        '200':
          description: Cuentas del comercio
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [id_comercio, cuentas]
                    properties:
                      id_comercio: { type: integer }
                      cuentas:
                        type: array
                        items: { $ref: '#/components/schemas/CuentaContable' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '422': { $ref: '#/components/responses/Validacion' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /api/m7/v1/cuentas/{idCuentaContable}:
    get:
      tags: [Plan de cuentas]
      summary: Consultar una cuenta
      operationId: consultarCuentaContable
      parameters:
        - name: idCuentaContable
          in: path
          required: true
          schema: { type: integer }
          description: La ruta solo acepta dígitos.
        - $ref: '#/components/parameters/IdComercio'
      responses:
        '200':
          description: Cuenta del comercio
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: '#/components/schemas/CuentaContable' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/Validacion' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /api/m7/v1/libro-diario:
    get:
      tags: [Libros contables]
      summary: Consultar el libro diario
      operationId: consultarLibroDiario
      description: Usa el contexto del comercio; en modo sistema la consulta no filtra por comercio.
      parameters:
        - $ref: '#/components/parameters/FechaDesde'
        - $ref: '#/components/parameters/FechaHasta'
        - name: tipo
          in: query
          schema: { type: string, maxLength: 40 }
        - name: estado
          in: query
          schema: { type: string, enum: [REGISTRADO, PENDIENTE, ANULADO] }
        - name: buscar
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Asientos y totales
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: '#/components/schemas/LibroDiario' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '422': { $ref: '#/components/responses/Validacion' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /api/m7/v1/libro-mayor:
    get:
      tags: [Libros contables]
      summary: Consultar movimientos y saldo de una cuenta
      operationId: consultarLibroMayor
      parameters:
        - name: id_cuenta_contable
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/IdComercio'
        - $ref: '#/components/parameters/FechaDesde'
        - $ref: '#/components/parameters/FechaHasta'
        - name: incluirAnulados
          in: query
          schema: { type: integer, enum: [0, 1], default: 0 }
          description: Por HTTP se aceptan los valores 0 y 1.
      responses:
        '200':
          description: Movimientos y saldos de la cuenta
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: '#/components/schemas/LibroMayor' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/Validacion' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /api/m7/v1/libro-mayor/cuentas:
    get:
      tags: [Libros contables]
      summary: Listar cuentas activas para el libro mayor
      operationId: listarCuentasLibroMayor
      parameters:
        - $ref: '#/components/parameters/IdComercio'
      responses:
        '200':
          description: Cuentas activas
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [id_comercio, cuentas]
                    properties:
                      id_comercio: { type: integer }
                      cuentas:
                        type: array
                        items: { $ref: '#/components/schemas/CuentaMayor' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '422': { $ref: '#/components/responses/Validacion' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /api/m7/v1/reporte-gerencial:
    get:
      tags: [Reportes]
      summary: Consultar ingresos, costos y utilidad bruta
      operationId: consultarReporteGerencial
      description: Si se omiten fechas, se utilizan respectivamente el inicio y fin del mes actual.
      parameters:
        - $ref: '#/components/parameters/IdComercio'
        - $ref: '#/components/parameters/FechaDesde'
        - $ref: '#/components/parameters/FechaHasta'
      responses:
        '200':
          description: Resumen y serie mensual de asientos registrados de venta y costo
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: '#/components/schemas/ReporteGerencial' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '422': { $ref: '#/components/responses/Validacion' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /m7:
    get:
      tags: [Estado]
      summary: Consultar estado básico del módulo
      operationId: consultarEstadoModulo
      description: Ruta web sin autenticación declarada; no comprueba disponibilidad de la base de datos.
      security: []
      responses:
        '200':
          description: Estado básico
          content:
            application/json:
              schema:
                type: object
                required: [module, status]
                properties:
                  module: { type: string, enum: [M7_Contabilidad] }
                  status: { type: string, enum: [online] }

  /m7/pagos/{idPago}/registro-contable:
    get:
      tags: [Integración]
      summary: Consultar si existe un asiento registrado para un pago
      operationId: consultarRegistroContablePago
      description: |
        Ruta web protegida con sesión y rol (encargado_comercio o
        encargado_plataforma). encargado_comercio consulta solo los asientos de
        su comercio; encargado_plataforma consulta sin filtro de comercio. La
        lista subpedidos_registrados solo incluye distribuciones registradas y se limita
        al comercio autenticado, salvo para encargado_plataforma.
        En plataforma registrado indica cobro global; en comercio requiere además
        distribución propia. libro identifica el ámbito de asiento_id.
        Los importes globales y el estado de cuadre no se exponen al comercio.
        Identificadores sin asiento devuelven registrado=false.
      parameters:
        - name: idPago
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Resultado de la búsqueda
          content:
            application/json:
              schema:
                type: object
                required: [id_pago, registrado, asiento_id, fecha_registro, subpedidos_registrados]
                properties:
                  id_pago: { type: integer }
                  registrado: { type: boolean }
                  asiento_id: { type: integer, nullable: true }
                  fecha_registro: { type: string, nullable: true }
                  subpedidos_registrados:
                    type: array
                    items: { type: integer, format: int64 }
                  libro: { type: string, enum: [PLATAFORMA, COMERCIO] }
                  estado_cuadre:
                    type: string
                    enum: [PENDIENTE_EVALUACION, PENDIENTE_FACTURAS, COMPLETO_POR_IMPORTES, DIFERENCIA, REQUIERE_REVISION]
                  monto_cobro_centimos: { type: integer, format: int64 }
                  monto_facturado_centimos: { type: integer, format: int64, nullable: true }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

components:
  securitySchemes:
    sesionSanctum:
      type: apiKey
      in: cookie
      name: NOMBRE_COOKIE_CONFIGURABLE
      description: |
        Marcador, no nombre literal: sustituir según SESSION_COOKIE o la configuración
        derivada de APP_NAME antes de usar este inventario con clientes generados.
        Se observó auth:sanctum y pruebas con sesión web; la configuración de
        dominios stateful y otras modalidades de autenticación deben verificarse.
        Los roles permitidos son encargado_comercio y encargado_plataforma.

  parameters:
    IdComercio:
      name: id_comercio
      in: query
      required: false
      description: Opcional para el comercio autenticado; requerido en modo sistema para estas consultas.
      schema: { type: integer, minimum: 1 }
    FechaDesde:
      name: fecha_desde
      in: query
      required: false
      description: Fecha validada por Laravel.
      schema: { type: string, example: '2026-11-01' }
    FechaHasta:
      name: fecha_hasta
      in: query
      required: false
      description: Fecha validada por Laravel; debe ser posterior o igual a fecha_desde cuando ambas se indican.
      schema: { type: string, example: '2026-11-30' }


  # Definiciones de v1.0.0 conservadas para operaciones pendientes.
    PedidoId:
      name: id_pedido
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PagoId:
      name: id_pago
      in: path
      required: true
      schema: { type: integer, format: int64 }
    SubpedidoId:
      name: id_subpedido
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ComercioId:
      name: id_comercio
      in: path
      required: true
      schema: { type: integer, format: int64 }
    CuentaId:
      name: id_cuenta_contable
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Desde:
      name: desde
      in: query
      required: true
      schema: { type: string, format: date }
    Hasta:
      name: hasta
      in: query
      required: true
      schema: { type: string, format: date }
    Periodo:
      name: periodo
      in: query
      required: true
      schema:
        type: string
        example: 2026-09

  responses:
    NoAutenticado:
      description: Sesión no autenticada (ERR-001).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEstandar' }
    SinPermisos:
      description: Rol no autorizado (ERR-002); no cubre todos los errores de contexto de comercio.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEstandar' }
    NoEncontrado:
      description: Cuenta o ruta no encontrada (ERR-004).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEstandar' }
    Validacion:
      description: Parámetros inválidos (ERR-005).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEstandar' }
    ErrorInterno:
      description: Error interno (ERR-006), inclusive algunas excepciones de contexto.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEstandar' }


  # Definiciones de v1.0.0 conservadas para operaciones pendientes.
    ParametrosInvalidos:
      description: Parámetros inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEstandar' }

  x-error-codes:
    descripcion: Códigos reservados en v1.0.0; su uso en las rutas actuales requiere validación.
    ERR-M7-001:
      http: 404
      descripcion: Recurso contable no encontrado.
    ERR-M7-002:
      http: 409
      descripcion: Conflicto con el estado contable actual.
    ERR-M7-003:
      http: 422
      descripcion: Parámetros o datos contables inválidos.

  schemas:
    ErrorEstandar:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [codigo, mensaje, detalles]
          properties:
            codigo: { type: string }
            mensaje: { type: string }
            detalles:
              type: object
              nullable: true
              additionalProperties: true
    CuentaContable:
      type: object
      required: [id_cuenta_contable, codigo, nombre, tipo, naturaleza, nivel, id_cuenta_padre, activa]
      properties:
        id_cuenta_contable: { type: integer }
        codigo: { type: string }
        nombre: { type: string }
        tipo: { type: string }
        naturaleza: { type: string }
        nivel: { type: integer }
        id_cuenta_padre: { type: integer, nullable: true }
        activa: { type: boolean }
    CuentaMayor:
      type: object
      required: [id_cuenta_contable, codigo, nombre, tipo, naturaleza]
      properties:
        id_cuenta_contable: { type: integer }
        codigo: { type: string }
        nombre: { type: string }
        tipo: { type: string }
        naturaleza: { type: string }
    LibroDiario:
      type: object
      required: [asientos, totalDebe, totalHaber, cantidad]
      properties:
        asientos:
          type: array
          items: { $ref: '#/components/schemas/AsientoDiario' }
        totalDebe: { type: number }
        totalHaber: { type: number }
        cantidad: { type: integer }
    AsientoDiario:
      type: object
      required: [id, numero, fecha, descripcion, tipo, estado, referencia, lineas, totalDebe, totalHaber]
      properties:
        id: { type: integer }
        numero: { type: string }
        fecha: { type: string }
        descripcion: { type: string }
        tipo: { type: string }
        estado: { type: string }
        referencia: { type: string }
        lineas:
          type: array
          items:
            type: object
            required: [codigo, cuenta, debe, haber, descripcion]
            properties:
              codigo: { type: string }
              cuenta: { type: string }
              debe: { type: number }
              haber: { type: number }
              descripcion: { type: string, nullable: true }
        totalDebe: { type: number }
        totalHaber: { type: number }
    LibroMayor:
      type: object
      required: [cuenta, id_comercio, fecha_desde, fecha_hasta, incluir_anulados, saldo_inicial, total_debe, total_haber, saldo_final, movimientos]
      properties:
        cuenta:
          type: object
          required: [id_cuenta_contable, codigo, nombre, naturaleza]
          properties:
            id_cuenta_contable: { type: integer }
            codigo: { type: string }
            nombre: { type: string }
            naturaleza: { type: string }
        id_comercio: { type: integer }
        fecha_desde: { type: string, nullable: true }
        fecha_hasta: { type: string, nullable: true }
        incluir_anulados: { type: boolean }
        saldo_inicial: { type: string }
        total_debe: { type: string }
        total_haber: { type: string }
        saldo_final: { type: string }
        movimientos:
          type: array
          items: { $ref: '#/components/schemas/MovimientoMayor' }
    MovimientoMayor:
      type: object
      required: [id_asiento, fecha, numero_linea, asiento, tipo, descripcion, estado, debe, haber, saldo]
      properties:
        id_asiento: { type: integer }
        fecha: { type: string }
        numero_linea: { type: integer }
        asiento: { type: string }
        tipo: { type: string }
        descripcion: { type: string }
        estado: { type: string }
        debe: { type: string }
        haber: { type: string }
        saldo: { type: string }
    ReporteGerencial:
      type: object
      required: [id_comercio, fecha_desde, fecha_hasta, resumen, mensual]
      properties:
        id_comercio: { type: integer }
        fecha_desde: { type: string }
        fecha_hasta: { type: string }
        resumen: { $ref: '#/components/schemas/ImportesGerenciales' }
        mensual:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/ImportesGerenciales'
              - type: object
                required: [periodo]
                properties:
                  periodo: { type: string, example: '2026-11' }
    ImportesGerenciales:
      type: object
      required: [ingresos, costos, utilidad_bruta]
      properties:
        ingresos: { type: string }
        costos: { type: string }
        utilidad_bruta: { type: string }

  # Definiciones de v1.0.0 conservadas para operaciones pendientes.
    CuentaContableInput:
      type: object
      required: [codigo, nombre, tipo]
      properties:
        codigo: { type: string }
        nombre: { type: string }
        tipo:
          type: string
          enum: [ACTIVO, PASIVO, PATRIMONIO, INGRESO, GASTO]
        id_cuenta_padre: { type: integer, format: int64, nullable: true }
        activa: { type: boolean, default: true }
    DetalleAsiento:
      type: object
      required: [id_cuenta_contable, debe, haber]
      properties:
        id_cuenta_contable: { type: integer, format: int64 }
        id_centro_costo: { type: integer, format: int64, nullable: true }
        debe: { type: number, format: double, minimum: 0 }
        haber: { type: number, format: double, minimum: 0 }
        descripcion: { type: string, nullable: true }
    AsientoContable:
      type: object
      required: [id_asiento, tipo, fecha, evento_id, id_comercio, detalles]
      properties:
        id_asiento: { type: integer, format: int64 }
        tipo: { type: string, example: VENTA }
        fecha: { type: string, format: date-time }
        evento_id: { type: string, format: uuid }
        id_pedido: { type: integer, format: int64, nullable: true }
        id_subpedido: { type: integer, format: int64, nullable: true }
        id_comercio: { type: integer, format: int64 }
        descripcion: { type: string }
        estado:
          type: string
          enum: [REGISTRADO, PENDIENTE, ANULADO]
        detalles:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/DetalleAsiento'
    EstadoContablePedido:
      type: object
      required: [id_pedido, contabilizado]
      properties:
        id_pedido: { type: integer, format: int64 }
        contabilizado: { type: boolean }
        asiento_venta_id: { type: integer, format: int64, nullable: true }
        asiento_costo_id: { type: integer, format: int64, nullable: true }
        fecha_contabilizacion: { type: string, format: date-time, nullable: true }
    EstadoContableSubpedido:
      type: object
      required: [id_subpedido, id_pedido, id_comercio, contabilizado]
      properties:
        id_subpedido: { type: integer, format: int64 }
        id_pedido: { type: integer, format: int64 }
        id_comercio: { type: integer, format: int64 }
        contabilizado: { type: boolean }
        asiento_venta_id: { type: integer, format: int64, nullable: true }
        asiento_costo_id: { type: integer, format: int64, nullable: true }
        fecha_contabilizacion: { type: string, format: date-time, nullable: true }
    RegistroContablePago:
      type: object
      required: [id_pago, registrado]
      properties:
        id_pago: { type: integer, format: int64 }
        registrado: { type: boolean }
        asiento_id: { type: integer, format: int64, nullable: true }
        fecha_registro: { type: string, format: date-time, nullable: true }
        subpedidos_registrados:
          type: array
          items: { type: integer, format: int64 }
        libro: { type: string, enum: [PLATAFORMA, COMERCIO] }
        estado_cuadre:
          type: string
          enum: [PENDIENTE_EVALUACION, PENDIENTE_FACTURAS, COMPLETO_POR_IMPORTES, DIFERENCIA, REQUIERE_REVISION]
        monto_cobro_centimos: { type: integer, format: int64 }
        monto_facturado_centimos: { type: integer, format: int64, nullable: true }
    ResumenFinanciero:
      type: object
      required: [id_comercio, fecha_inicio, fecha_fin, ingresos, costos, gastos, utilidad]
      properties:
        id_comercio: { type: integer, format: int64 }
        fecha_inicio: { type: string, format: date }
        fecha_fin: { type: string, format: date }
        ingresos: { type: number, format: double }
        costos: { type: number, format: double }
        gastos: { type: number, format: double }
        utilidad: { type: number, format: double }
    RentabilidadCentroCosto:
      type: object
      required: [id_centro_costo, nombre, ingresos, costos, utilidad]
      properties:
        id_centro_costo: { type: integer, format: int64, nullable: true }
        nombre: { type: string }
        ingresos: { type: number, format: double }
        costos: { type: number, format: double }
        utilidad: { type: number, format: double }
    Rentabilidad:
      type: object
      required: [id_comercio, periodo, ingresos, costos, utilidad, centros_costo]
      properties:
        id_comercio: { type: integer, format: int64 }
        periodo: { type: string, example: 2026-09 }
        ingresos: { type: number, format: double }
        costos: { type: number, format: double }
        utilidad: { type: number, format: double }
        centros_costo:
          type: array
          items:
            $ref: '#/components/schemas/RentabilidadCentroCosto'
    EstadoResultados:
      type: object
      required: [id_comercio, periodo, ingresos, costos, gastos, utilidad]
      properties:
        id_comercio: { type: integer, format: int64 }
        periodo: { type: string }
        ingresos: { type: number, format: double }
        costos: { type: number, format: double }
        gastos: { type: number, format: double }
        utilidad: { type: number, format: double }
    BalanceGeneral:
      type: object
      required: [id_comercio, fecha_corte, activos, pasivos, patrimonio]
      properties:
        id_comercio: { type: integer, format: int64 }
        fecha_corte: { type: string, format: date }
        activos: { type: number, format: double }
        pasivos: { type: number, format: double }
        patrimonio: { type: number, format: double }
    TableroEjecutivo:
      type: object
      required: [id_comercio, periodo, indicadores]
      properties:
        id_comercio: { type: integer, format: int64 }
        periodo: { type: string }
        indicadores:
          type: object
          properties:
            ventas: { type: number, format: double }
            costos: { type: number, format: double }
            utilidad: { type: number, format: double }
            cuentas_por_cobrar: { type: number, format: double }
            cuentas_por_pagar: { type: number, format: double }
