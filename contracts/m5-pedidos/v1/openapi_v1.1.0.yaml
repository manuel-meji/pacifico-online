            $ref: '#/components/schemas/PedidoMaestro'

    MensajeOperacion:
      type: object
      required: [mensaje]
      properties:
        mensaje:
          type: string
          example: Operación realizada con éxito.

    # Esquemas de Eventos Publicados por M5 (100% alineados con los schemas de M2, M4, M6 y M7)
    PedidoConfirmadoEvento:
      type: object
      description: |
        Payload del evento canónico PedidoConfirmado (ADR-005) hacia M4, M6, M2 y M7.
        Incluye tanto el desglose completo en `subpedidos` (para M6/M2) como los campos planos
        `id_comercio`, `id_subpedido` y `reservas` requeridos por el schema `EventoPedidoConfirmado` de M4.
      required: [id_evento, fecha_evento, id_pedido, id_cliente, id_comercio, id_subpedido, reservas, monto_total, subpedidos]
      properties:
        id_evento:
          type: string
          format: uuid
        fecha_evento:
          type: string
          format: date-time
        id_pedido:
          type: integer
          format: int64
        id_cliente:
          type: integer
          format: int64
        id_comercio:
          type: integer
          format: int64
          description: Comercio del subpedido (requerido por M4 en EventoPedidoConfirmado).
        id_subpedido:
          type: integer
          format: int64
          description: Subpedido confirmado (requerido por M4 en EventoPedidoConfirmado).
        reservas:
          type: array
          minItems: 1
          description: Lista de UUIDs de reservas a confirmar en M4.
          items:
            type: string
            format: uuid
        monto_total:
          type: number
          format: double
        subpedidos:
          type: array
          items:
            type: object
            required: [id_subpedido, id_comercio, subtotal, costo_envio, impuesto, reservas]
            properties:
              id_subpedido:
                type: integer
                format: int64
              id_comercio:
                type: integer
                format: int64
              subtotal:
                type: number
                format: double
              costo_envio:
                type: number
                format: double
              impuesto:
                type: number
                format: double
              reservas:
                type: array
                items:
                  type: string
                  format: uuid

    SubpedidoDespachadoEvento:
      type: object
      description: |
        Payload del evento canónico SubpedidoDespachado (homologa a PedidoDespachado del PC2, INC-11)
        emitido por M5 hacia M1 (seguimiento), M2 (comisión sobre subtotal, RN-010),
        M4 (salida física y kardex) y M7 (asiento de costo de ventas).
        Incluye `fecha_evento` (esperado por M4), `fecha` (esperado por M7) y `fecha_despacho` (M5).
      required:
        - id_evento
        - fecha_evento
        - fecha
        - fecha_despacho
        - evento
        - id_subpedido
        - id_pedido
        - id_comercio
        - subtotal
        - costo_envio
        - estado_subpedido
        - reservas
      properties:
        id_evento:
          type: string
          format: uuid
          description: Identificador único del evento para control de idempotencia en M2, M4 y M7.
        fecha_evento:
          type: string
          format: date-time
          description: Marca temporal del evento (campo requerido por M4 en EventoSubpedidoDespachado).
        fecha:
          type: string
          format: date-time
          description: Alias de fecha_evento (campo esperado por M7 en x-eventos-consumidos).
        fecha_despacho:
          type: string
          format: date-time
          description: Marca temporal en que se registró el despacho en M5.
        evento:
          type: string
          example: SubpedidoDespachado
        id_subpedido:
          type: integer
          format: int64
        id_pedido:
          type: integer
          format: int64
        id_comercio:
          type: integer
          format: int64
        subtotal:
          type: number
          format: double
        costo_envio:
          type: number
          format: double
        estado_subpedido:
          type: string
          example: despachado
        guia_transporte:
          type: string
          nullable: true
        reservas:
          type: array
          minItems: 1
          description: Lista de identificadores UUID de las reservas en M4 asociadas al subpedido.
          items:
            type: string
            format: uuid

    SubpedidoEntregadoEvento:
      type: object
      description: |
        Payload del evento SubpedidoEntregado emitido hacia M1 y M7.
        Incluye `fecha` (esperado por M7 en x-eventos-consumidos) y `fecha_entrega` (M5).
      required: [id_evento, id_pedido, id_subpedido, id_comercio, fecha, fecha_entrega]
      properties:
        id_evento:
          type: string
          format: uuid
        id_pedido:
          type: integer
          format: int64
        id_subpedido:
          type: integer
          format: int64
        id_comercio:
          type: integer
          format: int64
        fecha:
          type: string
          format: date-time
          description: Marca temporal esperada por M7 en x-eventos-consumidos.
        fecha_entrega:
          type: string
          format: date-time

    PedidoCanceladoEvento:
      type: object
      description: |
        Payload del evento PedidoCancelado (INC-13) emitido hacia M4 y M6.
        Incluye `id_comercio` e `id_subpedido` requeridos por el schema `EventoPedidoCancelado` de M4.
      required: [id_evento, fecha_evento, id_comercio, id_pedido, id_subpedido, motivo, requiere_reembolso, reservas]
      properties:
        id_evento:
          type: string
          format: uuid
        fecha_evento:
          type: string
          format: date-time
        id_comercio:
          type: integer
          format: int64
        id_pedido:
          type: integer
          format: int64
        id_subpedido:
          type: integer
          format: int64
        motivo:
          type: string
        requiere_reembolso:
          type: boolean
        reservas:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    SubpedidoCanceladoEvento:
      type: object
      description: Payload del evento SubpedidoCancelado (SC-02 / INC-13) emitido hacia M4 y M6.
      required: [id_evento, fecha_evento, id_comercio, id_pedido, id_subpedido, monto_subpedido, motivo, requiere_reembolso, reservas]
      properties:
        id_evento:
          type: string
          format: uuid
        fecha_evento:
          type: string
          format: date-time
        id_comercio:
          type: integer
          format: int64
        id_pedido:
          type: integer
          format: int64
        id_subpedido:
          type: integer
          format: int64
        monto_subpedido:
          type: number
          format: double
        motivo:
          type: string
        requiere_reembolso:
          type: boolean
        reservas:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    ErrorEstandar:
      type: object
      description: Formato común de error de la plataforma definido por el Núcleo Compartido (Sección 5.5).
      required: [error]
      properties:
        error:
          type: object
          required: [codigo, mensaje]
          properties:
            codigo:
              type: string
              description: Código transversal ERR-001 a ERR-006, o código propio ERR-M5-001 a ERR-M5-003.
              example: ERR-004
            mensaje:
              type: string
            detalles:
              type: object
              nullable: true
              additionalProperties: true

  responses:
    NoAutenticado:
      description: ERR-001 — Sesión inválida o expirada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEstandar'
          example:
            error:
              codigo: ERR-001
              mensaje: Tu sesión expiró, inicia sesión de nuevo.
              detalles: null
    AccesoDenegado:
      description: ERR-002 — Rol sin permiso para la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEstandar'
          example:
            error:
              codigo: ERR-002
              mensaje: No se encuentra autorizado para realizar esta acción.
              detalles: null
    PedidoNoEncontrado:
      description: ERR-004 (no existe) o ERR-003 (pertenece a otro cliente/comercio por aislamiento, Sección 5.3).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEstandar'
          example:
            error:
              codigo: ERR-004
              mensaje: No se encontró lo que buscas.
              detalles: null
    SubpedidoNoEncontrado:
      description: ERR-004 (no existe) o ERR-003 (pertenece a otro comercio/cliente por aislamiento, Sección 5.3).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEstandar'
          example:
            error:
              codigo: ERR-003
              mensaje: El recurso solicitado no existe o no es accesible.
              detalles: null
    ItemCarritoNoEncontrado:
      description: ERR-004 — El ítem no existe en items_carrito.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEstandar'
          example:
            error:
              codigo: ERR-004
              mensaje: No se encontró lo que buscas.
              detalles: null
    StockInsuficiente:
      description: ERR-M5-001 — M4 no pudo reservar las unidades solicitadas para el checkout (RN-04).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEstandar'
          example:
            error:
              codigo: ERR-M5-001
              mensaje: Uno o más productos no cuentan con existencias disponibles.
              detalles: null
    EstadoInvalidoParaOperacion:
      description: ERR-M5-002 — El subpedido o pedido no se encuentra en un estado admisible para la acción.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEstandar'
          example:
            error:
              codigo: ERR-M5-002
              mensaje: El subpedido ya fue despachado o cancelado previamente.
              detalles: null
    EstadoInvalidoParaCancelar:
      description: ERR-M5-003 — No se puede cancelar porque el pedido o subpedido ya fue despachado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEstandar'
          example:
            error:
              codigo: ERR-M5-003
              mensaje: El pedido no puede cancelarse porque ya fue despachado.
              detalles: null
    DatosInvalidos:
      description: ERR-005 — Validación de datos fallida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEstandar'
          example:
            error:
              codigo: ERR-005
              mensaje: Revisa los datos marcados (detalle por campo en detalles).
              detalles:
                cantidad: Debe ser un número entero mayor o igual a 1.
    DependenciaNoDisponible:
      description: ERR-006 — Uno de los módulos proveedores (M1, M2, M3, M4 o M6) no respondió a tiempo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEstandar'
          example:
            error:
              codigo: ERR-006
              mensaje: Servicio temporalmente no disponible, intentar de nuevo.
              detalles: null

# ---------------------------------------------------------------------------
# Interfaz PHP App\Contracts\M5_Pedidos\PedidosServiceInterface
# ---------------------------------------------------------------------------
x-interfaz-php:
  interfaz: App\Contracts\M5_Pedidos\PedidosServiceInterface
  ubicacion: app/Contracts/M5_Pedidos/PedidosServiceInterface.php
  doble_de_prueba: tests/Doubles/M5_Pedidos/PedidosServiceFake.php
  metodos:
    - firma: "obtenerPedido(int $idPedido): array"
      alias_m6: ["ObtenerDatosPedido", "ConsultarEstadoPedido"]
      equivale_a: GET /api/m5/v1/pedidos/{id_pedido}
      consumidores: [M4, M6, M7]
      retorna: Estructura del esquema PedidoMaestro (con id_cliente, estado_pedido, monto_total, subpedidos y líneas con id_reserva).
    - firma: "obtenerSubpedido(int $idSubpedido): array"
      equivale_a: GET /api/m5/v1/subpedidos/{id_subpedido}
      consumidores: [M2, M4, M6, M7]
      retorna: Estructura del esquema PedidoSubpedido (con id_pedido, id_comercio, subtotal, costo_envio, impuesto, estado_subpedido y líneas).
    - firma: "obtenerCarrito(int $idCliente): array"
      equivale_a: GET /api/m5/v1/carrito
      consumidores: [M1]
      retorna: Estructura del esquema Carrito.
    - firma: "agregarItemCarrito(int $idCliente, array $datos): array"
      equivale_a: POST /api/m5/v1/carrito/items
      consumidores: [M1]
      retorna: Estructura del esquema Carrito actualizado.

# ---------------------------------------------------------------------------
# Dependencias síncronas consumidas por M5
# ---------------------------------------------------------------------------
x-dependencias-consumidas:
  - modulo_proveedor: M1
    version: 1.1.0
    operaciones: [obtenerCliente, listarDireccionesCliente, obtenerDireccionCliente]
    uso: Obtener datos de la persona compradora y validar que el id_direccion_cliente pertenezca al cliente en checkout.
  - modulo_proveedor: M2
    version: 1.2.1
    operaciones: [ObtenerComercioActivo, ObtenerPoliticasEnvio]
    uso: Verificar que cada comercio del carrito esté en estado Activo y calcular el costo_envio por subpedido.
  - modulo_proveedor: M3
    version: 1.2.1
    operaciones: [obtenerVariacion]
    uso: Obtener precio vigente, tarifa_impuesto (IVA), disponibilidad comercial (disponible = true) e id_comercio.
  - modulo_proveedor: M4
    version: 1.1.0
    operaciones: [consultarStockDisponible, reservarExistencias, confirmarReserva, liberarReserva, confirmarSalidaPorReserva]
    uso: Verificar disponibilidad y ejecutar reserva atómica (ADR-002), confirmación, liberación o salida en despacho.
  - modulo_proveedor: M6
    version: 1.0.0
    operaciones: [ProcesarPagoPedido, ConsultarEstadoPago, GestionarReembolso, ListarFacturasPorPedido]
    uso: Solicitar el cobro síncrono en checkout (ADR-005), gestionar reembolsos por cancelación y consultar facturas.
  - modulo_proveedor: M7
    version: 1.0.0
    operaciones: [consultarEstadoContablePedido, consultarEstadoContableSubpedido]
    uso: Verificar la contabilización de pedidos y subpedidos.

# ---------------------------------------------------------------------------
# Contratos de eventos publicados y consumidos por M5
# ---------------------------------------------------------------------------
x-eventos:
  publicados_por_m5:
    - nombre: PedidoConfirmado
      version: 1.0.0
      consumidores: [M4, M6, M2]
      esquema:
        $ref: '#/components/schemas/PedidoConfirmadoEvento'
      disparador: Al confirmar el pedido maestro y sus subpedidos en checkout.
    - nombre: SubpedidoDespachado
      alias_catalogo_pc2: PedidoDespachado
      version: 1.0.0
      consumidores: [M1, M2, M4, M7]
      esquema:
        $ref: '#/components/schemas/SubpedidoDespachadoEvento'
      disparador: Al registrar el despacho de un subpedido por parte del comercio (CU-A05).
    - nombre: SubpedidoEntregado
      version: 1.0.0
      consumidores: [M1, M7]
      esquema:
        $ref: '#/components/schemas/SubpedidoEntregadoEvento'
      disparador: Al confirmar la entrega final del subpedido al cliente.
    - nombre: PedidoCancelado
      version: 1.0.0
      consumidores: [M4, M6]
      esquema:
        $ref: '#/components/schemas/PedidoCanceladoEvento'
      disparador: Al cancelar un pedido maestro completo antes de su despacho (INC-13).
    - nombre: SubpedidoCancelado
