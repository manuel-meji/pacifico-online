    CancelarSubpedidoRequest:
      type: object
      required: [motivo]
      properties:
        motivo:
          type: string
          description: Razón de la cancelación parcial (SC-02) en cancelaciones_pedido.
        requiere_reembolso:
          type: boolean
          default: true
          description: Bandera para que M6 efectúe el reembolso parcial.

    ResultadoPedidos:
      type: object
      required: [pagina, por_pagina, total_resultados, pedidos]
      properties:
        pagina:
          type: integer
        por_pagina:
          type: integer
        total_resultados:
          type: integer
        pedidos:
          type: array
