          default: tarjeta
          description: Medio de pago seleccionado para iniciar el cobro síncrono en M6.
        cupon_descuento:
          type: string
          maxLength: 50
          nullable: true
        tarjeta_regalo:
          type: string
          maxLength: 50
          nullable: true
        nota:
          type: string
          nullable: true
