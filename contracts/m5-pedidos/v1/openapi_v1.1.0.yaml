openapi: 3.0.3
info:
  title: M5 Carrito y pedidos — Contrato del módulo
  version: 1.1.0
  description: |
    Contrato formal del módulo M5 Carrito y pedidos de Pacíficos Online
    (IF6100, II Ciclo 2026, subgrupo SG5).

    Publica las operaciones que M5 ofrece a los demás módulos y al frontend de la
    plataforma, 100% alineado con el Modelo de Datos oficial de M5 para PC3
    (PostgreSQL, Sección 6.2), las reglas del Núcleo Compartido (Sección 5),
    la Solicitud de Cambio SC-02 (Cancelación parcial de subpedidos) y las
    versiones vigentes de M1 (1.1.0), M2 (1.2.1), M3 (1.2.1), M4 (1.1.0),
    M6 (1.0.0) y M7 (1.0.0).

    Entidades canónicas propietarias de M5:
    - pedidos_maestros (Cabecera global del pedido)
    - pedidos_subpedidos (Desglose por comercio para envíos, comisiones y facturación individual)
    - pedidos_lineas (Variaciones compradas por subpedido)
    - pedidos_carritos (Contenedor activo por cliente)
    - items_carrito (Líneas del carrito con soporte de reserva temporal M4 en formato UUID)
    - estados_pedido (Trazabilidad histórica de cambios de estado del pedido)
    - notas_cliente_pedido (Observaciones de la persona compradora)
    - recibos_cliente (Comprobantes temporales de venta)
    - cancelaciones_pedido (Registro formal de cancelaciones y flag de reembolso hacia M6)

    Cambios en la versión 1.1.0:
    1. id_reserva homologado a string (format: uuid) en ItemCarrito, PedidoLinea y
       AgregarItemCarritoRequest, conforme al contrato de M4 (v1.1.0) y la Sección 6.1/6.2.
    2. Se agregan id_cliente e id_direccion_cliente en PedidoMaestro y CrearPedidoRequest
       para soportar la facturación en M6 y la validación de dirección con M1 (v1.1.0).
    3. Se adopta el esquema común ErrorEstandar del Núcleo Compartido (Sección 5.5 y 5.7):
       { "error": { "codigo", "mensaje", "detalles" } } con códigos ERR-001 a ERR-006 y
       códigos de negocio propios ERR-M5-001 a ERR-M5-003.
    4. Se actualiza el esquema de seguridad web a sesionNucleo (Laravel Sanctum SPA, Sección 5.1)
       y se documenta la interfaz PHP App\Contracts\M5_Pedidos\PedidosServiceInterface.
    5. Se incluye a M4 Inventario como consumidor autorizado de obtenerPedido y obtenerSubpedido,
       y a M1 como consumidor de agregarItemCarrito y obtenerCarrito.
    6. Se documentan formalmente todos los eventos publicados y consumidos en x-eventos con
       id_evento (UUID) y lista de reservas (UUID) en los payloads.
  contact:
    name: Subgrupo SG5 — Módulo M5 (Manuel Salvador Mejicano Ortiz)
  x-modulo: M5
  x-subgrupo: SG5
  x-propietario-de:
    - pedidos_maestros
    - pedidos_subpedidos
    - pedidos_lineas
    - pedidos_carritos
    - items_carrito
    - estados_pedido
    - notas_cliente_pedido
    - recibos_cliente
    - cancelaciones_pedido
  x-consumidores-http: [Frontend del portal]
  x-consumidores-interfaz-php:
    - M1 Portal público y búsqueda
    - M2 Micrositios y comercios
    - M4 Inventario multiempresa
    - M6 Pagos y facturación electrónica
    - M7 ERP contable
servers:
  - url: /api/m5/v1
    description: Ruta base del módulo M5 en el ambiente de integración
tags:
  - name: Carrito
    description: Operaciones sobre pedidos_carritos e items_carrito.
  - name: Pedidos
    description: Orquestación de pedidos_maestros, notas, recibos y cancelaciones.
  - name: Subpedidos
    description: Gestión de pedidos_subpedidos y pedidos_lineas por comercio (despacho, entrega, SC-02).

paths:
  /carrito:
    get:
      tags: [Carrito]
      operationId: obtenerCarrito
      summary: Obtener carrito de compras activo
      description: |
        Devuelve el registro de `pedidos_carritos` activo para el cliente autenticado
        con sus correspondientes `items_carrito`. Si hay reservas temporales activas en M4,
        se incluye su `id_reserva` (UUID).
      x-consumidores: [Frontend del portal, M1 Portal público y búsqueda]
      x-operacion-interfaz-php: PedidosServiceInterface::obtenerCarrito
      security:
        - sesionNucleo: []
      responses:
        '200':
          description: Carrito activo y sus ítems.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrito'
        '401':
          $ref: '#/components/responses/NoAutenticado'

    delete:
      tags: [Carrito]
      operationId: vaciarCarrito
      summary: Vaciar carrito de compras
      description: |
        Elimina todos los `items_carrito` asociados al carrito activo del cliente.
        Si existían reservas activas en M4 (`id_reserva`), M5 invoca `liberarReserva` en M4.
      x-consumidores: [Frontend del portal]
      x-operacion-interfaz-php: PedidosServiceInterface::vaciarCarrito
      security:
        - sesionNucleo: []
      responses:
        '200':
          description: Carrito vaciado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeOperacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /carrito/items:
    post:
      tags: [Carrito]
      operationId: agregarItemCarrito
      summary: Agregar variación al carrito
      description: |
        Valida con M3 (`obtenerVariacion`) que la variación exista y esté habilitada para la
        venta (`disponible = true`), y con M4 (`consultarStockDisponible`) que tenga unidades
        disponibles. Inserta un nuevo registro en `items_carrito` para la variación
        (`id_variacion`) y cantidad. Opcionalmente almacena `id_reserva` (UUID) cuando se
        asocia una reserva temporal de M4.
      x-consumidores: [Frontend del portal, M1 Portal público y búsqueda]
      x-operacion-interfaz-php: PedidosServiceInterface::agregarItemCarrito
      x-dependencias: [M3.obtenerVariacion 1.2.1, M4.consultarStockDisponible 1.1.0]
      security:
        - sesionNucleo: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgregarItemCarritoRequest'
      responses:
        '201':
          description: Ítem añadido al carrito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrito'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '409':
          $ref: '#/components/responses/StockInsuficiente'
        '422':
          $ref: '#/components/responses/DatosInvalidos'
        '503':
          $ref: '#/components/responses/DependenciaNoDisponible'

  /carrito/items/{id_item_carrito}:
    parameters:
      - $ref: '#/components/parameters/IdItemCarrito'
    put:
      tags: [Carrito]
      operationId: actualizarCantidadItemCarrito
      summary: Modificar cantidad de un ítem en el carrito
      description: |
        Actualiza el campo `cantidad` en la tabla `items_carrito`. Debe ser mayor a 0.
      x-consumidores: [Frontend del portal]
      x-operacion-interfaz-php: PedidosServiceInterface::actualizarCantidadItemCarrito
      security:
        - sesionNucleo: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarCantidadItemRequest'
      responses:
        '200':
          description: Cantidad actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrito'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/ItemCarritoNoEncontrado'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

    delete:
      tags: [Carrito]
      operationId: eliminarItemCarrito
      summary: Eliminar un ítem del carrito
      description: |
        Elimina el registro de `items_carrito`. Si tenía un `id_reserva` activo, solicita
        su liberación a M4.
      x-consumidores: [Frontend del portal]
      x-operacion-interfaz-php: PedidosServiceInterface::eliminarItemCarrito
      security:
        - sesionNucleo: []
      responses:
        '200':
          description: Ítem eliminado del carrito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrito'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/ItemCarritoNoEncontrado'

  /pedidos:
    get:
      tags: [Pedidos]
      operationId: listarPedidos
      summary: Listar pedidos del cliente
      description: |
        Lista los registros de `pedidos_maestros` asociados al cliente autenticado
        (aislamiento aplicado por `FiltroClienteScope`, Sección 5.3).
      x-consumidores: [Frontend del portal]
      x-operacion-interfaz-php: PedidosServiceInterface::listarPedidos
      security:
        - sesionNucleo: []
      parameters:
        - name: estado_pedido
          in: query
          required: false
          schema:
            type: string
            example: confirmado
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: por_pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 15
      responses:
        '200':
          description: Lista paginada de pedidos maestros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoPedidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'

    post:
      tags: [Pedidos]
      operationId: crearPedidoCheckout
      summary: Crear pedido maestro y subpedidos (Checkout)
      description: |
        Orquesta la confirmación del pedido (CU-A02):
        1. Valida la dirección de envío del cliente con M1 (`obtenerDireccionCliente`).
        2. Verifica que cada comercio involucrado esté Activo en M2 (`ObtenerComercioActivo`)
           y obtiene sus tarifas de envío (`ObtenerPoliticasEnvio`).
        3. Obtiene de M3 (`obtenerVariacion`) el precio vigente y `tarifa_impuesto` de cada variación.
        4. Ejecuta de forma síncrona y atómica la reserva de existencias en M4 (`reservarExistencias`,
           ADR-002) obteniendo el `id_reserva` (UUID) por cada línea.
        5. Crea el registro en `pedidos_maestros`, los `pedidos_subpedidos` por comercio,
           las `pedidos_lineas`, el estado inicial en `estados_pedido` y las `notas_cliente_pedido`.
        6. Publica el evento `PedidoConfirmado` y solicita el cobro síncrono a M6 (`ProcesarPagoPedido`,
           ADR-005, meta <= 3 s en P95).
      x-consumidores: [Frontend del portal]
      x-operacion-interfaz-php: PedidosServiceInterface::crearPedidoCheckout
      x-dependencias:
        - M1.obtenerDireccionCliente 1.1.0
        - M2.ObtenerComercioActivo 1.2.1
        - M2.ObtenerPoliticasEnvio 1.2.1
        - M3.obtenerVariacion 1.2.1
        - M4.reservarExistencias 1.1.0
        - M6.ProcesarPagoPedido 1.0.0
      security:
        - sesionNucleo: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearPedidoRequest'
      responses:
        '201':
          description: Pedido maestro y subpedidos generados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoMaestro'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '409':
          $ref: '#/components/responses/StockInsuficiente'
        '422':
          $ref: '#/components/responses/DatosInvalidos'
        '503':
          $ref: '#/components/responses/DependenciaNoDisponible'

  /pedidos/{id_pedido}:
    parameters:
      - $ref: '#/components/parameters/IdPedido'
    get:
      tags: [Pedidos]
      operationId: obtenerPedido
      summary: Obtener detalle completo del pedido maestro
      description: |
        Devuelve el registro de `pedidos_maestros` (incluyendo `id_cliente` e `id_direccion_cliente`),
        sus `pedidos_subpedidos`, `pedidos_lineas` (con `id_reserva`), observaciones en
        `notas_cliente_pedido`, recibos en `recibos_cliente` e historial de `estados_pedido`.
        Consumido por M4 (validar estado pagado antes de salida física), por M6 (procesar pago
        y facturar) y por M7 (contabilizar la operación).
      x-consumidores:
        - Frontend del portal
        - M4 Inventario multiempresa
        - M6 Pagos y facturación electrónica
        - M7 ERP contable
      x-operacion-interfaz-php: PedidosServiceInterface::obtenerPedido
      security:
        - sesionNucleo: []
      responses:
        '200':
          description: Detalle completo del pedido maestro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoMaestro'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/PedidoNoEncontrado'

  /pedidos/{id_pedido}/cancelar:
    parameters:
      - $ref: '#/components/parameters/IdPedido'
    post:
      tags: [Pedidos]
      operationId: cancelarPedidoTotal
      summary: Cancelar pedido maestro completo
      description: |
        Cancela el pedido en `pedidos_maestros` (si ningún subpedido ha sido despachado),
        actualiza `estado_pedido: cancelado`, crea registro en `cancelaciones_pedido`
        especificando `motivo` y `requiere_reembolso` e inserta en `estados_pedido`.
        Libera las reservas en M4 (`liberarReserva` / evento `PedidoCancelado`) y, si
        ya estaba pagado, solicita el reembolso a M6 (`GestionarReembolso`).
      x-consumidores: [Frontend del portal, M6 Pagos y facturación electrónica]
      x-operacion-interfaz-php: PedidosServiceInterface::cancelarPedidoTotal
      security:
        - sesionNucleo: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelarPedidoRequest'
      responses:
        '200':
          description: Pedido cancelado y registrado en cancelaciones_pedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoMaestro'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/PedidoNoEncontrado'
        '409':
          $ref: '#/components/responses/EstadoInvalidoParaCancelar'

  /subpedidos/{id_subpedido}:
    parameters:
      - $ref: '#/components/parameters/IdSubpedido'
    get:
      tags: [Subpedidos]
      operationId: obtenerSubpedido
      summary: Consultar detalle de un subpedido específico
      description: |
        Devuelve el registro de `pedidos_subpedidos` y sus correspondientes `pedidos_lineas`.
        Consumido por M2 (calcular comisión sobre `subtotal`, RN-010), por M4 (validar vínculo
        pedido/subpedido/comercio antes de salida de almacén), por M6 (facturación por subpedido)
        y por M7 (asientos contables por subpedido).
      x-consumidores:
        - Frontend del portal
        - M2 Micrositios y comercios
        - M4 Inventario multiempresa
        - M6 Pagos y facturación electrónica
        - M7 ERP contable
      x-operacion-interfaz-php: PedidosServiceInterface::obtenerSubpedido
      security:
        - sesionNucleo: []
      responses:
        '200':
          description: Detalle del subpedido por comercio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoSubpedido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/SubpedidoNoEncontrado'

  /subpedidos/{id_subpedido}/despachar:
    parameters:
      - $ref: '#/components/parameters/IdSubpedido'
    post:
      tags: [Subpedidos]
      operationId: despacharSubpedido
      summary: Registrar despacho de subpedido por el comercio
      description: |
        Actualiza `estado_subpedido: despachado` en `pedidos_subpedidos` (CU-A05).
        Invoca la salida de reserva en M4 y emite el evento canónico `SubpedidoDespachado`
        (que homologa a `PedidoDespachado` del catálogo PC2, INC-11) hacia M1 (seguimiento
        del cliente), M2 (cálculo y registro de comisión sobre el subtotal, RN-010),
        M4 (salida física y kardex valorizado) y M7 (asiento de costo de ventas).
      x-consumidores: [Frontend del portal, M2 Micrositios y comercios]
      x-operacion-interfaz-php: PedidosServiceInterface::despacharSubpedido
      security:
        - sesionNucleo: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DespacharSubpedidoRequest'
      responses:
        '200':
          description: Subpedido actualizado a estado despachado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoSubpedido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/SubpedidoNoEncontrado'
        '409':
          $ref: '#/components/responses/EstadoInvalidoParaOperacion'

  /subpedidos/{id_subpedido}/entregar:
    parameters:
      - $ref: '#/components/parameters/IdSubpedido'
    post:
      tags: [Subpedidos]
      operationId: confirmarEntregaSubpedido
      summary: Confirmar entrega de subpedido al cliente
      description: |
        Actualiza `estado_subpedido: entregado` en `pedidos_subpedidos`. Emite el evento
        `SubpedidoEntregado` hacia M1 (actualización de estado visible) y M7 (registro del
        pasivo / cuenta por pagar al comercio).
      x-consumidores: [Frontend del portal, M2 Micrositios y comercios]
      x-operacion-interfaz-php: PedidosServiceInterface::confirmarEntregaSubpedido
      security:
        - sesionNucleo: []
      responses:
        '200':
          description: Entrega confirmada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoSubpedido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/SubpedidoNoEncontrado'
        '409':
          $ref: '#/components/responses/EstadoInvalidoParaOperacion'

  /subpedidos/{id_subpedido}/cancelar:
    parameters:
      - $ref: '#/components/parameters/IdSubpedido'
    post:
      tags: [Subpedidos]
      operationId: cancelarSubpedidoParcial
      summary: Cancelar subpedido individual (Regla SC-02)
      description: |
        Ejecuta la cancelación parcial de un subpedido específico bajo la Solicitud de Cambio SC-02.
        Actualiza `estado_subpedido: cancelado` en `pedidos_subpedidos` y registra la anulación
        en `cancelaciones_pedido` con `requiere_reembolso: true`. Emite el evento `SubpedidoCancelado`
        para que M4 libere únicamente las reservas de este subpedido y solicita a M6 el reembolso
        parcial (`GestionarReembolso`), tras lo cual M6 emite la nota de crédito y publica
        `ReembolsoProcesado` hacia M7.
      x-consumidores: [Frontend del portal, M2 Micrositios y comercios, M6 Pagos y facturación electrónica]
      x-operacion-interfaz-php: PedidosServiceInterface::cancelarSubpedidoParcial
      security:
        - sesionNucleo: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelarSubpedidoRequest'
      responses:
        '200':
          description: Subpedido cancelado bajo SC-02.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoSubpedido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/SubpedidoNoEncontrado'
        '409':
          $ref: '#/components/responses/EstadoInvalidoParaCancelar'

components:
  securitySchemes:
    sesionNucleo:
      type: apiKey
      in: cookie
      name: laravel_session
      description: |
        Sesión estándar de Laravel gestionada por el núcleo compartido (Laravel Sanctum en modo SPA,
        Sección 5.1). Las llamadas entre módulos ocurren dentro del mismo proceso mediante la interfaz
        PHP PedidosServiceInterface y aplican FiltroComercioScope y FiltroClienteScope (Sección 5.3).
    tokenNucleo:
      type: http
      scheme: bearer
      description: |
        Alias mantenido por compatibilidad hacia atrás con la v1.0.0 para pruebas automatizadas HTTP.

  parameters:
    IdItemCarrito:
      name: id_item_carrito
      in: path
      required: true
      description: PK de la tabla items_carrito.
      schema:
        type: integer
        format: int64
        minimum: 1
    IdPedido:
      name: id_pedido
      in: path
      required: true
      description: PK de la tabla pedidos_maestros.
      schema:
        type: integer
        format: int64
        minimum: 1
    IdSubpedido:
      name: id_subpedido
      in: path
      required: true
      description: PK de la tabla pedidos_subpedidos.
      schema:
        type: integer
        format: int64
        minimum: 1

  schemas:
    ItemCarrito:
      type: object
      required: [id_item_carrito, id_carrito, id_variacion, cantidad]
      properties:
        id_item_carrito:
          type: integer
          format: int64
          description: PK de items_carrito.
        id_carrito:
          type: integer
          format: int64
          description: FK a pedidos_carritos.
        id_variacion:
          type: integer
          format: int64
          description: FK lógica a producto_variaciones (M3).
        cantidad:
          type: integer
          minimum: 1
          description: Cantidad a comprar (> 0).
        id_reserva:
          type: string
          format: uuid
          nullable: true
          description: FK lógica a reservas (M4, UUID). Asignación temporal de inventario.
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    Carrito:
      type: object
      required: [id_carrito, id_cliente, items]
      properties:
        id_carrito:
          type: integer
          format: int64
          description: PK de pedidos_carritos.
        id_cliente:
          type: integer
          format: int64
          description: FK lógica a clientes (M1).
        monto_estimado:
          type: number
          format: double
          nullable: true
          description: Total calculado con base en los precios vigentes de M3.
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemCarrito'

    PedidoLinea:
      type: object
      required: [id_linea, id_subpedido, id_variacion, cantidad, precio_unitario, tarifa_impuesto]
      properties:
        id_linea:
          type: integer
          format: int64
          description: PK de pedidos_lineas.
        id_subpedido:
          type: integer
          format: int64
