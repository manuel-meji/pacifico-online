openapi: 3.0.3
info:
  title: M1 Portal público y búsqueda — Contrato del módulo
  version: 1.7.0
  description: |
    Contrato formal del módulo M1 Portal público y búsqueda de Pacíficos Online
    (IF6100, II Ciclo 2026, subgrupo SG1).

    Publica las operaciones que M1 ofrece a los demás módulos y al frontend de la
    plataforma, tal como se declararon en la sección 6.1 del PC2, más las que se
    agregan en la versión 1.1.0 para acoplarse a las versiones corregidas de M2
    (1.1.0), M3 (1.2.0), M4 (1.1.0) y M5, y a las decisiones del Comité.

    - Buscar productos
    - Listar destacados
    - Obtener datos del cliente
    - Registrar cliente y actualizar cliente (la operación "Registrar o actualizar
      cliente" del PC2 se separa en dos rutas, una para crear y otra para modificar)
    - Nuevas en 1.1.0: categorías del portal, ficha de producto, micrositio,
      listado de comercios y direcciones de envío del cliente.

    M1 es el módulo propietario de la entidad Cliente (tabla clientes) y de sus
    direcciones de envío (tabla direcciones_cliente) según el modelo canónico
    aprobado por el Comité en el PC2. Comercio, Producto y Disponibilidad
    pertenecen a M2, M3 y M4; M1 solo los presenta y los obtiene por los contratos
    de esos módulos. M1 es dueño de la selección de destacados, el orden de las
    categorías del menú, las promociones y las noticias del portal.

    Versionado. Un cambio que rompe a los consumidores (quitar o renombrar un campo,
    cambiar un tipo, cambiar un código de respuesta) exige publicar una versión mayor
    nueva (v2) y mantener la v1 en convivencia. Agregar un campo opcional o una
    operación nueva aumenta solo la versión menor. Ver x-historial-versiones.

    Formato de error. Desde la versión 1.1.0 se usa el formato común definido por
    el núcleo compartido (sección 5.5 de los artefactos colectivos del PC3):
    {"error": {"codigo", "mensaje", "detalles"}}. Los códigos transversales son
    ERR-001 a ERR-006; los errores propios del negocio de M1 siguen el formato
    ERR-M1-nnn definido por el núcleo (ERR-M1-001, correo ya registrado).

    Integración con otros módulos. Por decisión del Comité de Arquitectura e
    Integración, los módulos se comunican de forma sincrónica por la interfaz PHP
    App\Contracts\M1_Portal\PortalPublicoContract, dentro de la misma aplicación Laravel.
    Las rutas HTTP de este documento son para el frontend (Inertia con React,
    decisión del PC2). Las llamadas por la interfaz PHP no llevan sesión de
    usuario, por lo que pueden hacerse desde procesos en segundo plano. La
    autorización de RN-M1-16 (cada persona compradora solo ve y edita sus propios
    datos) se aplica en la capa web, no en la interfaz. Los métodos de la
    interfaz se documentan en x-interfaz-php.
  contact:
    name: Subgrupo SG1 — Módulo M1
  x-modulo: M1
  x-subgrupo: SG1
  x-propietario-de: [Cliente, DireccionCliente]
  x-consumidores-http: [Frontend del portal]
  x-consumidores-interfaz-php: [M5 Carrito y pedidos, M6 Pagos y facturación, Núcleo compartido]
servers:
  - url: /api/m1/v1
    description: Ruta base del módulo en el ambiente de integración (propuesta SG1)
tags:
  - name: Cupones
    description: Nuevo en 1.5.0 (SC-11). Cupones de descuento; M5 los valida en el checkout y registra su uso.
  - name: Noticias
    description: Nuevo en 1.4.0 (SC-08). Noticias de la plataforma; las publica solo la administración.
  - name: Promociones
    description: Nuevo en 1.4.0 (SC-08). Promociones de los comercios y sección del portal.
  - name: Búsqueda
    description: Búsqueda de productos de los comercios habilitados.
  - name: Destacados
    description: Comercios y productos destacados para la página principal.
  - name: Navegación
    description: Categorías del menú, ficha de producto, micrositio y listado de comercios.
  - name: Clientes
    description: Datos de la persona compradora. M1 es el propietario de esta entidad.
  - name: Direcciones
    description: Direcciones de envío de la persona compradora. M1 es el propietario.

paths:
  /productos/busqueda:
    get:
      tags: [Búsqueda]
      operationId: buscarProductos
      summary: Buscar productos
      description: |
        Devuelve los productos que coinciden con el término y los filtros, solo de
        comercios habilitados (RN-M1-01, RN-M1-02). Precio y datos del producto se
        muestran tal como los entrega M3 (RN-M1-03). La disponibilidad viene de M4.
        Si no hay coincidencias se devuelve una lista vacía con código 200.
        Realiza el caso de uso CU-002 Buscar productos.

        Desde 1.1.0: la búsqueda la ejecuta M3 (buscarProductos 1.2.0, que solo
        devuelve productos publicados de comercios activos) y M1 completa cada
        resultado con la disponibilidad agregada por producto de M4
        (consultarDisponibilidadProductoLote 1.1.0). Se agregan los filtros que M3
        publicó en su versión 1.2.0. M1 registra cada búsqueda y sus filtros en
        busquedas_usuario y filtros_aplicados.
      x-consumidores: [Frontend del portal]
      x-reglas: [RN-M1-01, RN-M1-02, RN-M1-03, RN-M1-07, RN-M1-08]
      x-dependencias: [M3.buscarProductos 1.2.0, M4.consultarDisponibilidadProductoLote 1.1.0, M2.ObtenerResumenComerciosLote 1.1.0]
      security: []
      parameters:
        - name: q
          in: query
          required: false
          description: Texto de búsqueda. Mínimo 2 caracteres si no se envía categoría (RN-M1-08).
          schema:
            type: string
            minLength: 2
            maxLength: 100
          example: camisa
        - name: id_categoria
          in: query
          required: false
          description: Filtra por categoría o subcategoría. Incluye los productos de sus subcategorías (M3 1.2.0).
          schema:
            type: integer
            minimum: 1
        - name: id_comercio
          in: query
          required: false
          description: Filtra por comercio.
          schema:
            type: integer
            minimum: 1
        - name: id_marca
          in: query
          required: false
          description: Filtra por marca (nuevo en 1.1.0).
          schema:
            type: integer
            minimum: 1
        - name: precio_minimo
          in: query
          required: false
          description: Precio mínimo de alguna variación del producto (nuevo en 1.1.0).
          schema:
            type: number
            format: double
            minimum: 0
        - name: precio_maximo
          in: query
          required: false
          description: Precio máximo de alguna variación del producto (nuevo en 1.1.0).
          schema:
            type: number
            format: double
            minimum: 0
        - name: orden
          in: query
          required: false
          description: Criterio de ordenamiento (nuevo en 1.1.0). Si se omite, relevancia de la búsqueda.
          schema:
            type: string
            enum: [precio_asc, precio_desc, novedad]
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: por_pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Resultado de la búsqueda (puede venir vacío).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoBusqueda'
              examples:
                conResultados:
                  summary: Hay coincidencias
                  value:
                    pagina: 1
                    por_pagina: 20
                    total_resultados: 1
                    productos:
                      - id_producto: 1520
                        nombre: Camisa de lino
                        imagen_principal: https://cdn.pacificos.example/p/1520.jpg
                        precio: 18500.00
                        precio_hasta: 21000.00
                        moneda: CRC
                        disponibilidad: Disponible
                        comercio:
                          id_comercio: 34
                          nombre_comercial: Tienda La Ceiba
                sinResultados:
                  summary: Sin coincidencias (A2)
                  value:
                    pagina: 1
                    por_pagina: 20
                    total_resultados: 0
                    productos: []
        '422':
          $ref: '#/components/responses/CriterioInvalido'
        '503':
          $ref: '#/components/responses/DependenciaNoDisponible'

  /destacados:
    get:
      tags: [Destacados]
      operationId: listarDestacados
      summary: Listar comercios y productos destacados
      description: |
        Devuelve los comercios y productos destacados de la página principal, solo
        de comercios habilitados (RN-M1-05, RN-M1-06). Si M2 o M3 no responden, la
        sección afectada viene vacía y se informa en secciones_no_disponibles, sin
        fallar la respuesta completa (RNF-M1-05, RNF-M1-06).

        Aclaración 1.1.0 (sin cambio en la respuesta): M3 marca qué productos son
        destacables y M1 decide cuáles se muestran en la portada, en qué posición y
        durante qué periodo (tablas productos_destacados y comercios_destacados).
        M1 obtiene los datos con M3.buscarProductos (filtro ids) y
        M2.ObtenerResumenComerciosLote. Ambos omiten los productos no publicados y
        los comercios no activos, que tampoco se muestran aquí. El orden de la
        respuesta es el de la columna posicion de M1.

        Desde 1.4.0 (SC-08), los comercios destacados los decide M2: son los que
        tienen una publicidad vigente aprobada en el panel de M2 (el comercio la
        solicita y la plataforma la aprueba, o la plataforma destaca
        directamente). M1 los obtiene con M2.ListarComerciosHabilitados
        (destacado=true), en el orden de M2 (la publicidad más reciente primero),
        y ya no usa la tabla comercios_destacados.

        Desde 1.4.0 (SC-08), en la sección de productos:
        - Cada comercio tiene como máximo 3 productos destacados activos; si la
          selección tiene más, se muestran los 3 de menor posicion.
        - Un producto agotado (M4) no se muestra y vuelve a aparecer solo cuando
          recupera existencias dentro de su periodo. Tampoco se muestran los
          productos que el comercio desactivó (M3 los omite) ni los de comercios
          suspendidos (M2). Si M4 no responde, no se oculta ninguno y salen con
          disponibilidad Agotado.
        - Se muestran hasta 12. Si hay más, se rotan por turnos de 15 minutos:
          cada turno avanza tantas posiciones como el límite, tomando la lista
          como circular, así todos aparecen el mismo tiempo.
      x-consumidores: [Frontend del portal]
      x-reglas: [RN-M1-01, RN-M1-05, RN-M1-06]
      x-dependencias: [M3.buscarProductos 1.3.0 (filtro ids), M2.ListarComerciosHabilitados 1.2.1 (destacado=true), M2.ObtenerResumenComerciosLote 1.2.1, M4.consultarDisponibilidadProductoLote 1.1.0]
      security: []
      parameters:
        - name: limite
          in: query
          required: false
          description: |
            Cantidad máxima de comercios y de productos. Desde 1.4.0 el máximo
            y el valor por defecto son 12; un valor fuera de rango se ajusta al
            más cercano, sin error.
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 12
      responses:
        '200':
          description: Destacados vigentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destacados'

  /categorias:
    get:
      tags: [Navegación]
      operationId: listarCategoriasPortal
      summary: Listar categorías del menú del portal
      description: |
        Nuevo en 1.1.0. Devuelve las categorías visibles en el menú del portal, en
        el orden que define M1 (tabla categorias_portal), con sus subcategorías.
        Los nombres y la jerarquía se obtienen de M3.listarCategorias (lista plana
        con id_categoria_padre); M1 arma el árbol.

        Solo se incluyen las categorías y subcategorías que tienen al menos un
        producto visible (RN-M1-09). Para saberlo, M1 consulta M3.buscarProductos
        con el filtro id_categoria y por_pagina 1, y descarta las categorías con
        total_resultados igual a 0. El resultado se guarda en caché del portal. Si
        M3 agrega en su contrato la cantidad de productos visibles por categoría,
        esta consulta adicional se reemplaza por ese dato.
      x-consumidores: [Frontend del portal]
      x-reglas: [RN-M1-09]
      x-dependencias: [M3.listarCategorias 1.2.0, M3.buscarProductos 1.2.0 (filtro id_categoria)]
      security: []
      responses:
        '200':
          description: Categorías del menú, ordenadas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoriaPortal'
        '503':
          $ref: '#/components/responses/DependenciaNoDisponible'

  /productos/{id_producto}:
    parameters:
      - $ref: '#/components/parameters/IdProducto'
    get:
      tags: [Navegación]
      operationId: obtenerFichaProducto
      summary: Obtener la ficha de un producto
      description: |
        Nuevo en 1.1.0. Arma la ficha del producto (alcance mínimo de M1 en el
        PC4) a partir de M3.obtenerProducto, la disponibilidad por variación de
        M4.consultarDisponibilidadLote, el resumen del comercio de M2 y los
        productos relacionados de M3. Una variación es comprable solo si M3 la
        declara disponible y M4 informa unidades. Responde 404 si M3 no devuelve
        el producto (no existe, no está publicado o su comercio no está activo).
      x-consumidores: [Frontend del portal]
      x-dependencias: [M3.obtenerProducto 1.2.0, M3.listarRelacionados 1.2.0, M3.listarMarcas 1.2.0, M4.consultarDisponibilidadLote 1.1.0, M2.ObtenerResumenComerciosLote 1.1.0]
      security: []
      responses:
        '200':
          description: Ficha del producto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FichaProducto'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'
        '503':
          $ref: '#/components/responses/DependenciaNoDisponible'

  /comercios:
    get:
      tags: [Navegación]
      operationId: listarComercios
      summary: Listar comercios habilitados
      description: |
        Nuevo en 1.1.0. Página de comercios del portal. Toma el listado de
        M2.ListarComerciosHabilitados, que solo devuelve comercios activos.

        Desde 1.3.0: una pagina o por_pagina que no sea un entero dentro del
        rango responde 422 con ERR-005 y el detalle por campo.

        Desde 1.6.0 (SC-13): con q busca por nombre comercial, sin distinguir
        mayúsculas ni tildes. M2 no ofrece búsqueda por nombre, así que M1
        recorre su listado de habilitados y filtra; primero van los nombres que
        empiezan con el término y luego el resto, en orden alfabético. total es
        la cantidad de coincidencias. Un q de menos de 2 o más de 100
        caracteres responde 422 con ERR-005. Sin q, igual que antes.
      x-consumidores: [Frontend del portal]
      x-dependencias: [M2.ListarComerciosHabilitados 1.1.0]
      security: []
      parameters:
        - name: q
          in: query
          required: false
          description: Nuevo en 1.6.0. Texto que debe contener el nombre comercial.
          schema:
            type: string
            minLength: 2
            maxLength: 100
          example: pacif
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: por_pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Página de comercios habilitados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListadoComercios'
        '422':
          description: |
            ERR-005. Paginación fuera de rango (desde 1.3.0) o q con menos de 2
            o más de 100 caracteres (desde 1.6.0), con el detalle por campo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/DependenciaNoDisponible'

  /comercios/{id_comercio}/micrositio:
    parameters:
      - $ref: '#/components/parameters/IdComercio'
    get:
      tags: [Navegación]
      operationId: obtenerMicrositio
      summary: Obtener el micrositio de un comercio
      description: |
        Nuevo en 1.1.0. Arma la vista de micrositio (alcance mínimo de M1 en el
        PC4): información pública del comercio de M2.ObtenerDatosComercioPublico y
        sus productos de M3.buscarProductos (filtro id_comercio), con la
        disponibilidad agregada de M4. Responde 404 si M2 responde 404 (el
        comercio no existe o no está activo).

        Desde 1.3.0: si M3 no responde, el micrositio se muestra igual con la
        información del comercio, la lista de productos vacía y
        productos_disponibles en false, para que el portal muestre un aviso.
        Si M2 no responde, 503. Una pagina o por_pagina que no sea un entero
        dentro del rango responde 422 con ERR-005.
      x-consumidores: [Frontend del portal]
      x-dependencias: [M2.ObtenerDatosComercioPublico 1.1.0, M3.buscarProductos 1.2.0, M4.consultarDisponibilidadProductoLote 1.1.0]
      security: []
      parameters:
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: por_pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Micrositio del comercio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Micrositio'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'
        '422':
          $ref: '#/components/responses/PaginacionInvalida'
        '503':
          $ref: '#/components/responses/DependenciaNoDisponible'

  /clientes:
    post:
      tags: [Clientes]
      operationId: registrarCliente
      summary: Registrar cliente
      description: |
        Crea la cuenta de una persona compradora (autorregistro desde el portal).
        El correo no puede repetirse (RN-M1-14). Solo M1 crea clientes (RN-M1-15).

        Desde 1.1.0: M1 coordina el registro dentro de una misma transacción.
        Solicita al núcleo compartido la creación de la cuenta de acceso con rol
        Cliente (ServicioIdentidad::crearCuenta), recibe el id_usuario y crea el registro en clientes con ese
        id_usuario. Ningún módulo escribe
        directamente en la tabla de usuarios del núcleo. Si cualquier paso falla,
        no queda ni la cuenta ni el cliente.

        Desde 1.2.0: el cuerpo trae la cédula (obligatoria y única) y la
        dirección de envío desglosada en el objeto direccion, con los campos de
        direcciones_cliente. Esa dirección se guarda como la dirección
        principal del cliente, en la misma transacción.
      x-consumidores: [Frontend del portal]
      x-reglas: [RN-M1-14, RN-M1-15]
      x-dependencias: [Nucleo.ServicioIdentidad::crearCuenta]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroCliente'
      responses:
        '201':
          description: Cliente creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteId'
        '409':
          $ref: '#/components/responses/CorreoDuplicado'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /clientes/sesion:
    get:
      tags: [Clientes]
      operationId: obtenerClienteSesion
      summary: Obtener el cliente de la persona con sesión
      description: |
        Nuevo en 1.2.0. Devuelve los datos de la persona compradora que tiene
        la sesión abierta. El frontend la usa para conocer su id_cliente, que
        el núcleo no entrega en /api/user. Si la cuenta no pertenece a un
        cliente (por ejemplo, una cuenta de comercio), responde ERR-003.
      x-consumidores: [Frontend del portal]
      x-reglas: [RN-M1-16]
      security:
        - sesionNucleo: []
      responses:
        '200':
          description: Datos del cliente con sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/ClienteNoAccesible'

  /clientes/{id_cliente}:
    parameters:
      - $ref: '#/components/parameters/IdCliente'
    get:
      tags: [Clientes]
      operationId: obtenerCliente
      summary: Obtener datos del cliente
      description: |
        Devuelve los datos de la persona compradora.

        Por esta ruta web, usada por el frontend, solo la propia persona puede
        consultar sus datos y ningún comercio puede consultar clientes
        (RN-M1-16, RNF-M1-08).

        M5 (pedido) y M6 (factura) no usan esta ruta. Consultan la misma operación
        por la interfaz PHP con PortalPublicoContract::obtenerCliente(), sin
        sesión de usuario, incluso desde procesos en segundo plano. Esa operación
        no cambia en 1.1.0.

        Desde 1.7.0 (SC-14) la respuesta incluye identificacion_tributaria, la
        cédula del cliente. Por esta ruta solo la ve la propia persona.
      x-consumidores: [Frontend del portal]
      x-operacion-interfaz-php: PortalPublicoContract::obtenerCliente
      x-reglas: [RN-M1-15, RN-M1-16]
      security:
        - sesionNucleo: []
      responses:
        '200':
          description: Datos del cliente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/ClienteNoAccesible'
    put:
      tags: [Clientes]
      operationId: actualizarCliente
      summary: Actualizar cliente
      description: |
        Reemplaza los datos de la persona compradora. Solo la propia persona puede
        modificarlos (RN-M1-16) y solo M1 los modifica (RN-M1-15).

        Desde 1.2.0 esta operación no modifica direcciones: la dirección
        principal y las demás se cambian con las operaciones de Direcciones.
        La cédula no se cambia desde aquí.

        Temporal en 1.2.0: el correo no se puede cambiar (422 ERR-005 con
        detalle en correo_electronico) hasta que el núcleo ofrezca
        actualizarCorreo, porque el inicio de sesión usa el correo de la
        cuenta del núcleo. Se acepta el mismo correo con otras mayúsculas.
      x-consumidores: [Frontend del portal]
      x-reglas: [RN-M1-14, RN-M1-15, RN-M1-16]
      security:
        - sesionNucleo: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatosCliente'
      responses:
        '200':
          description: Cliente actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteId'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/ClienteNoAccesible'
        '409':
          $ref: '#/components/responses/CorreoDuplicado'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /clientes/{id_cliente}/direcciones:
    parameters:
      - $ref: '#/components/parameters/IdCliente'
    get:
      tags: [Direcciones]
      operationId: listarDireccionesCliente
      summary: Listar direcciones de envío del cliente
      description: |
        Nuevo en 1.1.0. Devuelve las direcciones de envío de la persona
        compradora, para que elija una al confirmar la compra. Solo la propia
        persona puede consultarlas (RN-M1-16). M5 usa la operación equivalente de
        la interfaz PHP (PortalPublicoContract::listarDireccionesCliente).
      x-consumidores: [Frontend del portal]
      x-operacion-interfaz-php: PortalPublicoContract::listarDireccionesCliente
      x-reglas: [RN-M1-16]
      security:
        - sesionNucleo: []
      responses:
        '200':
          description: Direcciones del cliente. La principal viene primero.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DireccionCliente'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/ClienteNoAccesible'
    post:
      tags: [Direcciones]
      operationId: agregarDireccionCliente
      summary: Agregar una dirección de envío
      description: |
        Nuevo en 1.1.0. Agrega una dirección. El alias no puede repetirse para el
        mismo cliente y solo puede haber una dirección principal: si la nueva se
        marca como principal, la anterior deja de serlo.
      x-consumidores: [Frontend del portal]
      x-reglas: [RN-M1-15, RN-M1-16]
      security:
        - sesionNucleo: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatosDireccionCliente'
      responses:
        '201':
          description: Dirección creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DireccionCliente'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/ClienteNoAccesible'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /clientes/{id_cliente}/direcciones/{id_direccion_cliente}:
    parameters:
      - $ref: '#/components/parameters/IdCliente'
      - $ref: '#/components/parameters/IdDireccionCliente'
    put:
      tags: [Direcciones]
      operationId: actualizarDireccionCliente
      summary: Actualizar una dirección de envío
      description: |
        Nuevo en 1.1.0. Reemplaza los datos de una dirección del propio cliente.
        El alias no puede repetirse para el mismo cliente. Marcarla como
        principal desmarca la anterior.

        Desde 1.2.0 la dirección principal no se puede desmarcar directamente
        (422 con detalle en es_principal): se cambia marcando otra como
        principal. Así el cliente siempre tiene una dirección principal y el
        direccion_envio que leen M5 y M6 nunca queda vacío.
      x-consumidores: [Frontend del portal]
      x-reglas: [RN-M1-15, RN-M1-16]
      security:
        - sesionNucleo: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatosDireccionCliente'
      responses:
        '200':
          description: Dirección actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DireccionCliente'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          description: |
            ERR-003 si el cliente no es la persona con sesión (RN-M1-16), o
            ERR-004 si la dirección no existe o no pertenece a ese cliente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /destacados/tarifas:
    get:
      tags: [Destacados]
      operationId: listarTarifasDestacado
      summary: Tarifas de los periodos de producto destacado
      description: |
        Nuevo en 1.4.0 (SC-08). Tarifa fija de cada periodo (7, 15 o 30 días)
        que define la administración. Es pública para que el panel del comercio
        la muestre antes de solicitar. Un periodo sin tarifa no aparece y no se
        puede solicitar.
      x-consumidores: [Panel del comercio (M2), Panel de la administración (M2)]
      security: []
      responses:
        '200':
          description: Tarifas definidas, por periodo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TarifaDestacado'

  /comercio/destacados/solicitudes:
    post:
      tags: [Destacados]
      operationId: solicitarDestacado
      summary: El comercio solicita destacar uno de sus productos
      description: |
        Nuevo en 1.4.0 (SC-08). El comercio de la sesión (rol
        encargado_comercio; el comercio sale de la sesión, nunca del cuerpo)
        pide destacar uno de sus productos por 7, 15 o 30 días. Se guarda la
        tarifa vigente del periodo, que es la que se cobra si se aprueba. Queda
        pendiente hasta que la administración la apruebe o la rechace.

        - 404 ERR-004 si el producto no existe, no está publicado o es de otro
          comercio (no se distingue, para no revelar productos ajenos).
        - 409 ERR-M1-003 si el producto ya está destacado o ya tiene una
          solicitud pendiente.
        - 422 ERR-005 si el periodo no es 7, 15 o 30, o no tiene tarifa.
        - El máximo de 3 destacados activos por comercio se valida al aprobar.
      x-consumidores: [Panel del comercio (M2)]
      x-reglas: [RN-12]
      x-dependencias: [M3.obtenerProducto (comercio del producto)]
      security:
        - sesionNucleo: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaSolicitudDestacado'
      responses:
        '201':
          description: Solicitud creada, pendiente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudDestacado'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolSinPermiso'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoDestacado'
        '422':
          $ref: '#/components/responses/DatosInvalidos'
        '503':
          $ref: '#/components/responses/DependenciaNoDisponible'
    get:
      tags: [Destacados]
      operationId: listarSolicitudesDestacado
      summary: Solicitudes de destacado del comercio de la sesión
      description: |
        Nuevo en 1.4.0 (SC-08). Solo las del comercio de la sesión (RN-12), de
        la más reciente a la más antigua. Una aprobada trae fecha_inicio y
        fecha_fin del periodo.
      x-consumidores: [Panel del comercio (M2)]
      x-reglas: [RN-12]
      security:
        - sesionNucleo: []
      parameters:
        - $ref: '#/components/parameters/EstadoSolicitudDestacado'
      responses:
        '200':
          description: Solicitudes del comercio.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SolicitudDestacado'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolSinPermiso'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /administracion/destacados/solicitudes:
    get:
      tags: [Destacados]
      operationId: listarSolicitudesDestacadoAdministracion
      summary: Solicitudes de destacado de todos los comercios
      description: |
        Nuevo en 1.4.0 (SC-08). Solo el rol encargado_plataforma, con el acceso
        auditado del núcleo. Filtros opcionales por estado y comercio.
      x-consumidores: [Panel de la administración (M2)]
      security:
        - sesionNucleo: []
      parameters:
        - $ref: '#/components/parameters/EstadoSolicitudDestacado'
        - name: id_comercio
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Solicitudes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SolicitudDestacado'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolSinPermiso'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /administracion/destacados/solicitudes/{id_solicitud_destacado}/aprobar:
    parameters:
      - $ref: '#/components/parameters/IdSolicitudDestacado'
    post:
      tags: [Destacados]
      operationId: aprobarSolicitudDestacado
      summary: Aprobar una solicitud de destacado
      description: |
        Nuevo en 1.4.0 (SC-08). Solo encargado_plataforma. El periodo empieza
        en el momento de aprobar y dura los días solicitados. Se genera un
        cargo con la tarifa guardada en la solicitud, que se descuenta de la
        liquidación del comercio (ver x-interfaz-php-comercial). El periodo
        corre aunque el producto se oculte (agotado, desactivado o comercio
        suspendido) y no se reembolsa.

        - 409 ERR-M1-002 si el comercio ya tiene 3 destacados activos en ese
          periodo (cuentan los pagados y los de la administración).
        - 409 ERR-M1-003 si la solicitud ya fue resuelta o el producto ya está
          destacado en ese periodo.
      x-consumidores: [Panel de la administración (M2)]
      security:
        - sesionNucleo: []
      responses:
        '200':
          description: Solicitud aprobada, con fecha_inicio y fecha_fin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudDestacado'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolSinPermiso'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoDestacado'

  /administracion/destacados/solicitudes/{id_solicitud_destacado}/rechazar:
    parameters:
      - $ref: '#/components/parameters/IdSolicitudDestacado'
    post:
      tags: [Destacados]
      operationId: rechazarSolicitudDestacado
      summary: Rechazar una solicitud de destacado
      description: |
        Nuevo en 1.4.0 (SC-08). Solo encargado_plataforma. El motivo es
        obligatorio y lo ve el comercio. No genera cargo.
      x-consumidores: [Panel de la administración (M2)]
      security:
        - sesionNucleo: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RechazoSolicitudDestacado'
      responses:
        '200':
          description: Solicitud rechazada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudDestacado'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolSinPermiso'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoDestacado'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /administracion/destacados:
    post:
      tags: [Destacados]
      operationId: destacarProductoPlataforma
      summary: La administración destaca un producto por su cuenta, sin costo
      description: |
        Nuevo en 1.4.0 (SC-08). Solo encargado_plataforma, por ejemplo para una
        campaña. Fechas libres con fecha y hora; no genera cargo. Aplica el
        máximo de 3 destacados activos del comercio del producto en esas fechas
        (409 ERR-M1-002) y no permite destacar dos veces el mismo producto en
        fechas que se cruzan (409 ERR-M1-003).
      x-consumidores: [Panel de la administración (M2)]
      x-dependencias: [M3.obtenerProducto (comercio del producto)]
      security:
        - sesionNucleo: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoDestacadoPlataforma'
      responses:
        '201':
          description: Destacado creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestacadoPlataforma'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolSinPermiso'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoDestacado'
        '422':
          $ref: '#/components/responses/DatosInvalidos'
        '503':
          $ref: '#/components/responses/DependenciaNoDisponible'

  /administracion/destacados/tarifas/{periodo_dias}:
    parameters:
      - name: periodo_dias
        in: path
        required: true
        schema:
          type: integer
          enum: [7, 15, 30]
    put:
      tags: [Destacados]
      operationId: definirTarifaDestacado
      summary: Definir la tarifa de un periodo de destacado
      description: |
        Nuevo en 1.4.0 (SC-08). Solo encargado_plataforma. Crea o reemplaza la
        tarifa fija del periodo. Las solicitudes ya hechas conservan la tarifa
        con la que se solicitaron.
      x-consumidores: [Panel de la administración (M2)]
      security:
        - sesionNucleo: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatosTarifaDestacado'
      responses:
        '200':
          description: Tarifa guardada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TarifaDestacado'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolSinPermiso'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /promociones:
    get:
      tags: [Promociones]
      operationId: listarPromocionesVigentes
      summary: Promociones vigentes de la sección del portal
      description: |
        Nuevo en 1.4.0 (SC-08). Las promociones que rebajan el precio ahora
        (activas, no ocultas y dentro de su periodo), en el orden que decide la
        plataforma (las sin orden van al final, por fecha de inicio). Cada una
        trae su producto, solo si M3 lo publica y su comercio está activo.
      x-consumidores: [Frontend del portal]
      x-dependencias: [M3.buscarProductos (filtro ids), M2.ObtenerResumenComerciosLote, M4.consultarDisponibilidadProductoLote]
      security: []
      responses:
        '200':
          description: Promociones vigentes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PromocionVigente'
        '503':
          $ref: '#/components/responses/DependenciaNoDisponible'

  /noticias:
    get:
      tags: [Noticias]
      operationId: listarNoticias
      summary: Noticias publicadas de la plataforma
      description: |
        Nuevo en 1.4.0 (SC-08). Noticias publicadas y dentro de su periodo
        (fecha_publicacion <= ahora <= fecha_fin), de la más reciente a la más
        antigua. Los borradores y las archivadas no se muestran. Contenido
        informativo distinto de las promociones (comercios nuevos, campañas de
        temporada, avisos de mantenimiento, cambios en políticas).
      x-consumidores: [Frontend del portal]
      x-dependencias: []
      security: []
      parameters:
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: por_pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Página de noticias publicadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListadoNoticias'
        '422':
          $ref: '#/components/responses/PaginacionInvalida'

  /noticias/{slug}:
    parameters:
      - $ref: '#/components/parameters/SlugNoticia'
    get:
      tags: [Noticias]
      operationId: obtenerNoticia
      summary: Detalle de una noticia publicada
      description: |
        Nuevo en 1.4.0 (SC-08). La noticia con su contenido y las promociones
        que enlaza que estén vigentes y visibles (mismo esquema que
        listarPromocionesVigentes). Una noticia puede enlazar promociones,
        pero es una entidad aparte. Si M3 no responde, la noticia se muestra
        igual con promociones vacío.
      x-consumidores: [Frontend del portal]
      x-dependencias: [M3.buscarProductos (filtro ids), M2.ObtenerResumenComerciosLote, M4.consultarDisponibilidadProductoLote]
      security: []
      responses:
        '200':
          description: Noticia publicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticiaDetalle'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'

  /comercio/promociones:
    post:
      tags: [Promociones]
      operationId: crearPromocion
      summary: El comercio crea una promoción para uno de sus productos
      description: |
        Nuevo en 1.4.0 (SC-08). Rol encargado_comercio; el comercio sale de la
        sesión (RN-12). Solo dos tipos: porcentaje (mayor que 0 y menor que
        100) o precio_fijo (menor que el precio normal de cada variación
        afectada). Fecha y hora de inicio y de fin obligatorias: se puede
        programar por adelantado y se activa y desactiva sola. Al producto
        completo o a variaciones específicas.

        - 404 ERR-004 si el producto no existe, no está publicado o es de otro comercio.
        - 409 ERR-M1-004 si el producto o una de sus variaciones ya tiene otra
          promoción activa en fechas que se cruzan.
      x-consumidores: [Panel del comercio (M2)]
      x-reglas: [RN-12]
      x-dependencias: [M3.obtenerProducto (comercio y precios de las variaciones)]
      security:
        - sesionNucleo: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatosPromocion'
      responses:
        '201':
          description: Promoción creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promocion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolSinPermiso'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoPromocion'
        '422':
          $ref: '#/components/responses/DatosInvalidos'
        '503':
          $ref: '#/components/responses/DependenciaNoDisponible'
    get:
      tags: [Promociones]
      operationId: listarPromocionesComercio
      summary: Promociones del comercio de la sesión
      description: Nuevo en 1.4.0 (SC-08). Solo las del comercio de la sesión (RN-12), de la más reciente a la más antigua.
      x-consumidores: [Panel del comercio (M2)]
      x-reglas: [RN-12]
      security:
        - sesionNucleo: []
      parameters:
        - $ref: '#/components/parameters/EstadoPromocion'
      responses:
        '200':
          description: Promociones del comercio.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Promocion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolSinPermiso'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /comercio/promociones/{id_promocion}:
    parameters:
      - $ref: '#/components/parameters/IdPromocion'
    put:
      tags: [Promociones]
      operationId: actualizarPromocion
      summary: Modificar una promoción del comercio
      description: |
        Nuevo en 1.4.0 (SC-08). Una promoción programada (no ha empezado) se
        reemplaza completa con DatosPromocion, sin cambiar el producto. Una que
        ya empezó solo acepta {fecha_fin}, para adelantar el fin (entre el
        momento actual y el fin vigente); cualquier otro campo responde 422.
        Una finalizada o desactivada responde 409 ERR-M1-005.
      x-consumidores: [Panel del comercio (M2)]
      x-reglas: [RN-12]
      security:
        - sesionNucleo: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/DatosPromocion'
                - $ref: '#/components/schemas/AdelantoPromocion'
      responses:
        '200':
          description: Promoción actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promocion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolSinPermiso'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoPromocion'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /comercio/promociones/{id_promocion}/desactivar:
    parameters:
      - $ref: '#/components/parameters/IdPromocion'
    post:
      tags: [Promociones]
      operationId: desactivarPromocion
      summary: Desactivar una promoción del comercio
      description: |
        Nuevo en 1.4.0 (SC-08). Deja de rebajar el precio de inmediato y no se
        puede reactivar. 409 ERR-M1-005 si ya terminó o ya estaba desactivada.
      x-consumidores: [Panel del comercio (M2)]
      x-reglas: [RN-12]
      security:
        - sesionNucleo: []
      responses:
        '200':
          description: Promoción desactivada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promocion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolSinPermiso'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoPromocion'

  /administracion/promociones:
    get:
      tags: [Promociones]
      operationId: listarPromocionesAdministracion
      summary: Promociones de todos los comercios
      description: Nuevo en 1.4.0 (SC-08). Solo encargado_plataforma. Filtros opcionales por estado y comercio.
      x-consumidores: [Panel de la administración (M2)]
      security:
        - sesionNucleo: []
