          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Promociones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Promocion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolSinPermiso'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /administracion/promociones/{id_promocion}/orden:
    parameters:
      - $ref: '#/components/parameters/IdPromocion'
    put:
      tags: [Promociones]
      operationId: ordenarPromocion
      summary: Posición de una promoción en la sección del portal
      description: Nuevo en 1.4.0 (SC-08). Solo encargado_plataforma. 1 va primero; null la manda al final.
      x-consumidores: [Panel de la administración (M2)]
      security:
        - sesionNucleo: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdenPromocion'
      responses:
        '200':
          description: Promoción con su nueva posición.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promocion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolSinPermiso'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /administracion/promociones/{id_promocion}/ocultar:
    parameters:
      - $ref: '#/components/parameters/IdPromocion'
    post:
      tags: [Promociones]
      operationId: ocultarPromocion
      summary: Ocultar una promoción que incumple las políticas
      description: |
        Nuevo en 1.4.0 (SC-08). Solo encargado_plataforma, con motivo
        obligatorio. Mientras está oculta no se muestra ni rebaja el precio
        (el carrito vuelve al precio normal). Sigue contando para los traslapes.
      x-consumidores: [Panel de la administración (M2)]
      security:
        - sesionNucleo: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OcultamientoPromocion'
      responses:
        '200':
          description: Promoción oculta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promocion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolSinPermiso'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /administracion/promociones/{id_promocion}/mostrar:
    parameters:
      - $ref: '#/components/parameters/IdPromocion'
    post:
      tags: [Promociones]
      operationId: mostrarPromocion
      summary: Volver a mostrar una promoción oculta
      description: Nuevo en 1.4.0 (SC-08). Solo encargado_plataforma. Vuelve a rebajar el precio si sigue dentro de su periodo.
      x-consumidores: [Panel de la administración (M2)]
      security:
        - sesionNucleo: []
      responses:
        '200':
          description: Promoción visible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promocion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolSinPermiso'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'

  /administracion/noticias:
    post:
      tags: [Noticias]
      operationId: crearNoticia
      summary: La administración crea una noticia en borrador
      description: |
        Nuevo en 1.4.0 (SC-08). Solo encargado_plataforma; los comercios no
        publican noticias. Queda en borrador hasta publicarNoticia. El slug se
        genera a partir del título (único; si ya existe se agrega -2, -3...).
        Sin fecha_fin, se muestra un año desde que se publica.
      x-consumidores: [Panel de la administración (M2)]
      security:
        - sesionNucleo: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatosNoticia'
      responses:
        '201':
          description: Noticia creada en borrador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Noticia'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolSinPermiso'
        '422':
          $ref: '#/components/responses/DatosInvalidos'
    get:
      tags: [Noticias]
      operationId: listarNoticiasAdministracion
      summary: Todas las noticias, para la administración
      description: |
        Nuevo en 1.4.0 (SC-08). Solo encargado_plataforma. Todas las noticias
        (borradores, publicadas y archivadas), de la modificada más
        recientemente a la más antigua, con filtro opcional por estado.
      x-consumidores: [Panel de la administración (M2)]
      security:
        - sesionNucleo: []
      parameters:
        - $ref: '#/components/parameters/EstadoNoticia'
      responses:
        '200':
          description: Noticias.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Noticia'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolSinPermiso'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /administracion/noticias/{id_noticia}:
    parameters:
      - $ref: '#/components/parameters/IdNoticia'
    put:
      tags: [Noticias]
      operationId: actualizarNoticia
      summary: Editar una noticia
      description: |
        Nuevo en 1.4.0 (SC-08). Solo encargado_plataforma. Reemplaza los datos
        de un borrador o de una publicada (los enlaces a promociones también).
        El slug cambia con el título solo mientras es borrador. 409 ERR-M1-006
        si está archivada.
      x-consumidores: [Panel de la administración (M2)]
      security:
        - sesionNucleo: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatosNoticia'
      responses:
        '200':
          description: Noticia actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Noticia'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolSinPermiso'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoNoticia'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /administracion/noticias/{id_noticia}/publicar:
    parameters:
      - $ref: '#/components/parameters/IdNoticia'
    post:
      tags: [Noticias]
      operationId: publicarNoticia
      summary: Publicar un borrador
      description: |
        Nuevo en 1.4.0 (SC-08). Solo encargado_plataforma. La fecha de
        publicación es ahora, o fecha_publicacion para programarla; desde ese
        momento se muestra en el portal hasta fecha_fin. 409 ERR-M1-006 si ya
        está publicada o archivada.
      x-consumidores: [Panel de la administración (M2)]
      security:
        - sesionNucleo: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicacionNoticia'
      responses:
        '200':
          description: Noticia publicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Noticia'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolSinPermiso'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoNoticia'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /administracion/noticias/{id_noticia}/archivar:
    parameters:
      - $ref: '#/components/parameters/IdNoticia'
    post:
      tags: [Noticias]
      operationId: archivarNoticia
      summary: Archivar una noticia
      description: |
        Nuevo en 1.4.0 (SC-08). Solo encargado_plataforma. Un borrador o una
        publicada deja de mostrarse y ya no se modifica. 409 ERR-M1-006 si ya
        estaba archivada.
      x-consumidores: [Panel de la administración (M2)]
      security:
        - sesionNucleo: []
      responses:
        '200':
          description: Noticia archivada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Noticia'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolSinPermiso'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoNoticia'

  /cupones/vigentes:
    get:
      tags: [Cupones]
      operationId: listarCuponesVigentes
      summary: Cupones globales vigentes para el portal
      description: |
        Nuevo en 1.6.0 (SC-13). Pública. Los cupones globales de la plataforma
        (sin comercio) que el cliente puede usar hoy: activos, dentro de su
        vigencia y con usos disponibles. Primero los que vencen antes, hasta 12.
        No incluye los cupones de los comercios ni los contadores de uso.
      x-consumidores: [Frontend del portal]
      security: []
      responses:
        '200':
          description: Cupones globales vigentes; la lista puede venir vacía.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListadoCuponesVigentes'

  /cupones/validar:
    post:
      tags: [Cupones]
      operationId: validarCupon
      summary: Validar un cupón de descuento en el checkout
      description: |
        Nuevo en 1.5.0 (SC-11). La persona compradora con sesión consulta si un
        cupón aplica a su carrito y cuánto descuenta, antes de confirmar el
        pedido. No registra el uso: eso lo hace M5 al confirmar el pedido, por
        la interfaz PHP (registrarUsoCupon).

        - El cliente es el de la sesión. Si el cuerpo trae id_cliente, debe ser
          el mismo (404 ERR-003 en otro caso).
        - Un cupón global de la plataforma descuenta sobre subtotal. Un cupón
          de un comercio descuenta solo sobre el subtotal de ese comercio: el
          de subtotales_por_comercio o, si el carrito es de un solo comercio,
          subtotal.
        - subtotal va sin envío ni impuesto, con los precios de promoción ya
          aplicados.
        - Un cupón que no aplica responde 200 con valido=false, el motivo y un
          mensaje para mostrar. Un código inexistente y uno desactivado
          responden igual (motivo no_disponible).
        - Máximo 30 consultas por minuto.
      x-consumidores: [Checkout del frontend (M5)]
      x-reglas: [RN-M1-16]
      security:
        - sesionNucleo: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidarCuponRequest'
            example:
              codigo: PACIFICO10
              id_cliente: 5
              subtotal: 25000.00
              ids_comercios: [1, 3]
      responses:
        '200':
          description: Resultado de la validación, aplique o no el cupón.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoCupon'
              examples:
                aplicado:
                  value:
                    valido: true
                    id_cupon: 12
                    id_comercio: null
                    tipo_descuento: porcentaje
                    valor: 10.0
                    monto_descuento: 2500.00
                    motivo: null
                    mensaje: Cupón de 10 % aplicado.
                rechazado:
                  value:
                    valido: false
                    id_cupon: null
                    id_comercio: null
                    tipo_descuento: null
                    valor: null
                    monto_descuento: 0.00
                    motivo: vencido
                    mensaje: El cupón ya venció.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/ClienteNoAccesible'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /comercio/cupones:
    post:
      tags: [Cupones]
      operationId: crearCuponComercio
      summary: El comercio crea un cupón para sus productos
      description: |
        Nuevo en 1.5.0 (SC-11). Rol encargado_comercio; el comercio sale de la
        sesión (RN-12). El cupón descuenta solo sobre los productos de ese
        comercio. El código es único en toda la plataforma (409 ERR-M1-007) y
        se guarda en mayúsculas. Un cupón no se edita: se desactiva y se crea
        otro.
      x-consumidores: [Panel de gestión de M1]
      x-reglas: [RN-12]
      security:
        - sesionNucleo: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatosCupon'
      responses:
        '201':
          description: Cupón creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cupon'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolSinPermiso'
        '409':
          $ref: '#/components/responses/ConflictoCupon'
        '422':
          $ref: '#/components/responses/DatosInvalidos'
    get:
      tags: [Cupones]
      operationId: listarCuponesComercio
      summary: Cupones del comercio de la sesión
      description: Nuevo en 1.5.0 (SC-11). Solo los del comercio de la sesión (RN-12), del más reciente al más antiguo.
      x-consumidores: [Panel de gestión de M1]
      x-reglas: [RN-12]
      security:
        - sesionNucleo: []
      parameters:
        - $ref: '#/components/parameters/EstadoCupon'
      responses:
        '200':
          description: Cupones del comercio.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cupon'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolSinPermiso'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /comercio/cupones/{id_cupon}/desactivar:
    parameters:
      - $ref: '#/components/parameters/IdCupon'
    post:
      tags: [Cupones]
      operationId: desactivarCuponComercio
      summary: Desactivar un cupón del comercio
      description: |
        Nuevo en 1.5.0 (SC-11). Deja de aceptarse en el checkout de inmediato y
        no se puede reactivar. Desactivar uno ya desactivado responde 200 sin
        cambios. 404 ERR-004 si no existe o es de otro comercio.
      x-consumidores: [Panel de gestión de M1]
      x-reglas: [RN-12]
      security:
        - sesionNucleo: []
      responses:
        '200':
          description: Cupón desactivado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cupon'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolSinPermiso'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'

  /administracion/cupones:
    post:
      tags: [Cupones]
      operationId: crearCuponGlobal
      summary: La administración crea un cupón global de la plataforma
      description: |
        Nuevo en 1.5.0 (SC-11). Solo encargado_plataforma. El cupón queda sin
        comercio (id_comercio null) y descuenta sobre todo el subtotal del
        carrito. 409 ERR-M1-007 si el código ya existe.
      x-consumidores: [Panel de gestión de M1]
      security:
        - sesionNucleo: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatosCupon'
      responses:
        '201':
          description: Cupón global creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cupon'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolSinPermiso'
        '409':
          $ref: '#/components/responses/ConflictoCupon'
        '422':
          $ref: '#/components/responses/DatosInvalidos'
    get:
      tags: [Cupones]
      operationId: listarCuponesAdministracion
      summary: Cupones de la plataforma y de todos los comercios
      description: |
        Nuevo en 1.5.0 (SC-11). Solo encargado_plataforma. Filtros opcionales:
        estado, id_comercio (los de ese comercio) y ambito=global (solo los de
        la plataforma; tiene prioridad sobre id_comercio).
      x-consumidores: [Panel de gestión de M1]
      security:
        - sesionNucleo: []
      parameters:
        - $ref: '#/components/parameters/EstadoCupon'
        - name: id_comercio
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: ambito
          in: query
          required: false
          schema:
            type: string
            enum: [global]
      responses:
        '200':
          description: Cupones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cupon'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolSinPermiso'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /administracion/cupones/{id_cupon}/desactivar:
    parameters:
      - $ref: '#/components/parameters/IdCupon'
    post:
      tags: [Cupones]
      operationId: desactivarCuponAdministracion
      summary: La administración desactiva cualquier cupón
      description: |
        Nuevo en 1.5.0 (SC-11). Solo encargado_plataforma. Desactiva un cupón
        global o el de un comercio (por ejemplo, si incumple las políticas).
        404 ERR-004 si no existe.
      x-consumidores: [Panel de gestión de M1]
      security:
        - sesionNucleo: []
      responses:
        '200':
          description: Cupón desactivado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cupon'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolSinPermiso'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'

components:
  securitySchemes:
    sesionNucleo:
      type: apiKey
      in: cookie
      name: laravel_session
      description: |
        Sesión estándar de Laravel gestionada por el núcleo compartido
        (identidad, roles y permisos), coherente con la decisión del PC2 de usar
        Inertia con React. Las peticiones de escritura incluyen el token CSRF que
        Inertia y Axios envían automáticamente. Solo aplica a las rutas web; las
        llamadas entre módulos por la interfaz PHP no la usan. Reemplaza el
        esquema tokenNucleo de la versión 1.0.0.

  parameters:
    IdCupon:
      name: id_cupon
      in: path
      required: true
      description: Nuevo en 1.5.0.
      schema:
        type: integer
        minimum: 1
    EstadoCupon:
      name: estado
      in: query
      required: false
      description: Nuevo en 1.5.0. Deja solo los cupones en ese estado.
      schema:
        type: string
        enum: [programado, vigente, vencido, agotado, desactivado]
    IdCliente:
      name: id_cliente
      in: path
      required: true
      description: Identificador del cliente en el modelo canónico.
      schema:
        type: integer
        minimum: 1
    IdDireccionCliente:
      name: id_direccion_cliente
      in: path
      required: true
      description: Identificador de la dirección de envío.
      schema:
        type: integer
        minimum: 1
    IdProducto:
      name: id_producto
      in: path
      required: true
      description: Identificador del producto (propiedad de M3).
      schema:
        type: integer
        minimum: 1
    IdComercio:
      name: id_comercio
      in: path
      required: true
      description: Identificador del comercio (propiedad de M2).
      schema:
        type: integer
        minimum: 1

    IdSolicitudDestacado:
      name: id_solicitud_destacado
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    IdPromocion:
      name: id_promocion
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    EstadoPromocion:
      name: estado
      in: query
      required: false
      schema:
        type: string
        enum: [programada, vigente, finalizada, desactivada, oculta]
    IdNoticia:
      name: id_noticia
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    SlugNoticia:
      name: slug
      in: path
      required: true
      schema:
        type: string
        maxLength: 170
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    EstadoNoticia:
      name: estado
      in: query
      required: false
      schema:
        type: string
        enum: [borrador, publicada, archivada]
    EstadoSolicitudDestacado:
      name: estado
      in: query
      required: false
      schema:
        type: string
        enum: [pendiente, aprobada, rechazada]
  schemas:
    Disponibilidad:
      type: string
      description: |
        Estado que entrega M4. Para un producto con variaciones es Disponible si
        al menos una variación lo está. M1 traduce los valores de M4
        (disponible, agotado) a este formato.
      enum: [Disponible, Agotado]

    ComercioResumen:
      type: object
      required: [id_comercio, nombre_comercial]
      properties:
        id_comercio:
          type: integer
        nombre_comercial:
          type: string

    ProductoResumen:
      type: object
      required: [id_producto, nombre, precio, moneda, disponibilidad, comercio]
      properties:
        id_producto:
          type: integer
        nombre:
          type: string
        imagen_principal:
          type: string
          format: uri
          nullable: true
        precio:
          type: number
          format: double
          description: |
            Precio tal como lo entrega M3 (RN-M1-03). Cuando el producto tiene
            variaciones con precios distintos, es el precio más bajo
            (precio_desde de M3 1.2.0).
        precio_hasta:
          type: number
          format: double
          nullable: true
          description: |
            Nuevo en 1.1.0, opcional. Precio más alto entre las variaciones
            (precio_hasta de M3 1.2.0). Igual a precio si todas cuestan lo mismo.
        moneda:
          type: string
          example: CRC
        disponibilidad:
          $ref: '#/components/schemas/Disponibilidad'
        comercio:
          $ref: '#/components/schemas/ComercioResumen'
        promocion:
          $ref: '#/components/schemas/PromocionResumen'

    ResultadoBusqueda:
      type: object
      required: [pagina, por_pagina, total_resultados, productos]
      properties:
        pagina:
          type: integer
        por_pagina:
          type: integer
        total_resultados:
          type: integer
        productos:
          type: array
          items:
            $ref: '#/components/schemas/ProductoResumen'

    ComercioDestacado:
      type: object
      required: [id_comercio, nombre_comercial]
      properties:
        id_comercio:
          type: integer
        nombre_comercial:
          type: string
        logotipo:
          type: string
          format: uri
          nullable: true
          description: Corresponde a logo_url de M2.

    Destacados:
      type: object
      required: [comercios, productos, secciones_no_disponibles]
      properties:
        comercios:
          type: array
          items:
            $ref: '#/components/schemas/ComercioDestacado'
        productos:
          type: array
          items:
            $ref: '#/components/schemas/ProductoResumen'
        secciones_no_disponibles:
          type: array
          description: Secciones que no se pudieron cargar porque M2 o M3 no respondieron.
          items:
            type: string
            enum: [comercios, productos]

    CategoriaPortal:
      type: object
      required: [id_categoria, nombre, orden_visualizacion, subcategorias]
      properties:
        id_categoria:
          type: integer
          description: Identificador de la categoría en M3.
        nombre:
          type: string
          description: Nombre tal como lo entrega M3.
        icono_url:
          type: string
          format: uri
          nullable: true
        orden_visualizacion:
          type: integer
          minimum: 1
        subcategorias:
          type: array
          items:
            type: object
            required: [id_categoria, nombre]
            properties:
              id_categoria:
                type: integer
              nombre:
                type: string

    VariacionFicha:
      type: object
      required: [id_variacion, sku, precio, atributos, comprable, disponibilidad]
      properties:
        id_variacion:
          type: integer
        sku:
          type: string
        precio:
          type: number
          format: double
        atributos:
          type: array
          items:
            type: object
            required: [tipo_atributo, valor]
            properties:
              tipo_atributo:
                type: string
                example: Talla
              valor:
                type: string
                example: M
        disponibilidad:
          $ref: '#/components/schemas/Disponibilidad'
        comprable:
          type: boolean
          description: true solo si M3 declara la variación disponible para la venta y M4 informa unidades.
        precio_promocional:
          type: number
          description: Nuevo en 1.4.0, solo si la variación tiene una promoción vigente. Precio con la promoción, a 2 decimales.
        id_promocion:
          type: integer
          description: Nuevo en 1.4.0, solo si la variación tiene una promoción vigente.
        fin_promocion:
          type: string
          format: date-time
          description: Nuevo en 1.4.0, solo si la variación tiene una promoción vigente.

    FichaProducto:
      type: object
      required: [id_producto, nombre, moneda, imagenes, variaciones, comercio, relacionados]
      properties:
        id_producto:
          type: integer
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        marca:
          type: string
          nullable: true
          description: Nombre de la marca, resuelto con M3.listarMarcas.
        video_url:
          type: string
          format: uri
          nullable: true
        moneda:
          type: string
          example: CRC
        imagenes:
          type: array
          items:
            type: string
            format: uri
        variaciones:
          type: array
          items:
            $ref: '#/components/schemas/VariacionFicha'
        comercio:
          $ref: '#/components/schemas/ComercioResumen'
        relacionados:
          type: array
          items:
            $ref: '#/components/schemas/ProductoResumen'

    ListadoComercios:
      type: object
      required: [pagina, por_pagina, total, comercios]
      properties:
        pagina:
          type: integer
        por_pagina:
          type: integer
        total:
          type: integer
        comercios:
          type: array
          items:
            $ref: '#/components/schemas/ComercioDestacado'

    Micrositio:
      type: object
      required: [comercio, productos]
      properties:
        comercio:
          type: object
          description: Información pública del comercio, tal como la entrega M2.ObtenerDatosComercioPublico 1.1.0.
          required: [id_comercio, nombre_comercial]
          properties:
            id_comercio:
              type: integer
            nombre_comercial:
              type: string
            descripcion:
              type: string
              nullable: true
            logo_url:
              type: string
              format: uri
              nullable: true
            banners:
              type: array
              items:
                type: object
                properties:
                  imagen_url:
                    type: string
                    format: uri
                  texto_alternativo:
                    type: string
            galeria:
              type: array
              items:
                type: object
                properties:
                  imagen_url:
                    type: string
                    format: uri
                  texto_alternativo:
                    type: string
            horarios:
              type: array
              items:
                type: object
                properties:
                  dia_semana:
                    type: integer
                    minimum: 1
                    maximum: 7
                  hora_apertura:
                    type: string
                    nullable: true
                  hora_cierre:
                    type: string
                    nullable: true
                  cerrado:
                    type: boolean
            contacto:
              type: object
              properties:
                telefono:
                  type: string
                  nullable: true
                correo:
                  type: string
                  format: email
                  nullable: true
                direccion:
                  type: string
                  nullable: true
            redes_sociales:
              type: array
              items:
                type: object
                properties:
                  plataforma:
                    type: string
                  url:
                    type: string
                    format: uri
            politicas:
              type: array
              items:
                type: object
                properties:
                  tipo:
                    type: string
                  descripcion:
                    type: string
        productos:
          $ref: '#/components/schemas/ResultadoBusqueda'
        productos_disponibles:
          type: boolean
          description: |
            Nuevo en 1.3.0, opcional. false cuando M3 no respondió: productos
            viene vacío y el portal muestra un aviso en lugar de "sin
            productos". true cuando la lista viene de M3 (aunque esté vacía,
            caso A2). Si no viene, se asume true.

    DatosCliente:
      description: |
        Datos de la persona compradora que se envían al actualizar. Desde
        1.2.0 los largos coinciden con la tabla clientes (nombre 80,
        apellidos 120) y direccion_envio ya no forma parte de la entrada.
      type: object
      required: [nombre, apellidos, correo_electronico, telefono]
      properties:
        nombre:
          type: string
          maxLength: 80
        apellidos:
          type: string
          maxLength: 120
        correo_electronico:
          type: string
          format: email
          maxLength: 150
        telefono:
          type: string
          minLength: 1
          maxLength: 20
          description: Obligatorio desde 1.2.0; no puede quedar en blanco.

    RegistroCliente:
      description: |
        Nuevo en 1.1.0. Datos para el autorregistro; incluye la contraseña de
        la cuenta que crea el núcleo. Desde 1.2.0 incluye la cédula y la
        dirección principal desglosada (objeto direccion).
      allOf:
        - $ref: '#/components/schemas/DatosCliente'
        - type: object
          required: [cedula, contrasena, direccion]
          properties:
            cedula:
              type: string
              minLength: 1
              maxLength: 20
              description: Nuevo en 1.2.0. Obligatoria y única (clientes.cedula).
            contrasena:
              type: string
              format: password
              minLength: 8
              writeOnly: true
              description: Se entrega al núcleo para crear la cuenta; M1 no la guarda. Mínimo 8 caracteres, la misma regla de ServicioIdentidad::crearCuenta.
            direccion:
              description: Nuevo en 1.2.0. Se guarda como la dirección principal del cliente; es_principal se ignora.
              allOf:
                - $ref: '#/components/schemas/DatosDireccionCliente'

    Cliente:
      allOf:
        - $ref: '#/components/schemas/ClienteId'
        - $ref: '#/components/schemas/DatosCliente'
        - type: object
          required: [direccion_envio]
          properties:
            direccion_envio:
              type: string
              readOnly: true
              description: |
                Dirección principal del cliente en texto, tal como la usan M5 y
                M6 desde la versión 1.0.0. No se guarda: se arma con la
                dirección marcada como principal en direcciones_cliente (otras
                señas, distrito, cantón, provincia), o es una cadena vacía si
                el cliente no tiene direcciones. Desde 1.2.0 solo es de salida;
                para cambiarla, usar las operaciones de Direcciones.
            identificacion_tributaria:
              type: string
              maxLength: 20
              readOnly: true
              example: 5-0123-0456
              description: |
                Nuevo en 1.7.0 (SC-14). Cédula del cliente (clientes.cedula), la
                misma que se pidió al registrarse. M6 la usa como
                identificación del comprador en la factura. Es un dato
                personal: por las rutas web solo la recibe la propia persona
                (RN-M1-16), y las respuestas llevan Cache-Control no-store. Solo
                es de salida; la cédula no se cambia con actualizarCliente.

    ClienteId:
      type: object
      required: [id_cliente]
      properties:
        id_cliente:
          type: integer

    DatosDireccionCliente:
      type: object
      required: [alias_direccion, nombre_destinatario, telefono_destinatario, provincia, canton, distrito, otras_senas]
      properties:
        alias_direccion:
          type: string
          maxLength: 40
          example: Casa
        nombre_destinatario:
          type: string
          maxLength: 150
        telefono_destinatario:
          type: string
          maxLength: 20
        provincia:
          type: string
          maxLength: 40
        canton:
          type: string
          maxLength: 60
        distrito:
          type: string
          maxLength: 60
        otras_senas:
          type: string
          maxLength: 300
        es_principal:
          type: boolean
          default: false

    DireccionCliente:
      allOf:
        - type: object
          required: [id_direccion_cliente, id_cliente]
          properties:
            id_direccion_cliente:
              type: integer
            id_cliente:
              type: integer
        - $ref: '#/components/schemas/DatosDireccionCliente'

    DatosPromocion:
      type: object
      description: |
        Nuevo en 1.4.0. Cuerpo de crearPromocion y de actualizarPromocion para
        una programada. Con alcance variaciones, la lista de id_variacion del
        producto; con alcance producto, se omite.
      required: [id_producto, titulo, tipo, valor, alcance, fecha_inicio, fecha_fin]
      properties:
        id_producto:
          type: integer
          minimum: 1
        titulo:
          type: string
          minLength: 1
          maxLength: 120
        descripcion:
          type: string
          maxLength: 500
          nullable: true
        tipo:
          type: string
          enum: [porcentaje, precio_fijo]
        valor:
          type: number
          description: Porcentaje mayor que 0 y menor que 100, o precio fijo menor que el precio normal de cada variación afectada. Hasta 2 decimales.
        alcance:
          type: string
          enum: [producto, variaciones]
        variaciones:
          type: array
          items:
            type: integer
        fecha_inicio:
          type: string
          format: date-time
        fecha_fin:
          type: string
          format: date-time
          description: Posterior a fecha_inicio y al momento actual.
    AdelantoPromocion:
      type: object
      description: Nuevo en 1.4.0. Cuerpo de actualizarPromocion para una que ya empezó.
      required: [fecha_fin]
      properties:
        fecha_fin:
          type: string
          format: date-time
    Promocion:
      type: object
      description: Nuevo en 1.4.0. Promoción de un comercio.
      required: [id_promocion, id_comercio, id_producto, titulo, tipo, valor, alcance, variaciones, fecha_inicio, fecha_fin, estado]
      properties:
        id_promocion:
          type: integer
        id_comercio:
          type: integer
        id_producto:
          type: integer
        titulo:
          type: string
        descripcion:
          type: string
          nullable: true
        tipo:
          type: string
          enum: [porcentaje, precio_fijo]
        valor:
          type: number
        alcance:
          type: string
          enum: [producto, variaciones]
        variaciones:
          type: array
          items:
            type: integer
          description: Vacía con alcance producto.
        fecha_inicio:
          type: string
          format: date-time
        fecha_fin:
          type: string
          format: date-time
        estado:
          type: string
          enum: [programada, vigente, finalizada, desactivada, oculta]
        orden:
          type: integer
          nullable: true
        motivo_ocultamiento:
          type: string
          nullable: true
    PromocionResumen:
      type: object
      description: |
        Nuevo en 1.4.0. Promoción vigente de un producto, en ProductoResumen
        (solo si tiene una). precio_promocional es el precio desde con la
        promoción cuando aplica a todo el producto; con variaciones
        específicas va null y el precio de cada una está en la ficha.
      required: [id_promocion, titulo, tipo, valor, alcance, fecha_fin]
      properties:
        id_promocion:
          type: integer
        titulo:
          type: string
        tipo:
          type: string
          enum: [porcentaje, precio_fijo]
        valor:
          type: number
        alcance:
          type: string
          enum: [producto, variaciones]
        precio_promocional:
          type: number
          nullable: true
        fecha_fin:
          type: string
          format: date-time
    PromocionVigente:
      description: Nuevo en 1.4.0. Promoción de la sección del portal con su producto.
      allOf:
        - $ref: '#/components/schemas/Promocion'
        - type: object
          required: [producto]
          properties:
            producto:
              $ref: '#/components/schemas/ProductoResumen'
    OrdenPromocion:
      type: object
      description: Nuevo en 1.4.0. Cuerpo de ordenarPromocion.
      required: [orden]
      properties:
        orden:
          type: integer
          minimum: 1
          maximum: 32767
          nullable: true
    OcultamientoPromocion:
      type: object
      description: Nuevo en 1.4.0. Cuerpo de ocultarPromocion.
      required: [motivo]
      properties:
        motivo:
          type: string
          minLength: 1
          maxLength: 500
    DatosNoticia:
      type: object
      description: Nuevo en 1.4.0. Cuerpo de crearNoticia y actualizarNoticia.
      required: [titulo, resumen, contenido]
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 150
        resumen:
          type: string
          minLength: 1
          maxLength: 300
          description: Texto corto para la portada y el listado.
        contenido:
          type: string
          minLength: 1
          maxLength: 20000
        imagen_url:
          type: string
          format: uri
          maxLength: 255
          nullable: true
          description: URL http o https de la imagen.
        fecha_fin:
          type: string
          format: date-time
          nullable: true
          description: Hasta cuándo se muestra; debe ser futura. Sin valor, un año desde hoy.
        ids_promocion:
          type: array
          maxItems: 10
          items:
            type: integer
            minimum: 1
          description: Promociones de M1 que enlaza la noticia (deben existir). Sin valor, ninguna.
    PublicacionNoticia:
      type: object
      description: Nuevo en 1.4.0. Cuerpo opcional de publicarNoticia.
      properties:
        fecha_publicacion:
          type: string
          format: date-time
          nullable: true
          description: Para programar la publicación; debe ser anterior a fecha_fin. Sin valor, ahora.
    Noticia:
      type: object
      description: Nuevo en 1.4.0. Noticia completa, para la administración.
      required: [id_noticia, titulo, slug, resumen, contenido, imagen_url, estado, fecha_publicacion, fecha_fin, visible_en_portal, ids_promocion, id_usuario_autor]
      properties:
        id_noticia:
          type: integer
        titulo:
          type: string
        slug:
          type: string
        resumen:
          type: string
        contenido:
          type: string
        imagen_url:
          type: string
          nullable: true
        estado:
          type: string
          enum: [borrador, publicada, archivada]
        fecha_publicacion:
          type: string
          format: date-time
          nullable: true
          description: null mientras es borrador.
        fecha_fin:
          type: string
          format: date-time
        visible_en_portal:
          type: boolean
          description: true si está publicada y dentro de su periodo.
        ids_promocion:
          type: array
          items:
            type: integer
        id_usuario_autor:
          type: integer
    NoticiaResumen:
      type: object
      description: Nuevo en 1.4.0. Noticia en la portada y en el listado.
      required: [id_noticia, titulo, slug, resumen, imagen_url, fecha_publicacion]
      properties:
        id_noticia:
          type: integer
        titulo:
          type: string
        slug:
          type: string
        resumen:
          type: string
        imagen_url:
          type: string
          nullable: true
        fecha_publicacion:
          type: string
          format: date-time
    NoticiaDetalle:
      description: Nuevo en 1.4.0. Noticia publicada con su contenido y las promociones enlazadas vigentes.
      allOf:
        - $ref: '#/components/schemas/NoticiaResumen'
        - type: object
          required: [contenido, promociones]
          properties:
            contenido:
              type: string
            promociones:
              type: array
              items:
                $ref: '#/components/schemas/PromocionVigente'
    ListadoNoticias:
      type: object
      description: Nuevo en 1.4.0. Página de noticias publicadas.
      required: [pagina, por_pagina, total, noticias]
      properties:
        pagina:
          type: integer
        por_pagina:
          type: integer
        total:
          type: integer
        noticias:
          type: array
          items:
            $ref: '#/components/schemas/NoticiaResumen'
    PrecioVigente:
      type: object
      description: |
        Nuevo en 1.4.0. Precio de una variación con su promoción vigente, como
        lo entrega PortalPublicoContract::obtenerPreciosVigentes (M5).
      required: [id_variacion, precio_base, precio_final, id_promocion, fin_promocion]
      properties:
        id_variacion:
          type: integer
        precio_base:
          type: number
        precio_final:
          type: number
        id_promocion:
          type: integer
          nullable: true
        fin_promocion:
          type: string
          format: date-time
          nullable: true
    TarifaDestacado:
      type: object
      description: Nuevo en 1.4.0. Tarifa fija de un periodo de producto destacado.
      required: [periodo_dias, monto, moneda]
      properties:
        periodo_dias:
          type: integer
          enum: [7, 15, 30]
        monto:
          type: number
          minimum: 0
        moneda:
          type: string
          example: CRC
        actualizada:
          type: string
          format: date-time
          nullable: true
    DatosTarifaDestacado:
      type: object
      description: Nuevo en 1.4.0. Cuerpo de definirTarifaDestacado.
      required: [monto]
      properties:
        monto:
          type: number
          minimum: 0
          description: Monto fijo del periodo, con hasta 2 decimales.
    NuevaSolicitudDestacado:
      type: object
      description: Nuevo en 1.4.0. Cuerpo de solicitarDestacado. El comercio sale de la sesión.
      required: [id_producto, periodo_dias]
      properties:
        id_producto:
          type: integer
          minimum: 1
        periodo_dias:
          type: integer
          enum: [7, 15, 30]
    SolicitudDestacado:
      type: object
      description: |
        Nuevo en 1.4.0. Solicitud de un comercio para destacar uno de sus
        productos. monto es la tarifa vigente al solicitar, la que se cobra al
        aprobar. fecha_inicio y fecha_fin vienen solo si está aprobada.
      required: [id_solicitud_destacado, id_comercio, id_producto, periodo_dias, monto, moneda, estado]
      properties:
        id_solicitud_destacado:
          type: integer
        id_comercio:
          type: integer
        id_producto:
          type: integer
        periodo_dias:
          type: integer
          enum: [7, 15, 30]
        monto:
          type: number
        moneda:
          type: string
        estado:
          type: string
          enum: [pendiente, aprobada, rechazada]
        motivo_rechazo:
          type: string
          nullable: true
        fecha_solicitud:
          type: string
          format: date-time
          nullable: true
        fecha_resolucion:
          type: string
          format: date-time
          nullable: true
        fecha_inicio:
          type: string
          format: date-time
          nullable: true
        fecha_fin:
          type: string
          format: date-time
          nullable: true
    RechazoSolicitudDestacado:
      type: object
      description: Nuevo en 1.4.0. Cuerpo de rechazarSolicitudDestacado.
      required: [motivo]
      properties:
        motivo:
          type: string
          minLength: 1
          maxLength: 500
    NuevoDestacadoPlataforma:
      type: object
      description: Nuevo en 1.4.0. Cuerpo de destacarProductoPlataforma.
      required: [id_producto, fecha_inicio, fecha_fin]
      properties:
        id_producto:
          type: integer
          minimum: 1
        fecha_inicio:
          type: string
          format: date-time
        fecha_fin:
          type: string
          format: date-time
          description: Posterior a fecha_inicio y al momento actual.
    DestacadoPlataforma:
      type: object
      description: Nuevo en 1.4.0. Producto destacado por la administración, sin costo.
      required: [id_producto_destacado, id_producto, id_comercio, origen, fecha_inicio, fecha_fin]
      properties:
        id_producto_destacado:
          type: integer
        id_producto:
          type: integer
        id_comercio:
          type: integer
        origen:
          type: string
          enum: [solicitud, plataforma]
        fecha_inicio:
          type: string
          format: date-time
        fecha_fin:
          type: string
          format: date-time
    CargoDestacado:
      type: object
      description: |
        Nuevo en 1.4.0. Cargo de un destacado pagado que se aprobó; se descuenta
        de la liquidación del comercio. Lo entrega
        ComercialPortalContract::listarCargosDestacado (x-interfaz-php-comercial).
      required: [id_cargo_destacado, id_comercio, id_solicitud_destacado, id_producto, periodo_dias, monto, moneda, fecha_cargo, fecha_inicio, fecha_fin]
      properties:
        id_cargo_destacado:
          type: integer
        id_comercio:
          type: integer
        id_solicitud_destacado:
          type: integer
        id_producto:
          type: integer
        periodo_dias:
          type: integer
          enum: [7, 15, 30]
        monto:
          type: number
        moneda:
          type: string
        fecha_cargo:
          type: string
          format: date-time
        fecha_inicio:
          type: string
          format: date-time
        fecha_fin:
          type: string
          format: date-time
    Error:
      type: object
      description: |
        Formato común de error de la plataforma (núcleo compartido, sección 5.5
        del PC3). Reemplaza el formato propuesto por SG1 en la versión 1.0.0.
      required: [error]
      properties:
        error:
          type: object
          required: [codigo, mensaje]
          properties:
            codigo:
              type: string
              description: Código transversal ERR-001 a ERR-006, o código propio del negocio de M1.
              example: ERR-004
            mensaje:
              type: string
              description: Texto legible para mostrar al usuario.
            detalles:
              type: object
              nullable: true
              additionalProperties: true
              description: En ERR-005, un mapa campo → mensaje.

    DatosCupon:
      type: object
      description: |
        Nuevo en 1.5.0. Cuerpo de crearCuponComercio y crearCuponGlobal. El
        comercio sale de la sesión; un cupón de la administración queda global.
      required: [codigo, tipo_descuento, valor, fecha_inicio, fecha_fin]
      properties:
        codigo:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{2,49}$'
          description: Letras sin tilde, números, guion o guion bajo, sin espacios. Se guarda en mayúsculas y es único en toda la plataforma.
        descripcion:
          type: string
          maxLength: 255
          nullable: true
        tipo_descuento:
          type: string
          enum: [porcentaje, monto_fijo]
        valor:
          type: number
          description: Porcentaje mayor que 0 y menor que 100, o monto fijo en colones mayor que 0. Hasta 2 decimales.
        monto_minimo_compra:
          type: number
          minimum: 0
          nullable: true
          description: Subtotal mínimo sobre el que aplica el cupón (el del comercio, si el cupón es de un comercio). null si no hay mínimo.
        fecha_inicio:
          type: string
          format: date-time
        fecha_fin:
          type: string
          format: date-time
          description: Posterior a fecha_inicio y al momento actual.
        limite_usos_total:
          type: integer
          minimum: 1
          nullable: true
          description: Usos máximos entre todos los clientes. null si no hay límite.
        limite_usos_por_cliente:
          type: integer
          minimum: 1
          default: 1
          description: No puede ser mayor que limite_usos_total.
    Cupon:
      type: object
      description: Nuevo en 1.5.0. Cupón de descuento de un comercio o global de la plataforma.
      required: [id_cupon, id_comercio, codigo, descripcion, tipo_descuento, valor, monto_minimo_compra, fecha_inicio, fecha_fin, limite_usos_total, usos_actuales, limite_usos_por_cliente, activo, estado]
      properties:
        id_cupon:
          type: integer
        id_comercio:
          type: integer
          nullable: true
          description: null en un cupón global de la plataforma.
        codigo:
          type: string
        descripcion:
          type: string
          nullable: true
        tipo_descuento:
          type: string
          enum: [porcentaje, monto_fijo]
        valor:
          type: number
        monto_minimo_compra:
          type: number
          nullable: true
        fecha_inicio:
          type: string
          format: date-time
        fecha_fin:
          type: string
          format: date-time
        limite_usos_total:
          type: integer
          nullable: true
        usos_actuales:
          type: integer
        limite_usos_por_cliente:
          type: integer
        activo:
          type: boolean
        estado:
          type: string
          enum: [programado, vigente, vencido, agotado, desactivado]
          description: desactivado manda sobre los demás; agotado es que llegó a limite_usos_total.
    ValidarCuponRequest:
      type: object
      description: Nuevo en 1.5.0. Cuerpo de validarCupon.
      required: [codigo, subtotal]
      properties:
        codigo:
          type: string
          minLength: 1
          maxLength: 50
          description: No distingue mayúsculas.
        id_cliente:
          type: integer
          minimum: 1
          description: Opcional. Si viene, debe ser el cliente de la sesión.
        subtotal:
          type: number
          minimum: 0
          description: Subtotal del carrito, sin envío ni impuesto.
        ids_comercios:
          type: array
          items:
            type: integer
            minimum: 1
          description: Comercios presentes en el carrito.
        subtotales_por_comercio:
          type: array
          description: Subtotal de cada comercio del carrito. Necesario para un cupón de comercio cuando el carrito tiene productos de varios comercios.
          items:
            type: object
            required: [id_comercio, subtotal]
            properties:
              id_comercio:
                type: integer
                minimum: 1
              subtotal:
                type: number
                minimum: 0
    ListadoCuponesVigentes:
      type: object
      description: Nuevo en 1.6.0. Respuesta de listarCuponesVigentes.
      required: [cupones]
      properties:
        cupones:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/CuponPublico'
    CuponPublico:
      type: object
      description: |
        Nuevo en 1.6.0. Datos de un cupón global que el portal muestra al
        público. Sin identificadores internos ni contadores de uso.
      required: [codigo, descripcion, tipo_descuento, valor, monto_minimo_compra, fecha_fin, limite_usos_por_cliente]
      properties:
        codigo:
          type: string
          example: PACIFICO10
        descripcion:
          type: string
          nullable: true
          example: 10 % de descuento en toda la plataforma
        tipo_descuento:
          type: string
          enum: [porcentaje, monto_fijo]
        valor:
          type: number
          description: Porcentaje (1 a 100) o monto en colones, según tipo_descuento.
          example: 10
        monto_minimo_compra:
          type: number
          nullable: true
          example: 10000
        fecha_fin:
          type: string
          format: date-time
        limite_usos_por_cliente:
          type: integer
          nullable: true
          example: 1
    ResultadoCupon:
      type: object
      description: |
        Nuevo en 1.5.0. Resultado de validar un cupón, en la ruta web
        validarCupon y en el método validarCupon de la interfaz PHP.
      required: [valido, id_cupon, id_comercio, tipo_descuento, valor, monto_descuento, motivo, mensaje]
      properties:
        valido:
          type: boolean
        id_cupon:
          type: integer
          nullable: true
          description: null si no aplica. Es el que se pasa a registrarUsoCupon.
        id_comercio:
          type: integer
          nullable: true
          description: Comercio sobre cuyo subtotal se descuenta; null en un cupón global o si no aplica.
        tipo_descuento:
          type: string
          enum: [porcentaje, monto_fijo]
          nullable: true
        valor:
          type: number
          nullable: true
        monto_descuento:
          type: number
          description: Monto en colones a restar, a 2 decimales. Nunca supera la base del descuento. 0 si no aplica.
        motivo:
          type: string
          nullable: true
          enum: [no_disponible, no_iniciado, vencido, agotado, limite_cliente, comercio_no_aplica, requiere_subtotal_comercio, monto_minimo, sin_descuento, null]
          description: Por qué no aplica; null si aplica.
        mensaje:
          type: string
          description: Texto para mostrar a la persona compradora.

  responses:
    PaginacionInvalida:
      description: Nuevo en 1.3.0. pagina o por_pagina no es un entero dentro del rango (pagina >= 1, por_pagina de 1 a 50).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: ERR-005
              mensaje: Los datos enviados no son válidos.
              detalles:
                por_pagina: Debe estar entre 1 y 50.
    CriterioInvalido:
      description: El término está vacío o tiene menos de 2 caracteres y no se envió categoría (RN-M1-08).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: ERR-005
              mensaje: Ingrese un término de al menos 2 caracteres o elija una categoría.
              detalles:
                q: Debe tener al menos 2 caracteres si no se elige una categoría.
    DependenciaNoDisponible:
      description: Un módulo proveedor (M2, M3 o M4) no respondió dentro de 3 segundos (RNF-M1-04, caso A3).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: ERR-006
              mensaje: Servicio temporalmente no disponible, intente de nuevo.
              detalles: null
    NoAutenticado:
      description: No hay una sesión válida del núcleo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: ERR-001
              mensaje: Tu sesión expiró, inicia sesión de nuevo.
              detalles: null
    ClienteNoAccesible:
      description: |
        Solo en las rutas web. El cliente pedido no es la persona con sesión,
        o la cuenta con sesión no pertenece a ningún cliente (RN-M1-16,
        RNF-M1-08). Desde 1.2.0 responde 404 con ERR-003, igual que el
        aislamiento del núcleo, y no revela si ese cliente existe. En 1.1.0 se
        documentaba como 403.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: ERR-003
              mensaje: El recurso solicitado no existe o no es accesible.
              detalles: null
    ClienteNoEncontrado:
      description: No existe un cliente con ese identificador.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: ERR-004
              mensaje: No se encontró lo que buscas.
              detalles: null
    RecursoNoEncontrado:
      description: El producto, el comercio o la dirección no existe o no está disponible en el portal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: ERR-004
              mensaje: No se encontró lo que buscas.
              detalles: null
    CorreoDuplicado:
      description: El correo ya pertenece a otro cliente (RN-M1-14). Error propio del negocio de M1.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: ERR-M1-001
              mensaje: Ya existe una cuenta con ese correo.
              detalles: null
    RolSinPermiso:
      description: Nuevo en 1.4.0. La cuenta con sesión no tiene el rol que pide la ruta (núcleo).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: ERR-002
              mensaje: No se encuentra autorizado para realizar esta acción.
              detalles: null
    ConflictoDestacado:
      description: |
        Nuevo en 1.4.0. Errores propios del negocio de M1 para destacados:
        ERR-M1-002 si el comercio ya tiene 3 destacados activos en ese periodo;
        ERR-M1-003 si el producto ya está destacado o tiene una solicitud
        pendiente, o la solicitud ya fue resuelta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: ERR-M1-002
              mensaje: El comercio ya tiene el máximo de 3 productos destacados activos en ese periodo.
              detalles: null
    ConflictoPromocion:
      description: |
        Nuevo en 1.4.0. Errores propios del negocio de M1 para promociones:
        ERR-M1-004 si el producto o una de sus variaciones ya tiene otra
        promoción activa en fechas que se cruzan; ERR-M1-005 si la promoción ya
        terminó o fue desactivada y no se puede modificar.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: ERR-M1-004
              mensaje: El producto o una de sus variaciones ya tiene otra promoción activa en esas fechas.
              detalles: null
    ConflictoNoticia:
      description: |
        Nuevo en 1.4.0. ERR-M1-006 si la noticia está archivada (no se edita,
        no se publica ni se vuelve a archivar) o si ya está publicada y se
        intenta publicarla de nuevo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: ERR-M1-006
              mensaje: La noticia está archivada y no se puede editar.
              detalles: null
    ConflictoCupon:
      description: Nuevo en 1.5.0. ERR-M1-007 si ya existe un cupón con ese código, de cualquier comercio o de la plataforma.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: ERR-M1-007
              mensaje: Ya existe un cupón con ese código.
              detalles: null
    DatosInvalidos:
      description: Faltan datos obligatorios o tienen un formato incorrecto.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: ERR-005
              mensaje: Revise los datos enviados.
              detalles:
                correo_electronico: No tiene un formato de correo válido.

# ---------------------------------------------------------------
# Interfaz PHP App\Contracts\M1_Portal\PortalPublicoContract
# Es el contrato que usan M5 y M6 dentro de la misma aplicación Laravel.
# ---------------------------------------------------------------
x-interfaz-php:
  interfaz: App\Contracts\M1_Portal\PortalPublicoContract
  ubicacion: app/Contracts/M1_Portal/PortalPublicoContract.php
  excepciones:
    ubicacion: app/Contracts/M1_Portal/Exceptions/
    base: PortalPublicoException (extiende RuntimeException y expone codigo() con el código de error de la ruta web equivalente)
    lista:
      - ClienteNoEncontradoException (ERR-004)
      - DireccionNoEncontradaException (ERR-004)
      - RecursoNoEncontradoException (ERR-004, producto o comercio)
      - CriterioInvalidoException (ERR-005)
      - DatosInvalidosException (ERR-005, con detalles campo → mensaje)
      - DependenciaNoDisponibleException (ERR-006)
      - CorreoYaRegistradoException (ERR-M1-001)
      - LimiteDestacadosException (ERR-M1-002, desde 1.4.0; solo en las rutas web de destacados)
      - ConflictoDestacadoException (ERR-M1-003, desde 1.4.0; solo en las rutas web de destacados)
      - TraslapePromocionException (ERR-M1-004, desde 1.4.0; solo en las rutas web de promociones)
      - PromocionNoModificableException (ERR-M1-005, desde 1.4.0; solo en las rutas web de promociones)
      - NoticiaNoModificableException (ERR-M1-006, desde 1.4.0; solo en las rutas web de noticias)
      - CuponDuplicadoException (ERR-M1-007, desde 1.5.0; solo en las rutas web de cupones)
  doble_de_prueba: tests/Doubles/M1/PortalPublicoFake.php
  metodos:
    - firma: "obtenerCliente(int $idCliente): array"
      desde: 1.0.0
      cambios_en_1_1_0: Ninguno.
      cambios_en_1_7_0: Agrega identificacion_tributaria (cédula del cliente) para la factura de M6.
      consumidores: [M5, M6]
      retorna: Arreglo con la misma estructura que el esquema Cliente.
      excepciones:
        - ClienteNoEncontradoException (equivale a ERR-004)
      notas: Sin sesión de usuario; puede llamarse desde procesos en segundo plano.
    - firma: "listarDireccionesCliente(int $idCliente): array"
      desde: 1.1.0
      consumidores: [M5]
      retorna: Lista con la estructura del esquema DireccionCliente; la principal va primero.
      excepciones:
        - ClienteNoEncontradoException (equivale a ERR-004)
    - firma: "obtenerDireccionCliente(int $idCliente, int $idDireccionCliente): array"
      desde: 1.1.0
      consumidores: [M5]
      retorna: Arreglo con la estructura del esquema DireccionCliente.
      excepciones:
        - DireccionNoEncontradaException (equivale a ERR-004). También se lanza si la dirección no pertenece a ese cliente, para que M5 no pueda usar la dirección de otra persona.
      notas: Pensado para que M5 valide el id_direccion_cliente que recibe al confirmar el pedido.
    - firma: "obtenerIdClientePorUsuario(int $idUsuario): int"
      desde: 1.1.0
      consumidores: [Núcleo]
      retorna: El id_cliente asociado a la cuenta de acceso (clientes.id_usuario es único).
      excepciones:
        - ClienteNoEncontradoException (equivale a ERR-004). Se lanza si la cuenta no tiene un cliente asociado.
      notas: La usa el middleware EstablecerCliente del núcleo para registrar el id_cliente en ContextoCliente sin leer la tabla clientes. Sin sesión de usuario.
    - firma: "obtenerPreciosVigentes(array $idsVariacion): array"
      desde: 1.4.0
      consumidores: [M5]
      retorna: Arreglo indexado por id_variacion con la estructura del esquema PrecioVigente. precio_final es el precio_base si la variación no tiene una promoción vigente. Las que M3 no encuentra se omiten.
      parametros: Entre 1 y 100 id_variacion enteros mayores o iguales a 1.
      excepciones:
        - DatosInvalidosException (equivale a ERR-005) si la lista no es válida.
        - DependenciaNoDisponibleException (equivale a ERR-006) si M3 no responde.
      notas: M5 la usa al agregar al carrito y al confirmar el pedido para cobrar el precio rebajado; la comisión se calcula sobre ese precio. Sin sesión de usuario. Va en PortalPublicoContract porque M5 ya la consume ahí y su doble PortalStub ya la implementa.
  metodos_de_uso_interno:
    descripcion: |
      Los usan los controladores de M1, que son una capa delgada sobre la
      interfaz (sección 6 del enunciado). Hoy ningún otro módulo los consume.
      Cada uno corresponde a la ruta web con el mismo operationId.
    lista:
      - firma: "buscarProductos(?string $termino, ?int $idCategoria = null, ?int $idComercio = null, int $pagina = 1, int $porPagina = 20, ?int $idMarca = null, ?float $precioMinimo = null, ?float $precioMaximo = null, ?string $orden = null): array"
        notas: Los filtros de 1.1.0 se agregan al final como opcionales, así las llamadas de 1.0.0 siguen funcionando.
        excepciones: [CriterioInvalidoException, DependenciaNoDisponibleException]
      - firma: "listarDestacados(int $limite = 12): array"
      - firma: "listarCategoriasPortal(): array"
        excepciones: [DependenciaNoDisponibleException]
      - firma: "obtenerFichaProducto(int $idProducto): array"
        excepciones: [RecursoNoEncontradoException, DependenciaNoDisponibleException]
      - firma: "listarComercios(int $pagina = 1, int $porPagina = 20): array"
        notas: Desde 1.3.0, pagina menor que 1 o por_pagina fuera de 1 a 50 lanza DatosInvalidosException.
        excepciones: [DatosInvalidosException, DependenciaNoDisponibleException]
      - firma: "obtenerMicrositio(int $idComercio, int $pagina = 1, int $porPagina = 20): array"
        notas: Desde 1.3.0, si M3 no responde devuelve el micrositio con productos vacíos y productos_disponibles en false. pagina o por_pagina fuera de rango lanza DatosInvalidosException.
        excepciones: [RecursoNoEncontradoException, DatosInvalidosException, DependenciaNoDisponibleException]
      - firma: "registrarCliente(array $datos): int"
        notas: $datos sigue el esquema RegistroCliente (desde 1.2.0 con cedula y direccion). La contraseña se entrega al núcleo y M1 no la guarda.
        excepciones: [CorreoYaRegistradoException, DatosInvalidosException]
      - firma: "actualizarCliente(int $idCliente, array $datos): int"
        notas: $datos sigue el esquema DatosCliente. Desde 1.2.0 no modifica direcciones ni la cédula.
        excepciones: [ClienteNoEncontradoException, CorreoYaRegistradoException, DatosInvalidosException]
      - firma: "agregarDireccionCliente(int $idCliente, array $datos): array"
        excepciones: [ClienteNoEncontradoException, DatosInvalidosException]
      - firma: "actualizarDireccionCliente(int $idCliente, int $idDireccionCliente, array $datos): array"
        excepciones: [DireccionNoEncontradaException, DatosInvalidosException]

# ---------------------------------------------------------------
# Interfaz PHP App\Contracts\M1_Portal\ComercialPortalContract (desde 1.4.0)
# Va aparte de PortalPublicoContract para que quienes ya la implementan (por
# ejemplo, el doble de M5) no tengan que agregar métodos. Desde 1.5.0 incluye
# los cupones de descuento que consume M5.
# ---------------------------------------------------------------
x-interfaz-php-comercial:
  interfaz: App\Contracts\M1_Portal\ComercialPortalContract
  ubicacion: app/Contracts/M1_Portal/ComercialPortalContract.php
  doble_de_prueba: tests/Doubles/M1/ComercialPortalFake.php
  solicitud_de_cambio: SC-08 (1.4.0) y SC-11 (1.5.0)
  metodos:
    - firma: "validarCupon(string $codigo, int $idCliente, float $subtotal, array $idsComercios = [], array $subtotalesPorComercio = []): array"
      desde: 1.5.0
      consumidores: [M5 (checkout y confirmación del pedido)]
      retorna: Estructura del esquema ResultadoCupon.
      parametros: |
        $subtotal sin envío ni impuesto. $idsComercios es la lista de comercios
        del carrito. $subtotalesPorComercio es un arreglo id_comercio => subtotal;
        hace falta para un cupón de comercio en un carrito de varios comercios.
      excepciones:
        - DatosInvalidosException (equivale a ERR-005) si un parámetro no tiene el formato.
      notas: |
        Sin sesión de usuario. No registra el uso. Un cupón que no aplica no
        lanza excepción: responde valido=false con motivo y mensaje.
    - firma: "registrarUsoCupon(int $idCupon, int $idCliente, int $idPedido): bool"
      desde: 1.5.0
      consumidores: [M5 (dentro de la confirmación del pedido)]
      retorna: true si el uso quedó registrado (o ya lo estaba para ese pedido); false si el cupón no existe o ya no se puede usar.
      excepciones:
        - DatosInvalidosException (equivale a ERR-005) si un identificador es menor que 1.
      notas: |
        Idempotente por pedido. Bloquea el cupón dentro de una transacción para
        que dos pedidos simultáneos no superen el límite de usos. Si responde
        false, M5 no debe aplicar el descuento.
    - firma: "listarCargosDestacado(int $idComercio, string $desde, string $hasta): array"
      desde: 1.4.0
      consumidores: [M2 o M7 (liquidación al comercio; por confirmar en el Comité)]
      retorna: Lista con la estructura del esquema CargoDestacado, ordenada por fecha_cargo.
      parametros: $desde y $hasta en formato AAAA-MM-DD; se incluyen los dos días completos.
      excepciones:
        - DatosInvalidosException (equivale a ERR-005) si una fecha no tiene el formato o $desde es posterior a $hasta.
      notas: Sin sesión de usuario. Los destacados que pone la administración no generan cargo.

# ---------------------------------------------------------------
# Dependencias que M1 consume (validadas contra las versiones corregidas)
# ---------------------------------------------------------------
x-dependencias-consumidas:
  - modulo_proveedor: Núcleo
    operaciones: [ServicioIdentidad::crearCuenta, sesión de Laravel, políticas de autorización]
    uso: Crear la cuenta del cliente al registrarse y proteger las rutas de Clientes y Direcciones.
  - modulo_proveedor: M2
    version: 1.1.0
    operaciones: [ObtenerDatosComercioPublico, ObtenerResumenComerciosLote, ListarComerciosHabilitados]
    uso: Micrositio, comercios destacados, nombre del comercio en resultados y página de comercios.
  - modulo_proveedor: M3
    version: 1.2.0
    operaciones: [listarCategorias, listarMarcas, buscarProductos, obtenerProducto, listarRelacionados]
    uso: Menú de categorías, búsqueda y filtros, destacados (filtro ids), ficha y relacionados.
  - modulo_proveedor: M4
    version: 1.1.0
    operaciones: [consultarStockDisponible, consultarDisponibilidadLote, consultarDisponibilidadProducto, consultarDisponibilidadProductoLote]
    uso: Disponibilidad por variación en la ficha y por producto en resultados, destacados y micrositio. Todas son públicas.
    nota: consultarStockDisponible responde 404 si la variación no tiene inventario; M1 lo interpreta como Agotado mientras M4 no lo corrija.
  - modulo_proveedor: M5
    operaciones: [agregarItemCarrito, obtenerCarrito]
    uso: Botón Agregar al carrito de la ficha y contador del carrito del encabezado. Requieren sesión; sin sesión, el portal envía a iniciar sesión.

# ---------------------------------------------------------------
# Eventos que M1 consume (M1 no publica eventos)
# ---------------------------------------------------------------
x-eventos-consumidos:
  - nombre: ComercioAprobado
    productor: M2
    version: v1
    accion: Invalidar la caché del comercio para que su micrositio y productos aparezcan en el portal.
  - nombre: ComercioSuspendido
    productor: M2
    version: v1
    accion: Invalidar la caché del comercio. M1 no modifica sus tablas; el comercio deja de mostrarse porque M2 y M3 ya no lo devuelven.
  - nombre: ComercioReactivado
    productor: M2
    version: v1
    accion: Invalidar la caché del comercio para que vuelva a mostrarse, en la misma posición de destacados que tenía.
  - nombre: ExistenciaAgotada
    productor: M4
    version: 1.0.0 (pendiente de ratificación)
    accion: Marcar la variación y, si corresponde, el producto (id_producto del evento) como Agotado en la caché del portal.
  - nombre: ExistenciaRepuesta
    productor: M4
    version: 1.0.0 (pendiente de ratificación)
    accion: Quitar la marca de Agotado de la variación y del producto.
  - nota: M1 ya no consume ProductoPublicado. La búsqueda la ejecuta M3, por lo que M1 no mantiene un índice propio.

x-historial-versiones:
  - version: 1.0.0
    cambios: Publicación inicial.
  - version: 1.1.0
    cambios:
      - Sin cambios en la interfaz PHP obtenerCliente que usan M5 y M6, ni en los esquemas Cliente y DatosCliente.
      - Nuevas rutas web: categorías, ficha de producto, micrositio, listado de comercios y direcciones del cliente.
      - Nuevos métodos de la interfaz PHP para M5: listarDireccionesCliente y obtenerDireccionCliente.
      - Nuevos filtros de búsqueda (marca, precio, orden) y campo opcional precio_hasta, alineados con M3 1.2.0.
      - Registro de cliente coordinado con el núcleo; el cuerpo agrega la contraseña (esquema RegistroCliente).
      - Seguridad de las rutas web con la sesión de Laravel (Inertia con React), en lugar del token bearer.
      - Formato de error común del núcleo (sección 5.5) en las rutas web.
      - Declaración de dependencias y eventos consumidos según M2 1.1.0, M3 1.2.0 y M4 1.1.0.
      - Nuevo método de la interfaz PHP para el núcleo, obtenerIdClientePorUsuario, que usa el middleware EstablecerCliente.
      - Código propio ERR-M1-001 (correo ya registrado) según el formato ERR-M{n}-{nnn} del núcleo.
      - Registro de cliente con ServicioIdentidad::crearCuenta del núcleo y menú de categorías que cumple RN-M1-09.
      - Interfaz PHP documentada completa, con excepciones con nombre en lugar de RuntimeException con texto. Las excepciones extienden RuntimeException, así que las pruebas escritas con la 1.0.0 siguen pasando.
    nota_de_compatibilidad: |
      Los cambios de formato de error, de seguridad y del cuerpo de registro
      solo afectan a las rutas web, cuyo único consumidor es el frontend del
      propio M1. Ningún otro módulo usa esas rutas: M5 y M6 consumen M1 por la
      interfaz PHP, que no cambia. Por eso se publica como versión menor. Si el
      Comité considera que deben tratarse como cambios que rompen, se renombra
      esta versión como 2.0.0 sin modificar su contenido.
  - version: 1.2.0
    cambios:
      - Largos de DatosCliente alineados con la tabla clientes (nombre 80, apellidos 120).
      - Teléfono del cliente obligatorio y no vacío.
      - RegistroCliente agrega cedula (obligatoria, única, máximo 20) y direccion (DatosDireccionCliente), que se guarda como la dirección principal.
      - direccion_envio sale de la entrada (DatosCliente) y queda solo en la salida (Cliente), calculada a partir de la dirección principal (tercera forma normal; no se guarda en texto).
      - actualizarCliente ya no modifica direcciones; se usan las operaciones de Direcciones.
      - Nueva ruta web GET /clientes/sesion (obtenerClienteSesion) con los datos de la persona con sesión.
      - RN-M1-16 responde 404 ERR-003 (respuesta ClienteNoAccesible) en lugar de 403, alineado con la tabla de errores del núcleo (ERR-003 = 404) y sin revelar si el cliente existe.
      - Temporal - el correo del cliente no se puede cambiar hasta que el núcleo ofrezca actualizarCorreo.
      - actualizarDireccionCliente no permite desmarcar la dirección principal; se cambia marcando otra.
    nota_de_compatibilidad: |
      Sin cambios en las firmas de la interfaz PHP. El esquema Cliente que
      reciben M5 y M6 por obtenerCliente conserva los mismos campos
      (id_cliente, nombre, apellidos, correo_electronico, telefono,
      direccion_envio); solo se acotan los largos y telefono deja de venir
      vacío, lo que no afecta a quien lo lee. Los cambios de entrada solo
      afectan a POST y PUT /clientes, cuyo único consumidor es el frontend
      del propio M1. Por eso se publica como versión menor.
  - version: 1.3.0
    cambios:
      - Micrositio agrega el campo opcional productos_disponibles (false cuando M3 no responde); en ese caso el micrositio se muestra con la información del comercio y la lista de productos vacía, en lugar de fallar (CU-009).
      - GET /comercios y GET /comercios/{id_comercio}/micrositio responden 422 con ERR-005 (respuesta PaginacionInvalida) cuando pagina o por_pagina no es un entero dentro del rango.
      - listarComercios y obtenerMicrositio de la interfaz PHP documentan DatosInvalidosException para la paginación fuera de rango.
    solicitud_de_cambio: SC-07
    nota_de_compatibilidad: |
      Sin cambios en las firmas de la interfaz PHP. productos_disponibles es
      un campo opcional nuevo: quien no lo lee no se ve afectado. La
      respuesta 422 solo aplica a las rutas web de comercios y micrositio,
      cuyo único consumidor es el frontend del propio M1; ningún otro módulo
      llama a listarComercios ni a obtenerMicrositio. Por eso se publica como
      versión menor.
  - version: 1.4.0
    cambios:
      - GET /destacados muestra hasta 12 productos y comercios (limite por defecto y máximo 12, antes 8 y 24); un valor mayor se ajusta a 12 sin error.
      - Productos destacados con máximo 3 por comercio, sin los agotados (reaparecen solos al recuperar existencias) y rotados por turnos de 15 minutos cuando hay más de 12.
      - Los comercios destacados de GET /destacados los decide M2 (ListarComerciosHabilitados con destacado=true); M1 deja de usar su tabla comercios_destacados. La respuesta no cambia de forma.
      - listarDestacados de la interfaz PHP cambia su valor por defecto de 8 a 12.
      - Solicitud, aprobación y cobro de productos destacados. Rutas web nuevas - listarTarifasDestacado, solicitarDestacado, listarSolicitudesDestacado (comercio), listarSolicitudesDestacadoAdministracion, aprobarSolicitudDestacado, rechazarSolicitudDestacado, destacarProductoPlataforma y definirTarifaDestacado.
      - Máximo 3 destacados activos por comercio al aprobar o al destacar desde la administración (ERR-M1-002) y sin destacar dos veces el mismo producto en fechas que se cruzan (ERR-M1-003).
      - Nueva interfaz PHP ComercialPortalContract (x-interfaz-php-comercial) con listarCargosDestacado, para quien liquida al comercio. PortalPublicoContract no agrega métodos.
      - Nuevos códigos propios ERR-M1-002 y ERR-M1-003 (409) y respuesta RolSinPermiso (403, ERR-002 del núcleo).
      - Promociones de los comercios (M1 es el dueño de los datos) - porcentaje o precio fijo, con fecha y hora de inicio y fin, al producto completo o a variaciones específicas, sin traslapes (ERR-M1-004). Rutas web nuevas - listarPromocionesVigentes, crearPromocion, listarPromocionesComercio, actualizarPromocion, desactivarPromocion (ERR-M1-005), listarPromocionesAdministracion, ordenarPromocion, ocultarPromocion y mostrarPromocion.
      - ProductoResumen agrega el campo opcional promocion (PromocionResumen) y VariacionFicha los campos opcionales precio_promocional, id_promocion y fin_promocion; solo vienen cuando hay una promoción vigente.
      - Nuevo método de la interfaz PHP para M5 - obtenerPreciosVigentes (esquema PrecioVigente).
      - Noticias de la plataforma, que publica únicamente la administración (encargado_plataforma), con título, resumen, contenido, imagen (URL) y fecha de publicación; pueden enlazar promociones (tabla noticia_promociones de M1) pero son una entidad aparte. Rutas web nuevas - listarNoticias, obtenerNoticia (públicas), crearNoticia, listarNoticiasAdministracion, actualizarNoticia, publicarNoticia y archivarNoticia. Nuevo código propio ERR-M1-006 (409, noticia archivada o ya publicada).
    solicitud_de_cambio: SC-08
    nota_de_compatibilidad: |
      Sin cambios en el esquema Destacados ni en la firma de listarDestacados,
      salvo el valor por defecto del límite. Un consumidor que pida más de 12
      recibe hasta 12, sin error, porque el límite ya se ajustaba al rango.
      Las operaciones de destacados pagados y de promociones son rutas nuevas,
      los campos de promoción son opcionales y solo aparecen con una promoción
      vigente, y ComercialPortalContract va aparte. obtenerPreciosVigentes se
      agrega a PortalPublicoContract; el único que la implementa fuera de M1
      es el doble PortalStub de M5, que ya la tiene con la misma firma. Por
      eso se publica como versión menor.
  - version: 1.5.0
    cambios:
      - Cupones de descuento (M1 es el dueño de los datos; antes se mencionaban en el alcance de M5). Tablas nuevas cupones y cupon_usos.
      - Cada comercio crea cupones para sus productos y la administración crea los globales de la plataforma. Porcentaje o monto fijo, con fecha y hora de inicio y fin, monto mínimo de compra, límite de usos total y por cliente. El código es único en toda la plataforma (ERR-M1-007).
      - Rutas web nuevas - validarCupon (checkout, cliente con sesión), crearCuponComercio, listarCuponesComercio, desactivarCuponComercio, crearCuponGlobal, listarCuponesAdministracion y desactivarCuponAdministracion.
      - Un cupón global descuenta sobre todo el subtotal; uno de comercio, solo sobre el subtotal de los productos de ese comercio (subtotales_por_comercio).
      - ComercialPortalContract agrega validarCupon y registrarUsoCupon para M5 (esquema ResultadoCupon). PortalPublicoContract no agrega métodos.
      - Nuevo código propio ERR-M1-007 (409, código de cupón repetido).
    solicitud_de_cambio: SC-11
    nota_de_compatibilidad: |
      Todas las operaciones de cupones son rutas y esquemas nuevos; ninguna
      operación ni esquema existente cambia. Los dos métodos nuevos van en
      ComercialPortalContract, que fuera de M1 solo implementa el doble
      tests/Doubles/M1/ComercialPortalFake.php, ya actualizado. Por eso se
      publica como versión menor.
  - version: 1.6.0
    cambios:
      - listarComercios (GET /comercios) acepta el parámetro opcional q para buscar comercios por nombre comercial, sin distinguir mayúsculas ni tildes. M1 filtra el listado de M2, que no busca por nombre.
      - Ruta pública nueva listarCuponesVigentes (GET /cupones/vigentes) con los cupones globales vigentes para la portada (esquemas ListadoCuponesVigentes y CuponPublico).
      - PortalPublicoContract y ComercialPortalContract no cambian.
    solicitud_de_cambio: SC-13
    nota_de_compatibilidad: |
      Sin q, GET /comercios responde igual que en 1.5.0. La ruta y los esquemas
      de cupones son nuevos. Ninguna interfaz PHP cambia, así que los dobles de
      otros módulos que las implementan (por ejemplo, el PortalStub de M5)
      siguen funcionando. Por eso se publica como versión menor.
  - version: 1.7.0
    cambios:
      - El esquema Cliente agrega el campo identificacion_tributaria, la cédula del cliente (clientes.cedula), a pedido de M6 para emitir la factura con la identificación del comprador.
      - PortalPublicoContract::obtenerCliente lo devuelve; también las rutas web obtenerCliente (GET /clientes/{id_cliente}) y obtenerClienteSesion (GET /clientes/sesion), que solo responden a la propia persona (RN-M1-16).
      - El doble tests/Doubles/M1/PortalPublicoFake.php también lo devuelve.
    solicitud_de_cambio: SC-14
    nota_de_compatibilidad: |
      Es un campo nuevo de salida; ningún campo existente cambia ni se quita, y
      la firma de obtenerCliente es la misma. M5 lee los campos que ya usaba,
      y el doble PortalStub de M5 no necesita cambios. Por eso se publica como
      versión menor.
